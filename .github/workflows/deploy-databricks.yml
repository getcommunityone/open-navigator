# Deploy the agent-analysis-sync bundle to Databricks Free Edition (target `free`, #294), the way the Health
# Transformation Lab deploys its dev target: on every merge that changes the bundle, and on demand, signed in as
# the environment's service principal (OAuth M2M; apps/agent-analysis-sync/setup/create_service_principal.sh
# makes it).
#
# The GitHub environment `free` holds: variables DATABRICKS_HOST, DATABRICKS_CLIENT_ID; secret
# DATABRICKS_CLIENT_SECRET. Without the secret every step after sign-in skips, so the workflow stays green until
# the workspace is set up. Deploying creates schemas and a volume and the (paused) job; it never runs the job.
name: Deploy to Databricks Free Edition
on:
  push:
    branches: [main]
    paths:
      - "apps/agent-analysis-sync/**"
      - ".github/workflows/deploy-databricks.yml"
      - ".github/actions/databricks-signin/**"
  workflow_dispatch:
    inputs:
      run_analysis:
        description: Run one analysis batch after deploying (spends Free Edition quota)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: free
    concurrency:
      group: deploy-databricks-free
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/agent-analysis-sync
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/databricks-signin
        with:
          host: ${{ vars.DATABRICKS_HOST }}
          client_id: ${{ vars.DATABRICKS_CLIENT_ID }}
          client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - name: Stop if the environment isn't set up
        if: env.DATABRICKS_CLIENT_SECRET == ''
        run: echo "::notice::No DATABRICKS_CLIENT_SECRET in the free environment; skipping (see web_docs/docs/deployment/databricks-free-edition.md)."
      - uses: databricks/setup-cli@v1.3.0
        if: env.DATABRICKS_CLIENT_SECRET != ''
      - name: Validate
        if: env.DATABRICKS_CLIENT_SECRET != ''
        run: databricks bundle validate -t free
      - name: Deploy
        if: env.DATABRICKS_CLIENT_SECRET != ''
        run: databricks bundle deploy -t free
      - name: Run one analysis batch
        if: env.DATABRICKS_CLIENT_SECRET != '' && github.event.inputs.run_analysis == 'true'
        # Returns once Databricks has started the run; follow it from the run URL in the log.
        run: databricks bundle run -t free --no-wait agent_analysis_sync

    <!-- Google tag (gtag.js) — after DOM; avoids head-time null refs in strict embeds -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5EQV815915"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.addEventListener('DOMContentLoaded', function () {
        gtag('js', new Date());
        gtag('config', 'G-5EQV815915');
      });
    </script>
    
    <!-- Structured data (JSON-LD, #1430). One brand name everywhere: the Organization is CommunityOne; Open Navigator is its app. The section list matches web_app/src/data/seo/routes.json (tested in api/tests/test_seo.py). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.communityone.com/#organization",
      "name": "CommunityOne",
      "alternateName": "Open Navigator",
      "url": "https://www.communityone.com/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.communityone.com/communityone_logo_512.png",
        "width": 512,
        "height": 512
      },
      "description": "CommunityOne is a 501(c)(3) nonprofit that reads public records, local government meetings and nonprofit filings so anyone can follow what local governments decide.",
      "sameAs": [
        "https://www.linkedin.com/company/getcommunityone",
        "https://www.facebook.com/getcommunityone",
        "https://www.instagram.com/getcommunityone/",
        "https://x.com/getcommunityone/",
        "https://www.youtube.com/@getcommunityone",
        "https://github.com/getcommunityone/open-navigator"
      ]
    }
    </script>
    <!-- WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.communityone.com/#website",
      "name": "CommunityOne",
      "alternateName": "Open Navigator",
      "url": "https://www.communityone.com/",
      "description": "Track jurisdictions, nonprofits, and local policy with open data and AI.",
      "publisher": {
        "@id": "https://www.communityone.com/#organization"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.communityone.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- WebApplication: the app CommunityOne publishes -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Open Navigator",
      "url": "https://www.communityone.com/",
      "description": "Follows what local governments decide: cities, counties and school districts across the U.S. It covers nonprofits and reads meeting records for the decisions and debates in them.",
      "applicationCategory": "GovernmentApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@id": "https://www.communityone.com/#organization"
      },
      "featureList": [
        "Data stories from local government meetings",
        "Follow cities, counties and school districts",
        "Search meetings, decisions, officials and nonprofits",
        "Census data explorer"
      ]
    }
    </script>

# Prices for the usage report (#262). `python -m llm.usage.report` multiplies the
# logged token counts and GPU-hours by these.
#
# A price is used only when its value, its `source` and its `read_date` are all
# filled in. Anything left null shows as a blank cost in the report: no figure is
# assumed (CLAUDE.md, "No Fabricated Data"). A change is a pull request that
# updates the date.

# Model prices in USD per 1M tokens, by API mode. Thinking tokens are billed at
# the output rate. `cached_input_usd_per_1m` is the rate for input tokens the API
# reports as served from its cache. `valid_until` is the last day a rate applies:
# a call after it shows no cost until the new rate is added (#333).
#
# Gemini rates: Google's Gemini API pricing page, paid tier, per 1M tokens, the
# text / image / video rate (audio costs more and isn't priced here), read on
# 2026-11-14 (#266). `cached_input_usd_per_1m` is the page's "context caching
# price"; context-cache storage (per 1M tokens per hour) isn't counted. The same
# page says gemini-2.5-flash is deprecated: from 2026-12-01 its requests are routed
# to gemini-3.5-flash-lite and billed at that model's rates.
models:
  gemini-2.5-flash:
    source: https://ai.google.dev/gemini-api/docs/pricing
    read_date: "2026-11-14"
    interactive: {input_usd_per_1m: 0.30, cached_input_usd_per_1m: 0.03, output_usd_per_1m: 2.50}
    batch: {input_usd_per_1m: 0.15, cached_input_usd_per_1m: 0.03, output_usd_per_1m: 1.25}
  gemini-2.5-flash-lite:
    source: https://ai.google.dev/gemini-api/docs/pricing
    read_date: "2026-11-14"
    interactive: {input_usd_per_1m: 0.10, cached_input_usd_per_1m: 0.01, output_usd_per_1m: 0.40}
    batch: {input_usd_per_1m: 0.05, cached_input_usd_per_1m: 0.01, output_usd_per_1m: 0.20}
  gemini-3.5-flash-lite:
    source: https://ai.google.dev/gemini-api/docs/pricing
    read_date: "2026-11-14"
    interactive: {input_usd_per_1m: 0.30, cached_input_usd_per_1m: 0.03, output_usd_per_1m: 2.50}
    batch: {input_usd_per_1m: 0.15, cached_input_usd_per_1m: 0.015, output_usd_per_1m: 1.25}
  # 3.6 and 3.8 Flash: the page gives these rates "through December 31, 2026" and
  # double rates "starting January 1, 2027" (1.50 / 0.15 / 7.50; batch 0.75 / 0.075 / 3.75).
  gemini-3.6-flash:
    source: https://ai.google.dev/gemini-api/docs/pricing
    read_date: "2026-11-14"
    valid_until: "2026-12-31"
    interactive: {input_usd_per_1m: 0.75, cached_input_usd_per_1m: 0.075, output_usd_per_1m: 3.75}
    batch: {input_usd_per_1m: 0.375, cached_input_usd_per_1m: 0.0375, output_usd_per_1m: 1.875}
  gemini-3.8-flash:
    source: https://ai.google.dev/gemini-api/docs/pricing
    read_date: "2026-11-14"
    valid_until: "2026-12-31"
    interactive: {input_usd_per_1m: 0.75, cached_input_usd_per_1m: 0.075, output_usd_per_1m: 3.75}
    batch: {input_usd_per_1m: 0.375, cached_input_usd_per_1m: 0.0375, output_usd_per_1m: 1.875}
  # Gemma 4 (gemma-4-*): the page lists it free of charge on the free tier and "Not
  # available" on the paid tier, so there is no paid price to record; it shows no cost.
  # DeepSeek: its pricing page, per 1M tokens, read on 2026-11-14 (#328). Rates depend on
  # the time of day: `interactive` holds the peak rates and `interactive.off_peak` the
  # off-peak ones (half of peak). Peak hours are 01:00-04:00 and 06:00-10:00 UTC, Monday
  # to Friday; every other hour is off-peak. The page also makes Chinese public holidays
  # off-peak in full. Those dates aren't recorded here, so a call during peak hours on one
  # is priced at the peak rate and the estimate errs high. `cached_input_usd_per_1m` is
  # the page's "cache hit" input rate. deepseek-v4-flash (and deepseek-v4-flash-vision-exp)
  # are legacy names the page says are still accepted and billed at the Flash price.
  # deepseek-chat, the name the code used before, is neither listed nor accepted, so its
  # past calls show no cost.
  deepseek-flash: &deepseek_flash
    source: https://api-docs.deepseek.com/quick_start/pricing/
    read_date: "2026-11-14"
    peak: &deepseek_peak {days: [mon, tue, wed, thu, fri], hours_utc: ["01:00-04:00", "06:00-10:00"]}
    interactive:
      input_usd_per_1m: 0.30
      cached_input_usd_per_1m: 0.006
      output_usd_per_1m: 1.20
      off_peak: {input_usd_per_1m: 0.15, cached_input_usd_per_1m: 0.003, output_usd_per_1m: 0.60}
  deepseek-v4-flash: *deepseek_flash
  deepseek-v4-pro:
    source: https://api-docs.deepseek.com/quick_start/pricing/
    read_date: "2026-11-14"
    peak: *deepseek_peak
    interactive:
      input_usd_per_1m: 1.32
      cached_input_usd_per_1m: 0.044
      output_usd_per_1m: 3.96
      off_peak: {input_usd_per_1m: 0.66, cached_input_usd_per_1m: 0.022, output_usd_per_1m: 1.98}
  # TypeSafe Jev (transcript screening, llm.typesafe): $0.042 per 1M input tokens, and
  # output tokens are free. The page gives the same price for jev-1.14.0 and
  # jev-1.13.0. Responses name the versioned model, so the "jev-" prefix matches both.
  jev-:
    source: https://docs.typesafe.ai/models.md
    read_date: "2026-11-15"
    interactive: {input_usd_per_1m: 0.042, output_usd_per_1m: 0.0}

# GPU prices in USD per GPU-hour, matched against the name `nvidia-smi` reports
# (the key is searched for in the name, so "T4" matches "Tesla T4"). These are
# ESTIMATES of what the GPU time would rent for on a cloud: the median on-demand
# price across the providers the source lists. A Colab or Kaggle GPU is paid for
# in compute units or not at all. Values, sources and dates are the ones
# health-transformation-lab-nlp records in ops/cost_settings.yaml.
gpus:
  T4:
    usd_per_gpu_hour: 0.69
    source: https://getdeploying.com/gpus/nvidia-t4
    read_date: "2026-11-04"
  L4:
    usd_per_gpu_hour: 0.83
    source: https://getdeploying.com/gpus/nvidia-l4
    read_date: "2026-11-11"
  A100:
    usd_per_gpu_hour: 1.87
    source: https://getdeploying.com/gpus/nvidia-a100
    read_date: "2026-11-12"

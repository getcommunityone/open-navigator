[project]
name = "communityone-datamodels"
version = "0.1.0"
description = "Shared data models for CommunityOne."
requires-python = ">=3.11"
dependencies = [
    # models.odcs (#270): reads dbt schema.yml, validates ODCS contracts, logs.
    "PyYAML>=6",
    "jsonschema>=4.18",
    "loguru>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Import name stays `models` during the migration so no call sites change.
[tool.hatch.build.targets.wheel]
packages = ["models"]

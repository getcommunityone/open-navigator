apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-event_meeting_document
name: event_meeting_document
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.event_meeting_document`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- id: event_meeting_document
  name: event_meeting_document
  physicalName: public.event_meeting_document
  logicalType: object
  description: 'public.event_meeting_document — scraped meeting AGENDA / MINUTES PDFs linked to the meeting they belong to (public.event_meeting), so the API can show document links on a decision / meeting. One row per document. Matched on jurisdiction (census geoid embedded in event_meeting.jurisdiction) + date + canonical body key. event_meeting_id is NULL for orphan documents and for meetings whose agenda/minutes is not yet published. Source: the SuiteOne municipal-calendar crawl in bronze (general — driven only by meeting_date_source=''suiteone_listing'', not city-specific).'
  dataGranularityDescription: One row per document.
  properties:
  - id: event_meeting_document_id
    name: event_meeting_document_id
    logicalType: string
    physicalType: text
    description: Primary key — md5(jurisdiction_id || '|' || url_sha256), stable per document.
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: event_meeting_id
    name: event_meeting_id
    logicalType: integer
    physicalType: integer
    description: FK -> public.event_meeting.event_meeting_id (the matched analyzed meeting). NULLABLE — orphan documents and not-yet-published agenda/minutes keep a NULL value. Enforced FK (event_meeting has a single-column PK).
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: Canonical jurisdiction id (e.g. 'tuscaloosa_0177256').
    required: true
  - id: census_geoid
    name: census_geoid
    logicalType: string
    physicalType: text
    description: Census GEOID of the jurisdiction (e.g. '0177256').
    required: true
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code (e.g. 'AL').
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name (e.g. 'Alabama').
  - id: document_type
    name: document_type
    logicalType: string
    physicalType: text
    description: Document kind — 'agenda', 'minutes', or 'attachment'.
    required: true
  - id: document_url
    name: document_url
    logicalType: string
    physicalType: text
    description: URL of the agenda/minutes PDF (the document link).
    required: true
  - id: doc_date
    name: doc_date
    logicalType: date
    physicalType: date
    description: Meeting date the document is for (real DATE).
  - id: body_name
    name: body_name
    logicalType: string
    physicalType: text
    description: Canonical body category (key) the document/meeting belongs to (e.g. 'finance', 'council', 'projects').
  - id: meeting_title
    name: meeting_title
    logicalType: string
    physicalType: text
    description: Original SuiteOne meeting title (e.g. '3:00 p.m. Finance Committee').
  - id: content
    name: content
    logicalType: string
    physicalType: text
    description: Extracted PDF text body (from bronze.bronze_meeting_document_text, joined on jurisdiction_id + url_sha256). NULLABLE — populated only where text was extracted (~497 Tuscaloosa agenda/minutes today); NULL for non-Tuscaloosa docs and attachments.
  - id: word_count
    name: word_count
    logicalType: integer
    physicalType: integer
    description: Word count of the extracted PDF text. NULLABLE — present only where content is.
  - id: content_tsv
    name: content_tsv
    logicalType: string
    physicalType: tsvector
    description: Stored full-text search vector over content + meeting_title + body_name, so search ranks/matches without recomputing to_tsvector. Backed by a GIN index (see model post_hook).
  - id: source
    name: source
    logicalType: string
    physicalType: text
    description: Constant 'suiteone' — the scrape source.
    required: true
  - id: created_at
    name: created_at
    logicalType: timestamp
    physicalType: timestamp
    description: When the document row was landed in bronze.

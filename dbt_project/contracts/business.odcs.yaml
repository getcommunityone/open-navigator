  physicalName: public.business
  logicalType: object
  description: 'The businesses that meetings and decisions name (#1089, #1088). One row per business named in at least one meeting or decision; government bodies and political committees are left out. business_type_code is set by fixed rules (nonprofit, then corporation, then local_business). is_all_locations is true for every data center company and for a corporation named in 2 or more states; those rows have no single city.'

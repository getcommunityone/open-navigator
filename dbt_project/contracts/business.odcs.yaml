    name: business_id
    logicalType: string
    physicalType: text
    description: 'Primary key: master_org_id when the name matched the organization master, else md5(normalized name | state_code).'
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: business_name
    name: business_name
    logicalType: string
    physicalType: text
    description: The name as the most recent record gives it.
    required: true
  - id: business_type_code
    name: business_type_code
    logicalType: string
    physicalType: text
    description: nonprofit, corporation or local_business.
    required: true
    quality:

schema:
- id: data_center_meeting_lean
  name: data_center_meeting_lean
  physicalName: public.data_center_meeting_lean
  logicalType: object
  description: One row per data center meeting video (in data_center_meeting_mention) with a Jev screen under the current question version. public_lean / official_lean are Jev's (a classifier's) reading of the transcript, not counted speakers. public_against = the public mostly opposed with P >= 0.7. officials_sided_against_public = the public mostly opposed, officials mostly supportive, the outcome not a moratorium or denial, and not an approval of rules (dc_outcome approved with project_approved_p < 0.3). Supported and mixed public leans are kept for audit only; they are not shown on maps.
  dataGranularityDescription: One row per data center meeting video (in data_center_meeting_mention) with a Jev screen under the current question version.
  properties:
  - id: video_id
    name: video_id
    logicalType: string
    physicalType: text
    description: 'Primary key: YouTube video id of the meeting recording.'
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code of the meeting's government.
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: The government whose meeting it is (FK to jurisdictions); null when the video's place isn't in jurisdictions.
    relationships:
    - type: foreignKey
      to: jurisdictions.odcs.yaml#/schema/jurisdictions/properties/jurisdiction_id
  - id: jurisdiction_name
    name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: Jurisdiction name as resolved for the video.
  - id: meeting_date
    name: meeting_date
    logicalType: date
    physicalType: date
    description: 'Meeting date (null when the source date is in the future, #472).'
  - id: public_lean
    name: public_lean
    logicalType: string
    physicalType: text
    description: 'Jev''s top answer for members of the public on a data center: mostly_opposed, mostly_supported, mixed or no_public_comment_on_data_center.'
  - id: public_lean_p
    name: public_lean_p
    logicalType: number
    physicalType: numeric
    description: Jev's probability for public_lean.
  - id: official_lean
    name: official_lean
    logicalType: string
    physicalType: text
    description: 'Jev''s top answer for elected officials: mostly_supportive, mostly_opposed, divided or no_official_position.'
  - id: official_lean_p
    name: official_lean_p
    logicalType: number
    physicalType: numeric
    description: Jev's probability for official_lean.
  - id: dc_outcome
    name: dc_outcome
    logicalType: string
    physicalType: text
    description: Jev's reading of what happened to the data center item (approved, denied, moratorium, tabled_or_deferred, discussed_no_action, no_data_center_item).
  - id: project_approved_p
    name: project_approved_p
    logicalType: number
    physicalType: numeric
    description: Jev's P(the approved item was a specific data center project, not rules limiting data centers); null until screened.
  - id: public_against
    name: public_against
    logicalType: boolean
    physicalType: boolean
    description: public_lean = mostly_opposed and public_lean_p >= 0.7.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: officials_sided_against_public
    name: officials_sided_against_public
    logicalType: boolean
    physicalType: boolean
    description: 'The refined disagreement rule (#1113): public mostly opposed, officials mostly supportive, outcome not moratorium/denied, and not approving rules (approved with project_approved_p < 0.3).'
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: question_version
    name: question_version
    logicalType: string
    physicalType: text
    description: The Jev question version the row was screened under (the current one).
    required: true
  - id: screened_at
    name: screened_at
    logicalType: timestamp
    physicalType: timestamptz
    description: When Jev screened the meeting.
    required: true

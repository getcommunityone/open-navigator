apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-topic_legislation_bill
name: topic_legislation_bill
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.topic_legislation_bill`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- id: topic_legislation_bill
  name: topic_legislation_bill
  physicalName: public.topic_legislation_bill
  logicalType: object
  description: 'OpenStates state bills about each curated topic, with a category from that topic''s vocabulary (#1274). One row per (topic_id, bill_id). Every topic in the curated_topics seed is matched by its keywords column (whole words, minus the topic_legislation_scope seed''s drop_keywords), filtered by that seed''s require/exclude patterns, and categorised by the first matching rule in the topic_legislation_rule seed (the topic''s own rules, else the generic restrict/support/other set). status (enacted, passed_chamber, pending, failed) comes from the bill''s latest action, chapter citations and whether its session is over in our data. Rule and hand check: web_docs/docs/development/topic-legislation-map.md.'
  dataGranularityDescription: One row per (topic_id, bill_id).
  properties:
  - id: topic_id
    name: topic_id
    logicalType: integer
    physicalType: integer
    description: FK to civicsearch_topic (e.g. 100001 data centers, 100002 water fluoridation).
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    relationships:
    - type: foreignKey
      to: civicsearch_topic.odcs.yaml#/schema/civicsearch_topic/properties/topic_id
  - id: topic_query_id
    name: topic_query_id
    logicalType: string
    physicalType: text
    description: The topic's slug (curated_topics.query_id), e.g. 'water-fluoridation'.
    required: true
  - id: bill_id
    name: bill_id
    logicalType: string
    physicalType: text
    description: FK to bills.bill_uid.
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    relationships:
    - type: foreignKey
      to: bills.odcs.yaml#/schema/bills/properties/bill_uid
  - id: ocd_bill_id
    name: ocd_bill_id
    logicalType: string
    physicalType: text
    description: OpenStates OCD bill id.
    required: true
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code.
    required: true
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name.
  - id: identifier
    name: identifier
    logicalType: string
    physicalType: text
    description: Bill number, e.g. 'HB 2395'.
  - id: title
    name: title
    logicalType: string
    physicalType: text
  - id: session
    name: session
    logicalType: string
    physicalType: text
    description: OpenStates session identifier, e.g. '2025-2026'.
  - id: session_name
    name: session_name
    logicalType: string
    physicalType: text
  - id: category
    name: category
    logicalType: string
    physicalType: text
    description: 'From the topic''s vocabulary (topic_legislation_category): ban/restriction/protection/study/unclear for water fluoridation, restrict/incentive/protect for data centers, restrict/support/other otherwise.'
    required: true
  - id: status
    name: status
    logicalType: string
    physicalType: text
    description: enacted | passed_chamber | pending | failed, from the bill's own OpenStates fields (latest action, chapter citations, passage date, session closed).
    required: true
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - enacted
        - passed_chamber
        - pending
        - failed
      mustBe: 0
      dimension: conformity
      severity: error
  - id: passed_a_chamber
    name: passed_a_chamber
    logicalType: boolean
    physicalType: boolean
    description: True when the bill was enacted or OpenStates records a passage vote in at least one chamber (also for a bill that later failed).
    required: true
  - id: matched_term
    name: matched_term
    logicalType: string
    physicalType: text
    description: The first topic keyword found in the title or abstract (lowercase).
  - id: introduced_date
    name: introduced_date
    logicalType: date
    physicalType: date
    description: The bill's first action date.
  - id: last_action_date
    name: last_action_date
    logicalType: date
    physicalType: date
    description: The bill's latest action date.
  - id: last_action_description
    name: last_action_description
    logicalType: string
    physicalType: text
  - id: year
    name: year
    logicalType: integer
    physicalType: integer
    description: Calendar year of the latest action (integer).
  - id: url
    name: url
    logicalType: string
    physicalType: text
    description: The bill's OpenStates page.
  - id: dbt_loaded_at
    name: dbt_loaded_at
    logicalType: timestamp
    physicalType: timestamp with time zone
  relationships:
  - type: foreignKey
    from:
    - schema/topic_legislation_bill/properties/topic_id
    - schema/topic_legislation_bill/properties/category
    to:
    - topic_legislation_category.odcs.yaml#/schema/topic_legislation_category/properties/topic_id
    - topic_legislation_category.odcs.yaml#/schema/topic_legislation_category/properties/category

  description: 'What kind of video each quoted recording is (#1230): Jev''s meeting_kind for every video a topic link or a data-center mention quotes and that Jev screened. One row per video_id. The story map cards quote only videos read as a public meeting (or never screened), never a media briefing, interview, podcast or stream. A classifier''s reading, nothing tied to a person. Feeds GET /api/topics/{topic_id}/states (newest) and GET /api/data-centers/meeting-mentions?quotes_per_state=.'

# Generated by `python -m models.odcs --write` from the ODCS contracts in dbt_project/contracts/ (issue #274).
# Do not edit by hand: change the dbt schema.yml or models.odps.PRODUCTS, then regenerate.
apiVersion: v1.0.0
kind: DataProduct
id: open-navigator-public-api
name: Open Navigator public API
version: 1.0.0
status: active
domain: civic
description:
  purpose: The tables the Open Navigator public API serves from the `public` schema, each described by an ODCS data contract.
  usage: Read through the Open Navigator public API. Each output port is one table; its contractId names the ODCS contract in dbt_project/contracts/ that gives its columns, keys and quality rules.
  limitations: 'Lists the served tables that have an enforced dbt contract; the others are listed in web_docs/docs/development/data-contracts.md. Structure only: no row counts, freshness or service levels.'
tags:
- open-navigator
- public-api
outputPorts:
- name: event
  version: 1.0.0
  contractId: open-navigator-public-event
  type: table
  description: MDM consolidated event — the single golden-record event surface in the public schema.
- name: event_documents
  version: 1.0.0
  contractId: open-navigator-public-event_documents
  type: table
  description: Searchable documents attached to a golden-record event.
- name: event_meeting_document
  version: 1.0.0
  contractId: open-navigator-public-event_meeting_document
  type: table
  description: Scraped meeting AGENDA / MINUTES PDFs linked to the meeting they belong to (public.event_meeting), so the API can show document links on a decision / meeting.
- name: event_decision_place
  version: 1.0.0
  contractId: open-navigator-public-event_decision_place
  type: table
  description: Bridge, one row per (decision, place_id).
- name: decision_speakers
  version: 1.0.0
  contractId: open-navigator-public-decision_speakers
  type: table
  description: One row per event_decision_id listing the DISTINCT person_id slugs that gave named testimony on that decision, extracted from event_decision.human_element->'personal_stories'.
- name: contact_official
  version: 1.0.0
  contractId: open-navigator-public-contact_official
  type: table
  description: API-ready current government officials (mayors, council members, legislators) sourced from the OpenStates opencivicdata_* tables.
- name: person_government
  version: 1.0.0
  contractId: open-navigator-public-person_government
  type: table
  description: Government officials modelled as a PERSON SUBTYPE ("subclass" of person).
- name: jurisdictions
  version: 1.0.0
  contractId: open-navigator-public-jurisdictions
  type: table
  description: API-ready jurisdiction table consumed by search_jurisdictions_pg (api/routes/search_postgres.py) and the frontend jurisdiction search.
- name: jurisdiction_county_crosswalk
  version: 1.0.0
  contractId: open-navigator-public-jurisdiction_county_crosswalk
  type: table
  description: One row per city/town geoid mapping it to the 5-digit FIPS of its containing county (plus the county's name), consumed by the search county-broaden filter (resolve_county_crosswalk, api/routes/search_postgres.py).
- name: jurisdiction_document
  version: 1.0.0
  contractId: open-navigator-public-jurisdiction_document
  type: table
  description: Jurisdiction-grain civic documents (comprehensive plan / framework, zoning ordinance, ordinance code, zoning map) that belong to a JURISDICTION rather than a single meeting, so the API can surface "plans & ordinances" on a jurisdiction view and link them to civic data.
- name: jurisdiction_finance
  version: 1.0.0
  contractId: open-navigator-public-jurisdiction_finance
  type: table
  description: One row per government (latest fiscal year) with headline revenue/expenditure/tax totals and an 8-bucket expenditure-by-function breakdown, from the U.S. Census Annual Survey of State & Local Government Finances (TPC/Urban Institute republication, bronze.bronze_jurisdiction_tpc).
- name: jurisdiction_finance_category
  version: 1.0.0
  contractId: open-navigator-public-jurisdiction_finance_category
  type: table
  description: 'Tidy/long companion to jurisdiction_finance: one row per (government x expenditure category) with amount (whole dollars) and share_pct of direct_expenditure.'
- name: jurisdiction_property_tax_rate
  version: 1.0.0
  contractId: open-navigator-public-jurisdiction_property_tax_rate
  type: table
  description: Effective property-tax rate per place and county, from ACS B25103 (median real estate taxes paid) ÷ B25077 (median home value), 5-year estimates.
- name: state_sales_tax_rate
  version: 1.0.0
  contractId: open-navigator-public-state_sales_tax_rate
  type: table
  description: Combined state + average-local general sales-tax rate per state (50 states + DC), from the Tax Foundation report "State and Local Sales Tax Rates, 2026" (as of 2026-01-01).
- name: opportunity_atlas_mobility
  version: 1.0.0
  contractId: open-navigator-public-opportunity_atlas_mobility
  type: table
  description: 'Commuting-zone (CZ) intergenerational mobility, long/tidy: one row per (cz, race, gender, parent_income_level).'
- name: opportunity_atlas_mobility_national
  version: 1.0.0
  contractId: open-navigator-public-opportunity_atlas_mobility_national
  type: table
  description: 'National rollup of the CZ Opportunity Atlas mobility measures: one row per (race, gender, parent_income_level).'
- name: jurisdiction_minutes_publish_lag
  version: 1.0.0
  contractId: open-navigator-public-jurisdiction_minutes_publish_lag
  type: table
  description: Per-jurisdiction statistics for how long minutes typically take to publish after a meeting.
- name: grant
  version: 1.0.0
  contractId: open-navigator-public-grant
  type: table
  description: 'One row per GivingTuesday 990 Schedule I Part II grant line (nonprofit grantmaking: grantor org -> grantee, cash amount, purpose).'
- name: grant_opportunity
  version: 1.0.0
  contractId: open-navigator-public-grant_opportunity
  type: table
  description: One row per Grants.gov federal funding opportunity (prospective grants open / forecasted for application), from stg_grants_gov__opportunity.
- name: tag
  version: 1.0.0
  contractId: open-navigator-public-tag
  type: table
  description: Unified, hierarchical tag taxonomy (NTEE + EveryOrg) — replaces the ad-hoc public.cause_ntee.
- name: rpt_bill_map_aggregate
  version: 1.0.0
  contractId: open-navigator-public-rpt_bill_map_aggregate
  type: table
  description: Pre-aggregated bill SUBJECTS (topics) by jurisdiction for fast map/geography "trending topics" queries.
- name: bills
  version: 1.0.0
  contractId: open-navigator-public-bills
  type: table
  description: One row per OpenStates bill (PK bill_uid = md5 over ocd_bill_id).
- name: cpi_annual
  version: 1.0.0
  contractId: open-navigator-public-cpi_annual
  type: table
  description: Annual-average BLS CPI index, one row per (series_id, year).
- name: item_interestingness
  version: 1.0.0
  contractId: open-navigator-public-item_interestingness
  type: table
  description: Tunable, explainable interestingness score per civic agenda item (decision).
- name: item_flags
  version: 1.0.0
  contractId: open-navigator-public-item_flags
  type: table
  description: Per-(subject, flag) anomaly scaffold for the Raised Eyebrows lens.
- name: nonprofit_sector_revenue
  version: 1.0.0
  contractId: open-navigator-public-nonprofit_sector_revenue
  type: table
  description: Pre-computed 990 nonprofit-sector revenue decomposition (contributions, program-service revenue, total revenue, org count) at us / per-state / per-city grains, so the money-flow "economy" lens reads one row scoped to the visitor's jurisdiction instead of scanning the full satellite per request.
- name: topic_money_and_talk
  version: 1.0.0
  contractId: open-navigator-public-topic_money_and_talk
  type: table
  description: Per (jurisdiction, canonical COFOG theme, month) rollup of the "talk" (decision_count) vs the "money" (spend_amount = SUM(ABS(net_dollar_impact))) signals, powering the topic money-vs-talk web feature.
- name: civicsearch_topic
  version: 1.0.0
  contractId: open-navigator-public-civicsearch_topic
  type: table
  description: The CivicSearch policy-topic taxonomy CivicSearch uses to tag meeting transcript snippets.
- name: browse_transcript_count
  version: 1.0.0
  contractId: open-navigator-public-browse_transcript_count
  type: table
  description: Per-entity count of DISTINCT transcript videos (public.event_documents, document_type='transcript') linked to each browseable homepage entity.
- name: browse_directory_summary
  version: 1.0.0
  contractId: open-navigator-public-browse_directory_summary
  type: table
  description: Homepage Browse-card rollup.
- name: browse_entity_state_transcript_count
  version: 1.0.0
  contractId: open-navigator-public-browse_entity_state_transcript_count
  type: table
  description: Per-entity-per-state count of DISTINCT transcript videos (public.event_documents, document_type= 'transcript') linked to each browseable homepage entity.
- name: mdm_organization
  version: 1.0.0
  contractId: open-navigator-public-mdm_organization
  type: table
  description: MDM golden record (MDM Layer 5) — one resolved/survivorship row per organization cluster, built from int_organizations__clustered.
- name: mdm_organization_nonprofit
  version: 1.0.0
  contractId: open-navigator-public-mdm_organization_nonprofit
  type: table
  description: 'MDM satellite: IRS/990 nonprofit detail (NTEE, financials, GivingTuesday 990) for the subset of mdm_organization that carries an EIN.'
- name: mdm_bridge_org_jurisdiction
  version: 1.0.0
  contractId: open-navigator-public-mdm_bridge_org_jurisdiction
  type: table
  description: 'MDM many-to-many: organization <-> jurisdiction across three geographic tiers (state, city, county).'
- name: mdm_bridge_event_analysis
  version: 1.0.0
  contractId: open-navigator-public-mdm_bridge_event_analysis
  type: table
  description: 'MDM crosswalk linking the AI-extraction family to the golden record: event_meeting (analysis) -> event (master).'
- name: policy_question
  version: 1.0.0
  contractId: open-navigator-public-policy_question
  type: table
  description: 'Registry of recurring, jurisdiction-neutral policy questions minted by clustering decisions (Phase 2: + bills) within a coarse theme and labeling each cluster.'
- name: canonical_argument
  version: 1.0.0
  contractId: open-navigator-public-canonical_argument
  type: table
  description: Recurring pro/con key points per policy question (Key Point Analysis), each tagged with a Boydstun policy frame.
- name: question_instance
  version: 1.0.0
  contractId: open-navigator-public-question_instance
  type: table
  description: Polymorphic bridge of decisions/bills to the policy question they instantiate, with normalized outcome.
- name: instance_argument
  version: 1.0.0
  contractId: open-navigator-public-instance_argument
  type: table
  description: Bridge from a question instance to each canonical argument it expressed, with the local verbatim excerpt + cosine match score.
- name: policy_question_relation
  version: 1.0.0
  contractId: open-navigator-public-policy_question_relation
  type: table
  description: Cross-level edges between policy questions (Phase 3).
- name: policy_question_trend
  version: 1.0.0
  contractId: open-navigator-public-policy_question_trend
  type: table
  description: Per-question quarterly history (one row per question_id × quarter).
- name: question_transcript_link
  version: 1.0.0
  contractId: open-navigator-public-question_transcript_link
  type: table
  description: 'One row per (question_id, video_id): a curated/featured policy question whose alias keyword phrase(s) full-text matched a real meeting transcript.'
- name: meeting_browse
  version: 1.0.0
  contractId: open-navigator-public-meeting_browse
  type: table
  description: Meeting-grain browse/serving rollup.
- name: meeting_topic_link
  version: 1.0.0
  contractId: open-navigator-public-meeting_topic_link
  type: table
  description: One row per (event_meeting_id, link_type, link_id).
- name: meeting_question_link
  version: 1.0.0
  contractId: open-navigator-public-meeting_question_link
  type: table
  description: One row per (event_meeting_id, question_id).

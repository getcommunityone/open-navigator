    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: topic_id
    name: topic_id
    logicalType: integer
    physicalType: integer
    description: 'FK to civicsearch_topic: the curated topic read.'

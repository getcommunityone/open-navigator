    name: state
    logicalType: string
    physicalType: text
    description: Full state name.
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: The meeting's government, when resolved (event_youtube_with_jurisdiction).
  - id: jurisdiction_name
    name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: The meeting's government name, as the topic link gives it.
  - id: meeting_date
    name: meeting_date
    logicalType: date
    physicalType: date
    description: Meeting date, when known.
  - id: public_lean
    name: public_lean
    logicalType: string
    physicalType: text

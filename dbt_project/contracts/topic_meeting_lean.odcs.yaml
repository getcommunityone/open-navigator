  description: Jev's AI reading of how the public and elected officials leaned on a curated topic, per meeting (#1126). One row per (video_id, topic_id) for meetings linked to the topic with a reading under the topic's current question version. A classifier's reading of the transcript, never counted speakers; nothing is tied to a person. Feeds GET /api/topics/{topic_id}/state-map (#1127) and the topic caption facts (#1125).

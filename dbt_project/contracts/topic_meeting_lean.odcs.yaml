apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-topic_meeting_lean
name: topic_meeting_lean
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.topic_meeting_lean`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- id: topic_meeting_lean
  name: topic_meeting_lean
  physicalName: public.topic_meeting_lean
  logicalType: object
  description: 'One row per meeting video and topic (topic_transcript_link) with a Jev screen under the topic''s current question version. Topics: guns, short-term rentals, pickleball, license plate readers, water fluoridation. public_lean / official_lean are Jev''s (a classifier''s) reading of the transcript, not counted speakers: mostly_supportive, mostly_opposed, mixed or did_not_speak (water fluoridation: mostly_supportive, mostly_opposed, no_opinion or did_not_speak, rolled up from five positions, kept in public_position / official_position). public_against / public_for = the public mostly opposed / supportive with p >= 0.7. officials_sided_against_public = the public mostly opposed, officials mostly supportive, and the body did not block the subject (outcome_group <> blocked). The same thresholds as data_center_meeting_lean.'
  dataGranularityDescription: One row per meeting video and topic (topic_transcript_link) with a Jev screen under the topic's current question version.
  properties:
  - id: video_id
    name: video_id
    logicalType: string
    physicalType: text
    description: YouTube video id of the meeting recording. Part of the primary key.
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: topic_id
    name: topic_id
    logicalType: integer
    physicalType: integer
    description: The curated topic (FK to civicsearch_topic). Part of the primary key.
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    relationships:
    - type: foreignKey
      to: civicsearch_topic.odcs.yaml#/schema/civicsearch_topic/properties/topic_id
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: topic_slug
    name: topic_slug
    logicalType: string
    physicalType: text
    description: 'The topic''s CLI slug: guns, short-term-rentals, pickleball, license-plate-readers or water-fluoridation.'
    required: true
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code of the meeting (from topic_transcript_link).
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name.
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: The government whose meeting it is (FK to jurisdictions); null when the video's place isn't in jurisdictions.
    relationships:
    - type: foreignKey
      to: jurisdictions.odcs.yaml#/schema/jurisdictions/properties/jurisdiction_id
  - id: jurisdiction_name
    name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: Jurisdiction name as resolved for the video.
  - id: meeting_date
    name: meeting_date
    logicalType: date
    physicalType: date
    description: 'Meeting date (null when the source date is in the future, #472).'
  - id: public_lean
    name: public_lean
    logicalType: string
    physicalType: text
    description: 'Jev''s reading for members of the public: mostly_supportive, mostly_opposed, mixed, no_opinion (fluoridation only) or did_not_speak.'
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - mostly_supportive
        - mostly_opposed
        - mixed
        - no_opinion
        - did_not_speak
      mustBe: 0
      dimension: conformity
      severity: error
  - id: public_lean_p
    name: public_lean_p
    logicalType: number
    physicalType: numeric
    description: Jev's probability for public_lean (for fluoridation, the summed probability of the rolled-up positions).
  - id: official_lean
    name: official_lean
    logicalType: string
    physicalType: text
    description: Jev's reading for the elected officials, with the same labels as public_lean.
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - mostly_supportive
        - mostly_opposed
        - mixed
        - no_opinion
        - did_not_speak
      mustBe: 0
      dimension: conformity
      severity: error
  - id: official_lean_p
    name: official_lean_p
    logicalType: number
    physicalType: numeric
    description: Jev's probability for official_lean.
  - id: public_position
    name: public_position
    logicalType: string
    physicalType: text
    description: 'Water fluoridation only: the position closest to the public who spoke (support_require_all, support_local_choice, no_opinion, oppose_local_choice, oppose_ban_all or did_not_speak). Null for other topics.'
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - support_require_all
        - support_local_choice
        - no_opinion
        - oppose_local_choice
        - oppose_ban_all
        - did_not_speak
      mustBe: 0
      dimension: conformity
      severity: error
  - id: public_position_probabilities
    name: public_position_probabilities
    logicalType: object
    physicalType: jsonb
    description: 'Water fluoridation only: Jev''s probability for each public position (did_not_speak left out once the public spoke).'
  - id: official_position
    name: official_position
    logicalType: string
    physicalType: text
    description: 'Water fluoridation only: the position closest to the elected officials. Null for other topics.'
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - support_require_all
        - support_local_choice
        - no_opinion
        - oppose_local_choice
        - oppose_ban_all
        - did_not_speak
      mustBe: 0
      dimension: conformity
      severity: error
  - id: official_position_probabilities
    name: official_position_probabilities
    logicalType: object
    physicalType: jsonb
    description: 'Water fluoridation only: Jev''s probability for each official position.'
  - id: outcome
    name: outcome
    logicalType: string
    physicalType: text
    description: 'Jev''s reading of what the body did: advanced, blocked, tabled_or_deferred, discussed_no_action or no_item (fluoridation: voted_to_end_fluoridation, voted_to_keep_or_start, tabled_or_deferred, discussion_only or no_fluoridation_item).'
  - id: outcome_group
    name: outcome_group
    logicalType: string
    physicalType: text
    description: 'outcome mapped onto the shared labels (fluoridation''s labels rolled up: end -> blocked, keep/start -> advanced).'
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - advanced
        - blocked
        - tabled_or_deferred
        - discussed_no_action
        - no_item
      mustBe: 0
      dimension: conformity
      severity: error
  - id: outcome_p
    name: outcome_p
    logicalType: number
    physicalType: numeric
    description: Jev's probability for outcome.
  - id: public_against
    name: public_against
    logicalType: boolean
    physicalType: boolean
    description: public_lean = mostly_opposed and public_lean_p >= 0.7.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: public_for
    name: public_for
    logicalType: boolean
    physicalType: boolean
    description: public_lean = mostly_supportive and public_lean_p >= 0.7.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: officials_sided_against_public
    name: officials_sided_against_public
    logicalType: boolean
    physicalType: boolean
    description: The public mostly opposed, officials mostly supportive, and the body did not block the subject (outcome_group <> blocked).
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: question_version
    name: question_version
    logicalType: string
    physicalType: text
    description: The topic's Jev question version the row was screened under (the current one).
    required: true
  - id: excluded_no_item
    name: excluded_no_item
    logicalType: boolean
    physicalType: boolean
    description: '#1136: Jev''s outcome says no item on this topic came up (outcome_group = no_item) with p >= 0.7, so the keyword link was a false hit. Maps and counts leave these meetings out.'
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: official_action
    name: official_action
    logicalType: string
    physicalType: text
    description: '#1136: what the body did about the subject, from the outcome, only where the public did not speak: ''for'' (outcome_group advanced: approved or adopted it; fluoridation voted_to_keep_or_start), ''against'' (blocked or tabled_or_deferred: denied, banned, paused, limited, tabled; fluoridation voted_to_end_fluoridation) or ''none'' (the public spoke, or no action).'
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - for
        - against
        - none
      mustBe: 0
      dimension: conformity
      severity: error
  - id: screened_at
    name: screened_at
    logicalType: timestamp
    physicalType: timestamptz
    description: When Jev screened the meeting.
    required: true

    name: state
    logicalType: string
    physicalType: text
    description: Full state name.
  - id: body_key
    name: body_key
    logicalType: string
    physicalType: text
    description: 'Stable key within the place: governing_body, school_board, planning_zoning, board_of_adjustment, ... or ''<type>:<slug>'' for a named committee/commission/board/authority.'

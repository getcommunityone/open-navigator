apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-jurisdiction_finance
name: jurisdiction_finance
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.jurisdiction_finance`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- id: jurisdiction_finance
  name: jurisdiction_finance
  physicalName: public.jurisdiction_finance
  logicalType: object
  description: public.jurisdiction_finance — one row per government (latest fiscal year) with headline revenue/expenditure/tax totals and an 8-bucket expenditure-by-function breakdown, from the U.S. Census Annual Survey of State & Local Government Finances (TPC/Urban Institute republication, bronze.bronze_jurisdiction_tpc). All dollar columns are WHOLE DOLLARS (source thousands scaled x1000). The 8 exp_* category columns sum to direct_expenditure; total_expenditure = direct + intergovernmental + insurance_trust. Missing source values are NULL, never 0.
  dataGranularityDescription: One row per government (latest fiscal year) with headline revenue/expenditure/tax totals and an 8-bucket expenditure-by-function breakdown, from the U.S. Census Annual Survey of State & Local Government Finances (TPC/Urban Institute republication, bronze.bronze_jurisdiction_tpc).
  properties:
  - id: jurisdiction_finance_id
    name: jurisdiction_finance_id
    logicalType: string
    physicalType: text
    description: PK — md5(gov_type || '|' || id_code), stable per government.
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: FK -> public.jurisdictions.jurisdiction_id. NULLABLE — matched by FIPS geoid; unmatched governments (some special-district / place-fips gaps) stay NULL rather than mis-join. The API can still serve those by state_code + jurisdiction_name + gov_type.
    relationships:
    - type: foreignKey
      to: jurisdictions.odcs.yaml#/schema/jurisdictions/properties/jurisdiction_id
  - id: geoid
    name: geoid
    logicalType: string
    physicalType: text
    description: Census FIPS geoid used for the jurisdictions match (state_fips[+place|+county]).
  - id: tpc_id_code
    name: tpc_id_code
    logicalType: string
    physicalType: text
    description: Source TPC government identifier (natural key).
    required: true
  - id: jurisdiction_name
    name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: Cleaned, Title-cased government name (Census gov-type suffix stripped).
    required: true
  - id: gov_type
    name: gov_type
    logicalType: string
    physicalType: text
    description: state | county | city (special_district/township/school_district excluded from this serving mart).
    required: true
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - state
        - county
        - city
      mustBe: 0
      dimension: conformity
      severity: error
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter postal state code.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name (state_code_to_name macro).
    required: true
  - id: fiscal_year
    name: fiscal_year
    logicalType: integer
    physicalType: integer
    description: Fiscal year of the observation (latest available per government). Integer per CLAUDE.md calendar-year rule.
    required: true
  - id: population
    name: population
    logicalType: integer
    physicalType: bigint
    description: Reported population for the fiscal year; NULL when source omits it. Denominator for taxes_per_capita.
  - id: total_revenue
    name: total_revenue
    logicalType: integer
    physicalType: bigint
    description: Total revenue, whole dollars. NULL if missing.
  - id: total_expenditure
    name: total_expenditure
    logicalType: integer
    physicalType: bigint
    description: Total expenditure (direct + intergovernmental + insurance trust), whole dollars.
  - id: direct_expenditure
    name: direct_expenditure
    logicalType: integer
    physicalType: bigint
    description: Direct expenditure, whole dollars. Denominator of the 8 exp_* categories (they sum to this).
  - id: intergovernmental_expenditure
    name: intergovernmental_expenditure
    logicalType: integer
    physicalType: bigint
    description: Intergovernmental expenditure (aid paid to other governments), whole dollars.
  - id: insurance_trust_expenditure
    name: insurance_trust_expenditure
    logicalType: integer
    physicalType: bigint
    description: Insurance-trust (retirement/unemployment benefit) expenditure, whole dollars.
  - id: total_taxes
    name: total_taxes
    logicalType: integer
    physicalType: bigint
    description: Total taxes collected, whole dollars.
  - id: property_tax
    name: property_tax
    logicalType: integer
    physicalType: bigint
    description: Property tax, whole dollars.
  - id: sales_tax
    name: sales_tax
    logicalType: integer
    physicalType: bigint
    description: General + selective sales tax, whole dollars.
  - id: other_taxes
    name: other_taxes
    logicalType: integer
    physicalType: bigint
    description: total_taxes - property_tax - sales_tax (income/license/etc.), clamped >= 0, whole dollars.
  - id: taxes_per_capita
    name: taxes_per_capita
    logicalType: number
    physicalType: numeric
    description: total_taxes / population, whole dollars/person. NULL when population missing/0.
  - id: exp_education
    name: exp_education
    logicalType: integer
    physicalType: bigint
    description: Education + libraries expenditure, whole dollars. NULL if no education data.
  - id: exp_public_safety
    name: exp_public_safety
    logicalType: integer
    physicalType: bigint
    description: Police + fire + correction + protective inspection, whole dollars.
  - id: exp_infrastructure_highways
    name: exp_infrastructure_highways
    logicalType: integer
    physicalType: bigint
    description: Highways + air/water transport + parking, whole dollars.
  - id: exp_parks_recreation
    name: exp_parks_recreation
    logicalType: integer
    physicalType: bigint
    description: Parks & recreation, whole dollars.
  - id: exp_health_welfare
    name: exp_health_welfare
    logicalType: integer
    physicalType: bigint
    description: Health + hospitals + public welfare, whole dollars.
  - id: exp_utilities
    name: exp_utilities
    logicalType: integer
    physicalType: bigint
    description: Water/electric/gas/transit utilities + sewerage + solid-waste, whole dollars.
  - id: exp_administration_government
    name: exp_administration_government
    logicalType: integer
    physicalType: bigint
    description: Financial admin + judicial + general public buildings + general gov NEC + central staff + employment-security admin, whole dollars.
  - id: exp_other_debt
    name: exp_other_debt
    logicalType: integer
    physicalType: bigint
    description: Interest on debt + housing/community dev + natural resources + misc commercial + liquor stores + transit subsidies + uncategorized direct-expenditure residual, whole dollars.

apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-job_claim
name: job_claim
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.job_claim`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- id: job_claim
  name: job_claim
  physicalName: public.job_claim
  logicalType: object
  description: 'One row per jobs claim per meeting (PK job_claim_id): what a speaker said about the jobs a project will bring, split into construction and operations, with the headcount range, dates, the verbatim quote and where it starts in the video. Headcounts and dates are null when the analysis didn''t give a clean value; nothing is filled in. Only claims with a quote, a valid phase and a meeting in event_meeting are kept; the rest are counted by warn tests on stg_job_claim_ai.'
  dataGranularityDescription: 'One row per jobs claim per meeting (PK job_claim_id): what a speaker said about the jobs a project will bring, split into construction and operations, with the headcount range, dates, the verbatim quote and where it starts in the video.'
  properties:
  - id: job_claim_id
    name: job_claim_id
    logicalType: string
    physicalType: text
    description: Primary key. md5(analysis id | start_seconds | phase | quote).
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: event_meeting_id
    name: event_meeting_id
    logicalType: integer
    physicalType: integer
    description: 'The meeting: event_meeting.event_meeting_id (= bronze_events_analysis_ai.id). Guaranteed by the inner join in the model and checked by a relationships test. Not a Postgres FK constraint: event_meeting is not contract-enforced in dbt, and its primary key exists only where the bootstrap_event_meeting macro created gold.event_meeting by hand, so a declared FK would fail on any build where that macro hasn''t run.'
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: meeting_date
    name: meeting_date
    logicalType: date
    physicalType: date
    description: Meeting date from event_meeting (null when it isn't a valid ISO date).
  - id: video_id
    name: video_id
    logicalType: string
    physicalType: text
    description: YouTube video id of the meeting, from event_meeting.
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: Two-letter state code, from event_meeting.
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name, from event_meeting.
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: FK to jurisdictions.jurisdiction_id, resolved from the meeting's video through event_youtube_with_jurisdiction. Null when the video has no resolved jurisdiction or the id isn't in jurisdictions.
    relationships:
    - type: foreignKey
      to: jurisdictions.odcs.yaml#/schema/jurisdictions/properties/jurisdiction_id
  - id: jurisdiction_name
    name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: Jurisdiction name, from event_meeting.
  - id: city
    name: city
    logicalType: string
    physicalType: text
    description: City of the meeting's event, from event_meeting (the API's ?city= matches it or jurisdiction_name).
  - id: person_id
    name: person_id
    logicalType: string
    physicalType: text
    description: 'The speaker as a resolved person. Always null for now: speaker names from the analysis aren''t matched to a person record yet, so there is no FK. speaker_name holds the name as the analysis gives it.'
  - id: phase
    name: phase
    logicalType: string
    physicalType: text
    description: construction or operations.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - construction
        - operations
      mustBe: 0
      dimension: conformity
      severity: error
    - type: text
      description: 'Postgres CHECK constraint: phase in (''construction'', ''operations'')'
      dimension: conformity
      severity: error
  - id: headcount_low
    name: headcount_low
    logicalType: integer
    physicalType: integer
    description: Low end of the jobs figure; null when not stated as a whole number.
  - id: headcount_high
    name: headcount_high
    logicalType: integer
    physicalType: integer
    description: High end of the jobs figure; null when not stated as a whole number.
  - id: starts_on
    name: starts_on
    logicalType: date
    physicalType: date
    description: When the jobs start, if the claim gives a date.
  - id: ends_on
    name: ends_on
    logicalType: date
    physicalType: date
    description: When the jobs end, if the claim gives a date.
  - id: project_name
    name: project_name
    logicalType: string
    physicalType: text
    description: The project the claim is about, as named in the meeting.
  - id: project_type
    name: project_type
    logicalType: string
    physicalType: text
    description: data_center or another project type, lower-cased.
  - id: speaker_name
    name: speaker_name
    logicalType: string
    physicalType: text
    description: Who made the claim, as the analysis names them.
  - id: start_seconds
    name: start_seconds
    logicalType: number
    physicalType: double precision
    description: Offset into the meeting video where the quote starts.
  - id: quote
    name: quote
    logicalType: string
    physicalType: text
    description: The claim, verbatim from the transcript.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: source_ai_model
    name: source_ai_model
    logicalType: string
    physicalType: text
    description: The model that produced the analysis.
  - id: extracted_at
    name: extracted_at
    logicalType: timestamp
    physicalType: timestamptz
    description: When the analysis was produced.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error

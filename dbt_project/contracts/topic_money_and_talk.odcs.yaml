    logicalType: string
    physicalType: text
    description: Primary key — surrogate md5(jurisdiction_id || canonical_theme || month).
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: FK -> public.jurisdictions.jurisdiction_id. NOT NULL — null-jurisdiction decisions are excluded upstream. Enforced FK (jurisdictions has a single-column PK).
    required: true
    relationships:
    - type: foreignKey
      to: jurisdictions.jurisdiction_id
  - name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: Jurisdiction display name (carried from item_interestingness).
  - name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code.
  - name: city
    logicalType: string
    physicalType: text
    description: City name.
  - name: canonical_theme
    logicalType: string
    physicalType: text
    description: Canonical COFOG theme bucket (one of the 18 controlled labels), derived from the free-text primary_theme via normalize_coarse_theme(). '__unthemed__' rows are excluded.
    required: true
    relationships:
    - type: foreignKey
      to: policy_theme_cofog.primary_theme

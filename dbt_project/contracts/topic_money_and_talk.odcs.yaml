- name: topic_money_and_talk
  physicalName: public.topic_money_and_talk
  logicalType: object
  description: 'public.topic_money_and_talk — per (jurisdiction, canonical COFOG theme, month) rollup of the "talk" (decision_count) vs the "money" (spend_amount = SUM(ABS(net_dollar_impact))) signals, powering the topic money-vs-talk web feature. Built from item_interestingness (decision grain): the noisy free-text primary_theme is collapsed to one of the 18 canonical COFOG buckets via the normalize_coarse_theme() macro (rows resolving to ''__unthemed__'' are excluded), and cofog_code is resolved by join to the policy_theme_cofog seed. One row per (jurisdiction_id, canonical_theme, month = date_trunc(''month'', occurred_at)).'

    physicalType: numeric
    description: The 'money' metric — SUM(ABS(net_dollar_impact)) over decisions with a non-null, non-zero impact; 0 when none contribute money.
    required: true
  - name: spend_count
    logicalType: integer
    physicalType: integer
    description: Count of decisions contributing money (non-null, non-zero net_dollar_impact).
    required: true

# Generated by `python -m models.odcs --write` from the dbt schema.yml files (issue #270).
# Do not edit by hand: change the schema.yml, then regenerate.
apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-event_documents
name: event_documents
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.event_documents`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions. Its materialize mode keeps fewer rows and drops or nulls some of these columns (see neon_bodies in publish_public_serving).'
tags:
- open-navigator
- public-api
schema:
- name: event_documents
  physicalName: public.event_documents
  logicalType: object
  description: public.event_documents — searchable documents attached to a golden-record event. One row per (event, document); today the only document_type is 'transcript' (video transcripts from events_text_search), generalizing to agenda / minutes / caption documents later without a schema change. content holds the full searchable body (GIN full-text indexed). FK event_id -> event. Consumed by the API (search_documents_pg). Denormalized title/jurisdiction/state/city are sourced from the golden event when one exists, else COALESCE-backfilled from event_youtube_with_jurisdiction (by video_id) so the ~90% orphan transcripts still carry a location and survive state/city filters.
  dataGranularityDescription: One row per (event, document); today the only document_type is 'transcript' (video transcripts from events_text_search), generalizing to agenda / minutes / caption documents later without a schema change.
  properties:
  - name: event_document_id
    logicalType: integer
    physicalType: bigint
    description: Surrogate document id (PK). Stable within a build only.
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: event_id
    logicalType: integer
    physicalType: bigint
    description: 'Golden-record event this document belongs to. NULLABLE: ~90% of transcripts have no golden event yet (un-promoted video) and are kept searchable with event_id NULL. FK enforced for non-null values.'
    relationships:
    - type: foreignKey
      to: event.event_id
  - name: document_type
    logicalType: string
    physicalType: text
    description: Kind of document. Currently always 'transcript'.
    required: true
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - transcript
      mustBe: 0
      dimension: conformity
      severity: error
  - name: document_source
    logicalType: string
    physicalType: text
    description: Provenance of the document body (e.g. transcript source 'youtube').
  - name: video_id
    logicalType: string
    physicalType: text
    description: YouTube video id the transcript was derived from.
  - name: content
    logicalType: string
    physicalType: text
    description: 'Full searchable document body (transcript text). GIN full-text indexed on the dev target. NULLABLE: on the `neon` serving target the full body is dropped (only content_excerpt is kept) to fit the free tier, so this is NULL there; on dev it is always populated.'
  - name: content_excerpt
    logicalType: string
    physicalType: text
    description: Capped left(content, 300) preview of the document body. Always present (both targets); on `neon` it is the only retained text since `content` is dropped.
  - name: content_tsv
    logicalType: string
    physicalType: tsvector
    description: Precomputed full-text vector over content (dev target, GIN indexed). On the `neon` serving target this is NULL (national document FTS disabled to fit the free tier; search_documents_pg returns empty rather than error).
  - name: content_length
    logicalType: integer
    physicalType: integer
    description: Character length of content.
  - name: word_count
    logicalType: integer
    physicalType: integer
    description: Approximate word count of content.
  - name: language
    logicalType: string
    physicalType: text
    description: Document language (e.g. 'en').
  - name: is_auto_generated
    logicalType: boolean
    physicalType: boolean
    description: True when the transcript was auto-generated (vs. human).
  - name: segments
    logicalType: object
    physicalType: jsonb
    description: Timed transcript segments (JSONB), when available.
  - name: event_title
    logicalType: string
    physicalType: text
    description: Denormalized event title for result display.
  - name: event_date
    logicalType: date
    physicalType: date
    description: Denormalized event date for sort/display.
  - name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: Denormalized jurisdiction name for result display.
  - name: jurisdiction_type
    logicalType: string
    physicalType: text
    description: Denormalized jurisdiction type.
  - name: state_code
    logicalType: string
    physicalType: text
    description: Denormalized 2-letter state code for filtering.
  - name: state
    logicalType: string
    physicalType: text
    description: Denormalized full state name for display.
  - name: city
    logicalType: string
    physicalType: text
    description: Denormalized city for display.
  - name: video_url
    logicalType: string
    physicalType: text
    description: Source video URL.
  - name: created_at
    logicalType: timestamp
    physicalType: timestamp without time zone
    description: When the underlying transcript row was created.

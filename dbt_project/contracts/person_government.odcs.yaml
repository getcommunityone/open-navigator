# Generated by `python -m models.odcs --write` from the dbt schema.yml files (issue #270).
# Do not edit by hand: change the schema.yml, then regenerate.
apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-person_government
name: person_government
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.person_government`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- name: person_government
  physicalName: public.person_government
  logicalType: object
  description: 'public.person_government — government officials modelled as a PERSON SUBTYPE ("subclass" of person). An elected/appointed official is a kind of person, so it is a first-class member of the person family rather than an orphan officials table. Unlike mdm_person (probabilistically resolved), an official has an exact OCD membership id, so it gets a DETERMINISTIC person identity (person_id = OCD membership id) — no Splink, which avoids the heavy person-resolution rebuild and the over-fragmentation it causes for these single-name roster rows. Carries the government-specific attributes (office/title, jurisdiction, photo, biography, website) that the plain MDM person tables do not. Sourced 1:1 from contact_official (re-projected with the person-identity framing), so contact_official stays the single officials role mart and nothing downstream of it changes. Consumed by the API person-detail endpoint, which resolves an official id here when it misses mdm_person. PII-LIGHT IN PUBLIC: the published public serving copy redacts the contact PII (email and phone) to NULL; the unredacted values exist only in the private/gold warehouse.'
  properties:
  - name: person_id
    logicalType: string
    physicalType: text
    description: Primary key. Deterministic person identity = the OCD membership id (text).
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: master_person_id
    logicalType: string
    physicalType: text
    description: Reserved nullable link to mdm_person.master_person_id for a future DETERMINISTIC cross-subtype match (e.g. a mayor who is also a known 990 officer). Always NULL today; no FK is enforced because the relationship is unpopulated and we do not couple this lightweight subtype to the heavy person master until a deterministic crosswalk exists.
  - name: full_name
    logicalType: string
    physicalType: text
    description: Official's full name.
    required: true
  - name: title
    logicalType: string
    physicalType: text
    description: Cleaned, title-cased role (e.g. 'Mayor', 'Council Member').
    required: true
  - name: jurisdiction
    logicalType: string
    physicalType: text
    description: Organization/place name the official serves (e.g. 'Tuscaloosa Government'). Display only.
  - name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: Foreign key to public.jurisdictions (nullable). Soft-resolved by state_code + normalized place name (same match contact_official uses for the website), so every non-null value is a real jurisdictions PK. NULL for legislators (committee, not a place) and for any local leader whose place does not normalize to a known jurisdiction.
    relationships:
    - type: foreignKey
      to: jurisdictions.jurisdiction_id
  - name: office
    logicalType: string
    physicalType: text
    description: Org classification / chamber (government/upper/lower/...). Nullable.
  - name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state/territory code.
    required: true
  - name: state
    logicalType: string
    physicalType: text
    description: Full state name.
  - name: party
    logicalType: string
    physicalType: text
    description: Primary party, where known.
  - name: district
    logicalType: string
    physicalType: text
    description: District/seat label, where known.
  - name: email
    logicalType: string
    physicalType: text
    description: 'Official email, lower-cased. Nullable. PII-light: redacted to NULL in the public serving copy. Always null in public: publish_public_serving redacts this column.'
    customProperties:
    - property: redactedInPublic
      value: true
  - name: phone
    logicalType: string
    physicalType: text
    description: 'Official phone (scraped path only). Nullable. PII-light: redacted to NULL in the public serving copy. Always null in public: publish_public_serving redacts this column.'
    customProperties:
    - property: redactedInPublic
      value: true
  - name: photo_url
    logicalType: string
    physicalType: text
    description: Headshot URL. Nullable.
  - name: biography
    logicalType: string
    physicalType: text
    description: Official biography prose (scraped municipal directory pages, e.g. Northport's CivicPlus detail pages, else the official_photo_override seed). Nullable.
  - name: website_url
    logicalType: string
    physicalType: text
    description: The official's jurisdiction website (from public.jurisdictions). Nullable.
  - name: is_current
    logicalType: boolean
    physicalType: boolean
    description: True when the term is open-ended or ends on/after the current-term cutoff.
    required: true

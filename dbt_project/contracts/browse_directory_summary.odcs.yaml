schema:
- name: browse_directory_summary
  physicalName: public.browse_directory_summary
  logicalType: object
  description: 'public.browse_directory_summary — homepage Browse-card rollup. One row per (entity_type, state_code): state_code NULL = national rollup, non-null = per-state. transcript_count is the GENUINE COUNT(DISTINCT video_id) (a video spanning multiple states is counted once nationally); entity_count is COUNT(DISTINCT entity_id). Built via GROUPING SETS over intermediate.int_browse_entity_transcripts. Causes: a single national row with 0 transcripts (no warehouse linkage) and entity_count = NTEE tag count.'
  dataGranularityDescription: 'One row per (entity_type, state_code): state_code NULL = national rollup, non-null = per-state.'
  properties:
  - name: entity_type
    logicalType: string
    physicalType: text
    description: 'Entity kind: ''place'' | ''topic'' | ''question'' | ''cause''. Part of the PK.'
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - place
        - topic
        - question
        - cause
      mustBe: 0
      dimension: conformity
      severity: error
  - name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state for the per-state rollup, or NULL for the national rollup row. Nullable on purpose — the API filters state_code IS NULL for national totals.
  - name: state_code_key
    logicalType: string
    physicalType: text
    description: NOT-NULL surrogate key = COALESCE(state_code, '_ALL_'). Exists only so the national (NULL state_code) row can participate in the composite PK.
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: transcript_count
    logicalType: integer
    physicalType: integer
    description: COUNT(DISTINCT video_id) at this grain. National rows are genuinely distinct (no cross-state double counting). 0 for causes. Never NULL.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: entity_count
    logicalType: integer
    physicalType: integer
    description: COUNT(DISTINCT entity_id) at this grain (e.g. distinct places in the state). Never NULL.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: sort_rank
    logicalType: integer
    physicalType: integer
    description: Dense-rank of entity_type by national transcript_count desc (default card order).

    physicalType: varchar
    description: 2-letter state code. Empty string for the national level (PK sentinel). Natural-key / PK component.
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: state
    name: state
    logicalType: string
    physicalType: varchar(50)
    description: Full state name (populated for city level via state_code_to_name; NULL at coarser levels).
  - id: county
    name: county
    logicalType: string
    physicalType: varchar(100)
    description: County name. Natural-key / PK component. Populated for county level (the county's own name) and for city level (the city's primary county, the county holding the most of that city's nonprofits). Empty string for national/state levels and for city rows with no county map.
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: city
    name: city
    logicalType: string
    physicalType: varchar(100)
    description: City name. Natural-key / PK component. Populated only for the city level; empty string otherwise.
    required: true
    primaryKey: true

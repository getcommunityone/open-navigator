    name: level
    logicalType: string
    physicalType: text
    description: 'Aggregation level: national | state | county | city. Natural-key / PK component.'
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
    - type: library
      metric: invalidValues
      arguments:

    logicalType: integer
    physicalType: integer
    description: School districts from int_jurisdictions (jurisdiction_type = 'school_district'). Populated on national and state rows; 0 on county/city rows.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: governments_count
    name: governments_count
    logicalType: integer
    physicalType: integer
    description: 'Local governments (#351, #356): places/townships/counties with Census FUNCSTAT A/B/C, and school districts with A/B/C/E (TIGER active education agency). Excludes statistical areas (FUNCSTAT S), fictitious county-equivalents for independent cities (F — those count once as places), and fictitious school districts (F). Populated on national and state rows; 0 on county/city rows.'
  - id: nonprofits_count

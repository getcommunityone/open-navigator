  name: jurisdiction_state_aggregate
  physicalName: public.jurisdiction_state_aggregate
  logicalType: object
  description: 'public.jurisdiction_state_aggregate - multi-level rollup of nonprofit, event, person, leader, bill and decision counts (plus trending causes JSON) used by the API/UI stats panels. One row per (level, state_code, county, city). `level` is one of national/state/county/city. For coarser levels the finer-grain columns are empty-string sentinels (#567) so the composite PRIMARY KEY can be NOT NULL: national has state_code/county/city = ''''; state has county/city = ''''; county has city = ''''. The compound grain (level, state_code, county, city) is the natural key — unique_combination_of_columns + PK enforce it. The model SQL carries each city''s primary county into the `county` column so distinct same-named cities in different counties stay on separate rows; cities with no county map use '''' rather than NULL.'
  dataGranularityDescription: One row per (level, state_code, county, city).
  properties:

schema:
- name: item_interestingness
  physicalName: public.item_interestingness
  logicalType: object
  description: Tunable, explainable interestingness score per civic agenda item (decision). interestingness_score = 100 * time_decay * weight-normalized average of the seven components. Each component is emitted alongside the composite for single-signal lens sorts, plus top_signals (ordered contributions) for the "why this surfaced" badge. PROXIMITY is intentionally absent — it is a per-request signal computed in rank_for_user, never baked into this score.
  properties:

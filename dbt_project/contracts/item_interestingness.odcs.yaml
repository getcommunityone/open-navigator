    logicalType: string
    physicalType: text
    description: PK; the decision this score is for. FK -> event_decision (relationships test, warn).
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    relationships:
    - type: foreignKey
      to: event_decision.event_decision_id
      customProperties:
      - property: dbtTestSeverity
        value: warn
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: meeting_id
    logicalType: integer
    physicalType: integer
    description: FK -> event_meeting.event_meeting_id (the analysis/meeting).
  - name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: Resolved jurisdiction id (name+state match to jurisdictions); NULL when unresolved (~17%).
  - name: jurisdiction_name
    logicalType: string
    physicalType: text
  - name: state_code
    logicalType: string
    physicalType: text
  - name: state
    logicalType: string
    physicalType: text
  - name: city
    logicalType: string
    physicalType: text
  - name: size_tier
    logicalType: integer
    physicalType: integer
    description: Population quartile (1-4); 0 when population unresolved.
  - name: occurred_at
    logicalType: date
    physicalType: date
    description: Meeting date used for recency/decay and trailing peer window.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: scheduled_for
    logicalType: date
    physicalType: date

schema:
- id: meeting_speaker_position
  name: meeting_speaker_position
  physicalName: public.meeting_speaker_position
  logicalType: object
  description: 'One row per meeting x speaker (#1383): everyone who spoke in a meeting''s public-comment periods, with one position merged from all their segments (stance_shape, verbatim cue phrases). The grain the site counts. "First L." for residents, name and title for matched officials, else "Speaker N"; never linked across meetings; minors, students and school-board residents are never named. No comment text is carried.'
  dataGranularityDescription: 'One row per meeting x speaker (#1383): everyone who spoke in a meeting''s public-comment periods, with one position merged from all their segments (stance_shape, verbatim cue phrases).'
  properties:
  - id: meeting_speaker_id
    name: meeting_speaker_id
    logicalType: string
    physicalType: text
    description: 'Primary key: md5(video_id | speaker | speaker key).'
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: video_id
    name: video_id
    logicalType: string
    physicalType: text
    description: The meeting (FK to segmented_meeting).
    required: true
    relationships:
    - type: foreignKey
      to: segmented_meeting.odcs.yaml#/schema/segmented_meeting/properties/video_id
  - id: meeting_date
    name: meeting_date
    logicalType: date
    physicalType: date
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: FK to jurisdictions.
    relationships:
    - type: foreignKey
      to: jurisdictions.odcs.yaml#/schema/jurisdictions/properties/jurisdiction_id
  - id: jurisdiction_name
    name: jurisdiction_name
    logicalType: string
    physicalType: text
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
  - id: state
    name: state
    logicalType: string
    physicalType: text
  - id: speaker_number
    name: speaker_number
    logicalType: integer
    physicalType: int
    description: Order of first appearance in the meeting, from 1.
    required: true
  - id: speaker_label
    name: speaker_label
    logicalType: string
    physicalType: text
    description: '"First L.", name and title for a matched official, or "Speaker N".'
    required: true
  - id: speaker_named
    name: speaker_named
    logicalType: boolean
    physicalType: boolean
    required: true
  - id: speaker_role
    name: speaker_role
    logicalType: string
    physicalType: text
    description: Official's title, or Resident when they said they live here; null otherwise.
  - id: is_public_comment
    name: is_public_comment
    logicalType: boolean
    physicalType: boolean
    description: False when the introduction says staff, applicant or consultant.
    required: true
  - id: possible_minor
    name: possible_minor
    logicalType: boolean
    physicalType: boolean
    required: true
  - id: turn_count
    name: turn_count
    logicalType: integer
    physicalType: int
    required: true
  - id: segment_count
    name: segment_count
    logicalType: integer
    physicalType: int
    required: true
  - id: word_count
    name: word_count
    logicalType: integer
    physicalType: int
  - id: first_start_seconds
    name: first_start_seconds
    logicalType: number
    physicalType: numeric(12, 3)
  - id: stance_shape
    name: stance_shape
    logicalType: string
    physicalType: text
    description: The speaker's position, read once over all their segments (cue seed comment_stance_shape_terms).
    required: true
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - clear_for
        - clear_against
        - conditional
        - for_concept_against_project
        - against_concept_open_to_terms
        - concerns_only
        - unclear
      mustBe: 0
      dimension: conformity
      severity: error
  - id: shape_cue_text
    name: shape_cue_text
    logicalType: string
    physicalType: text
    description: Verbatim phrase behind the shape; null for unclear, minors and withheld names.
  - id: cue_texts
    name: cue_texts
    logicalType: array
    physicalType: text[]
    description: Each segment's own verbatim cue phrase, in order.
  - id: heat
    name: heat
    logicalType: integer
    physicalType: int
    description: Comment heat 1-5 (1 calm, 5 furious); null when none. From the AI meeting analysis where a rated comment matches; the rules baseline is off (not calibrated).
  - id: heat_method
    name: heat_method
    logicalType: string
    physicalType: text
    description: ai_meeting_analysis | rules | classifier; null when heat is null.
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - ai_meeting_analysis
        - rules
        - classifier
      mustBe: 0
      dimension: conformity
      severity: error
  - id: heat_confidence
    name: heat_confidence
    logicalType: number
    physicalType: numeric(3, 2)
    description: 0.80 for the AI analysis rating; for rules, the measured within +-1 agreement.
  - id: heat_version
    name: heat_version
    logicalType: string
    physicalType: text
    description: 'heat/N: the heat rule-set version.'
  - id: possible_name
    name: possible_name
    logicalType: string
    physicalType: text

  logicalType: object
  description: 'One row per meeting where a data center came up: an analysed meeting whose recording has a passage in data_center_meeting_mention, or that has a decision or a public comment saying a data center word. speakers_* count public speakers on a data center item only, each speaker once per meeting: a comment counts when it is linked to a decision whose headline or statement says a data center word, or when the speaker''s own quoted words or the comment''s summary do (data_center_regex). A comment on any other item of the meeting is never counted. Known misses: a comment that never says the words and is not linked to such a decision; comments on uncontested items; meetings not analysed. A speaker of unknown stance is in none of the four counts. votes_for / votes_against sum event_decision.vote_tally (yes / no) over the meeting''s data center decisions that recorded both; they are null, not 0, when decisions_with_tally is 0.'

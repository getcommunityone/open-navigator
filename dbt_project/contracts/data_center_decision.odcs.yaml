    name: vote_side
    logicalType: string
    physicalType: text
    description: '#1290: which way a recorded vote went for the data center (''for'' / ''against''), only when the tally records both a yes and a no count; null otherwise and on a tie. A passed motion to pause, ban or prohibit, or a denial, is ''against''; any other passed motion is ''for''; a failed one is the opposite. Keyword reading of the item''s own words (development/story-stance-evidence.md).'
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:

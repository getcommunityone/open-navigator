    required: true
  - id: item_id
    name: item_id
    logicalType: string
    physicalType: text
    description: The item's id within the analysis (D001 for a decision, U001 for an uncontested item).
  - id: headline
    name: headline
    logicalType: string
    physicalType: text
    description: What was decided, as the analysis wrote it.
  - id: outcome
    name: outcome
    logicalType: string
    physicalType: text
    description: Approved / Denied / Tabled ..., as extracted; null when not stated.
  - id: votes_for
    name: votes_for
    logicalType: integer
    physicalType: integer
    description: Yes votes, only for a contested decision whose tally has both yes and no as whole numbers; else null (never 0 for unknown).
  - id: votes_against
    name: votes_against
    logicalType: integer
    physicalType: integer
    description: No votes, under the same rule as votes_for.

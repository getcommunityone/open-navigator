schema:
- id: data_center_decision
  name: data_center_decision
  physicalName: public.data_center_decision
  logicalType: object
  description: 'One row per decision a local meeting took on a data center item (#933): contested decisions from event_decision (headline or statement says a data center word) and uncontested items from event_uncontested_item (headline says one). votes_for and votes_against come only from a contested decision''s tally when both sides are whole numbers; an uncontested item''s vote is text as said, in vote_text.'
  dataGranularityDescription: 'One row per decision a local meeting took on a data center item (#933): contested decisions from event_decision (headline or statement says a data center word) and uncontested items from event_uncontested_item (headline says one).'
  properties:
  - id: data_center_decision_id
    name: data_center_decision_id

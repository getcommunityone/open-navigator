apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-jurisdictions
name: jurisdictions
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.jurisdictions`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- name: jurisdictions
  physicalName: public.jurisdictions
  logicalType: object
  description: public.jurisdictions - API-ready jurisdiction table consumed by search_jurisdictions_pg (api/routes/search_postgres.py) and the frontend jurisdiction search. One row per jurisdiction (PK jurisdiction_id), built from the live intermediate.int_jurisdictions (82,921 rows from the sharded bronze census/wikidata tables) enriched with population (jurisdiction_acs) and a best-pick website_url (int_jurisdiction_websites). geoid is NOT unique (places and school districts can share a 7-char code), so the PK is jurisdiction_id. jurisdiction_type is mapped to the API level_mapping values (municipality->city, township->town) and is the single canonical type column (search_jurisdictions_pg aliases it to `type` in its own SELECT).
  dataGranularityDescription: One row per jurisdiction (PK jurisdiction_id), built from the live intermediate.int_jurisdictions (82,921 rows from the sharded bronze census/wikidata tables) enriched with population (jurisdiction_acs) and a best-pick website_url (int_jurisdiction_websites).
  properties:
  - name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: Primary key. Stable id (slug + geoid) from int_jurisdictions.
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: geoid
    logicalType: string
    physicalType: varchar
    description: Census GEOID. NOT unique across types (place vs school district share 7-char codes).
  - name: fips_code
    logicalType: string
    physicalType: varchar
    description: FIPS code (same value as geoid for most census shards).
  - name: ansicode
    logicalType: string
    physicalType: varchar
    description: Census ANSI/GNIS code where available.
  - name: name
    logicalType: string
    physicalType: varchar
    description: Raw jurisdiction name.
  - name: display_name
    logicalType: string
    physicalType: varchar
    description: Display name used by the API for search + UI (currently = name).
    required: true
  - name: jurisdiction_type
    logicalType: string
    physicalType: text
    description: 'API-facing type mapped to level_mapping values: city/town/county/state/school_district.'
    required: true
  - name: jurisdiction_category
    logicalType: string
    physicalType: text
    description: Raw census classification preserved for provenance (municipality/township/county/state/school_district).
  - name: state_code
    logicalType: string
    physicalType: varchar
    description: 2-letter state code.
    required: true
  - name: state_name
    logicalType: string
    physicalType: text
    description: Full state name.
  - name: county_name
    logicalType: string
    physicalType: varchar
    description: County name; populated only for county-type jurisdictions (a county's own name). NULL otherwise - no place->county crosswalk at scale.
  - name: population
    logicalType: integer
    physicalType: bigint
    description: Total population from public.jurisdiction_acs (latest vintage, on geoid). NULL where no ACS match.
  - name: area_sq_miles
    logicalType: number
    physicalType: numeric
    description: Land area in square miles.
  - name: latitude
    logicalType: number
    physicalType: numeric
    description: Centroid latitude.
  - name: longitude
    logicalType: number
    physicalType: numeric
    description: Centroid longitude.
  - name: website_url
    logicalType: string
    physicalType: text
    description: Best single official website (ranked by source quality from int_jurisdiction_websites). NULL where unknown.
  - name: search_text
    logicalType: string
    physicalType: text
    description: 'FTS blob: name + state + state_code + type (+ county for counties). Backs the API to_tsvector match/rank.'
  - name: ingestion_date
    logicalType: timestamp
    physicalType: timestamp
    description: Source ingestion timestamp from int_jurisdictions.
  - name: transformed_at
    logicalType: timestamp
    physicalType: timestamptz
    description: int_jurisdictions transform timestamp.
  - name: published_at
    logicalType: timestamp
    physicalType: timestamptz
    description: Build timestamp for this mart.

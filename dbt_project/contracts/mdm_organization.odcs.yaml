apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-mdm_organization
name: mdm_organization
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.mdm_organization`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions. Its materialize mode keeps these columns but fewer rows (the Neon serving scope).'
tags:
- open-navigator
- public-api
schema:
- id: mdm_organization
  name: mdm_organization
  physicalName: public.mdm_organization
  logicalType: object
  description: 'MDM golden record (MDM Layer 5) — one resolved/survivorship row per organization cluster, built from int_organizations__clustered. Grain: one row per master_org_id. The canonical public org table that backs org search/browse (FTS GIN on org_name; btree on org_name_norm + state_code). Survivorship runs two tracks: identity/location (city, geocode, ein, website) keeps the most-complete, most-trusted occurrence (NCCS-preferred for geocoding); the NAME is chosen by authority for the legal name (gov & schools own their names; IRS BMF outranks NCCS for nonprofits) then recency. The governing jurisdiction is resolved separately in mdm_bridge_org_jurisdiction; nonprofit/990 detail in mdm_organization_nonprofit.'
  dataGranularityDescription: One row per master_org_id.
  properties:
  - id: master_org_id
    name: master_org_id
    logicalType: string
    physicalType: text
    description: Primary key — golden-record cluster id from int_organizations__clustered (one row per resolved organization).
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: org_name
    name: org_name
    logicalType: string
    physicalType: text
    description: 'Survived display name: the current (most-authoritative, then most-recent) name variant, run through display_org_name. Falls back to the golden row''s org_name.'
  - id: org_name_norm
    name: org_name_norm
    logicalType: string
    physicalType: text
    description: Normalized form of the current name (lower/cleaned) used for matching and the org browse name-sort index. Falls back to the golden row's norm.
  - id: org_type
    name: org_type
    logicalType: string
    physicalType: text
    description: 'Canonical type: the most common non-''other'' type voted across the cluster, falling back to the golden row''s type (e.g. nonprofit, government, school).'
  - id: org_subtype
    name: org_subtype
    logicalType: string
    physicalType: text
    description: Finer-grained type qualifier from the golden (most-trusted) occurrence; NULL when none.
  - id: ein
    name: ein
    logicalType: string
    physicalType: text
    description: Employer Identification Number from the golden occurrence (preferred from a registry source); non-null for resolved nonprofits, NULL otherwise.
  - id: city_norm
    name: city_norm
    logicalType: string
    physicalType: text
    description: Normalized city of the golden (most-complete/trusted, NCCS-preferred) occurrence.
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code of the golden occurrence.
  - id: zip5
    name: zip5
    logicalType: string
    physicalType: text
    description: 5-digit ZIP of the golden occurrence; NULL when the source had none.
  - id: lat
    name: lat
    logicalType: number
    physicalType: double precision
    description: Latitude of the golden occurrence (NCCS-preferred for geocoding); NULL when ungeocoded.
  - id: lon
    name: lon
    logicalType: number
    physicalType: double precision
    description: Longitude of the golden occurrence; NULL when ungeocoded.
  - id: website
    name: website
    logicalType: string
    physicalType: text
    description: Organization website from the golden occurrence; NULL when none.
  - id: n_occurrences
    name: n_occurrences
    logicalType: integer
    physicalType: bigint
    description: 'Evidence count: number of source occurrences (rows) in this cluster.'
  - id: n_sources
    name: n_sources
    logicalType: integer
    physicalType: bigint
    description: 'Evidence count: number of distinct source systems contributing to this cluster.'
  - id: first_seen_year
    name: first_seen_year
    logicalType: integer
    physicalType: integer
    description: Earliest source as_of_year observed across the cluster (the date span's start). Integer calendar year.
  - id: last_seen_year
    name: last_seen_year
    logicalType: integer
    physicalType: integer
    description: Latest source as_of_year observed across the cluster (the date span's end). Integer calendar year.
  - id: former_names
    name: former_names
    logicalType: object
    physicalType: jsonb
    description: Prior org names for this golden record (most-recent-first), i.e. every distinct name except the current org_name. Empty array when the name has never changed. See name_history for the year spans.
  - id: name_history
    name: name_history
    logicalType: object
    physicalType: jsonb
    description: 'Full name history: array of {name, name_norm, first_year, last_year, sources} for every distinct name observed in the cluster, newest last_year first. Years are JSON strings (e.g. "2024") per the calendar-year convention. They are observation years (source as_of_year), not legal change dates — they bound a rename rather than pinpoint it.'
  - id: current_name_since_year
    name: current_name_since_year
    logicalType: integer
    physicalType: integer
    description: Earliest year the current org_name was observed (the current name's first_year in name_history). Approximate "in use since" for the name.
  - id: has_name_change
    name: has_name_change
    logicalType: boolean
    physicalType: boolean
    description: True when the cluster carries more than one distinct name.

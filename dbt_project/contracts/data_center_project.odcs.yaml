    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: project_key
    name: project_key
    logicalType: string
    physicalType: text
    description: The seed's project_key, or 'epoch:' || data_center_site_id.

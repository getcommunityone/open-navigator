  physicalName: public.nonprofit_sector_revenue
  logicalType: object
  description: Pre-computed 990 nonprofit-sector revenue decomposition (contributions, program-service revenue, total revenue, org count) at us / per-state / per-city grains, so the money-flow "economy" lens reads one row scoped to the visitor's jurisdiction instead of scanning the full satellite per request. Geography comes from the 1:1 mdm_organization join (state_code / city_norm).

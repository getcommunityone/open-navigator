schema:
- id: data_center_meeting_mention
  name: data_center_meeting_mention
  physicalName: public.data_center_meeting_mention
  logicalType: object
  description: One row per (transcript video, passage) where the meeting's own words say "data center" (or data centre / datacenter / hyperscale). A passage is a ~3-minute window of timed caption cues, or a 2,500-character window of the text when the transcript has no timing. evidence is a verbatim ts_headline excerpt of the passage with the matched words in <mark>; a passage that doesn't produce one isn't kept. data_center_site_id links a tracked Epoch site the passage names, or the site near the video's jurisdiction; null means a data center was discussed where no tracked site is known. Plain text matching, no LLM.
  dataGranularityDescription: One row per (transcript video, passage) where the meeting's own words say "data center" (or data centre / datacenter / hyperscale).
  properties:
  - id: data_center_meeting_mention_id
    name: data_center_meeting_mention_id
    logicalType: string
    physicalType: text
    description: 'Primary key: md5(video_id | passage_index).'
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: video_id
    name: video_id
    logicalType: string
    physicalType: text
    description: YouTube video id of the meeting recording (the transcript's key).
    required: true
  - id: video_url
    name: video_url
    logicalType: string
    physicalType: text
    description: Link to the recording.
    required: true
  - id: meeting_title
    name: meeting_title
    logicalType: string
    physicalType: text
    description: The video's title as the channel lists it.
  - id: meeting_date
    name: meeting_date
    logicalType: date
    physicalType: date
    description: 'The meeting date, from event_youtube_with_jurisdiction. Null when the source date is later than the load date (a wrong video date, #472).'
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: The government whose meeting it is (FK to jurisdictions); null when the video's place isn't in jurisdictions.
    relationships:
    - type: foreignKey
      to: jurisdictions.odcs.yaml#/schema/jurisdictions/properties/jurisdiction_id
  - id: jurisdiction_name
    name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: Jurisdiction name as resolved for the video, else from jurisdictions.
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code.
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name.
  - id: passage_index
    name: passage_index
    logicalType: integer
    physicalType: int
    description: floor(start / 180) for timed transcripts; the 2,500-character window number otherwise.
    required: true
  - id: start_seconds
    name: start_seconds
    logicalType: number
    physicalType: numeric(12, 3)
    description: Seconds into the recording of the first cue in the passage that says a data center word; null when the transcript has no timing.
  - id: evidence
    name: evidence
    logicalType: string
    physicalType: text
    description: Verbatim ts_headline excerpt of the passage; matched words wrapped in <mark>.
    required: true
  - id: match_terms
    name: match_terms
    logicalType: array
    physicalType: text[]
    description: The terms found in the passage (data center, data centre, datacenter, hyperscale, and the site term when one is named).
    required: true
  - id: match_strength
    name: match_strength
    logicalType: string
    physicalType: text
    description: site_specific when the passage names the linked site, its project or (nearby site) its owner; data_center otherwise.
    required: true
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - site_specific
        - data_center
      mustBe: 0
      dimension: conformity
      severity: error
  - id: data_center_site_id
    name: data_center_site_id
    logicalType: string
    physicalType: text
    description: The tracked site discussed or nearby (FK to data_center_site); null when none is known.
    relationships:
    - type: foreignKey
      to: data_center_site.odcs.yaml#/schema/data_center_site/properties/data_center_site_id
  - id: site_match_basis
    name: site_match_basis
    logicalType: string
    physicalType: text
    description: named_in_passage, nearby_site, or null (no site linked).
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - named_in_passage
        - nearby_site
      mustBe: 0
      dimension: conformity
      severity: error

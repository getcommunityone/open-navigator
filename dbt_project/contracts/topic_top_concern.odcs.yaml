    - type: foreignKey
      to: jurisdictions.odcs.yaml#/schema/jurisdictions/properties/jurisdiction_id
  - id: concern_key
    name: concern_key
    logicalType: string
    physicalType: text
    description: The top concern's key (comment_concern_terms).
    required: true
  - id: concern_label
    name: concern_label
    logicalType: string
    physicalType: text
    description: The top concern's label, e.g. Water use.

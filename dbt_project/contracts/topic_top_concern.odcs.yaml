  - id: turns_read
    name: turns_read
    logicalType: integer
    physicalType: int
    description: Opposing or heated turns read in scope; at least var('top_concern_min_turns').
    required: true
  - id: share
    name: share
    logicalType: number
    physicalType: numeric(4, 3)
    description: turns_with_concern / turns_read (0-1).
    required: true

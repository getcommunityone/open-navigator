      to: civicsearch_topic.odcs.yaml#/schema/civicsearch_topic/properties/topic_id
  - id: basis
    name: basis
    logicalType: string
    physicalType: text
    description: 'opposing or heated: which turns were read. Part of the primary key.'
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - opposing
        - heated
      mustBe: 0
      dimension: conformity
      severity: error
  - id: scope_level
    name: scope_level
    logicalType: string
    physicalType: text
    description: national, state or city.
    required: true
    primaryKey: true
    primaryKeyPosition: 3
  - id: scope_key
    name: scope_key
    logicalType: string
    physicalType: text
    description: US for national, the state_code for a state, the jurisdiction_id for a city.
    required: true
    primaryKey: true
    primaryKeyPosition: 4
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: Two-letter state code; null at national scope.
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name; null at national scope.
  - id: city
    name: city
    logicalType: string
    physicalType: text
    description: 'City scope: the government''s name; null otherwise.'
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: 'City scope: the government (FK to jurisdictions); null otherwise.'

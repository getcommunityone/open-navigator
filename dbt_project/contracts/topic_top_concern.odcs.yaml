schema:
- id: topic_top_concern
  name: topic_top_concern
  physicalName: public.topic_top_concern
  logicalType: object
  description: The most-cited concern among opposing or heated speaker turns, per topic and place scope (#1418), from the free concern keyword classification (comment_concern_terms). basis is 'opposing' (speaker side against) or 'heated' (heat 4 or 5). turns_read is how many such turns were read; a row exists only with at least var('top_concern_min_turns'). Only topics with a concern list appear. Feeds the chart-title picker ("<concern> leads the complaints"). No names, no text.

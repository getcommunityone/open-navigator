  - name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: Primary key — canonical jurisdiction id (e.g. 'tuscaloosa_0177256').
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: census_geoid
    logicalType: string
    physicalType: text
    description: Census GEOID of the jurisdiction (e.g. '0177256'). The API joins on this.
    required: true
  - name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code (e.g. 'AL').
  - name: state
    logicalType: string
    physicalType: text
    description: Full state name (e.g. 'Alabama').
  - name: median_lag_days
    logicalType: integer
    physicalType: integer
    description: Median publish lag in days (percentile_cont(0.5), rounded to integer). The value the API adds to meeting_date.
    required: true
  - name: mean_lag_days
    logicalType: number
    physicalType: numeric(6, 1)
    description: Mean publish lag in days (one decimal place).
    required: true
  - name: p90_lag_days
    logicalType: integer
    physicalType: integer
    description: 90th-percentile publish lag in days (percentile_cont(0.9), rounded to integer).
    required: true
  - name: sample_n
    logicalType: integer
    physicalType: integer
    description: Number of in-range (0..180 day) published minutes used in the statistic. Always >= 5.
    required: true
  - name: computed_at

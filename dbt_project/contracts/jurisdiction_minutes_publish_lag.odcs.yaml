schema:
- name: jurisdiction_minutes_publish_lag
  physicalName: public.jurisdiction_minutes_publish_lag
  logicalType: object
  description: 'public.jurisdiction_minutes_publish_lag — per-jurisdiction statistics for how long minutes typically take to publish after a meeting. One row per jurisdiction. Lag (days) per minutes PDF = (raw_resource->>''minutes_published_at'')::date - meeting_date; only lags in 0..180 days count (negatives are template noise, larger are outliers). A jurisdiction is emitted ONLY when sample_n >= 5 — fewer samples are not trustworthy, and the API treats an absent row as "no estimate". Source: the SuiteOne municipal-calendar crawl in bronze, scoped only by meeting_date_source=''suiteone_listing'' AND doc_type=''minutes'' (general, not city-specific).'
  dataGranularityDescription: One row per jurisdiction.

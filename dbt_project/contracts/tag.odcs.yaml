apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-tag
name: tag
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.tag`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- name: tag
  physicalName: public.tag
  logicalType: object
  description: Unified, hierarchical tag taxonomy (NTEE + EveryOrg) — replaces the ad-hoc public.cause_ntee. One row per node, keyed by the collision-safe synthetic tag_id (vocabulary || '|' || source_code). Adjacency via parent_tag_id (self-FK); subtree queries via tag_closure.
  dataGranularityDescription: One row per node, keyed by the collision-safe synthetic tag_id (vocabulary || '|' || source_code).
  properties:
  - name: tag_id
    logicalType: string
    physicalType: text
    description: 'Synthetic PK: vocabulary || ''|'' || source_code (e.g. ''ntee|E20'').'
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: vocabulary
    logicalType: string
    physicalType: text
    description: 'Source vocabulary: ''ntee'' or ''everyorg''.'
    required: true
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - ntee
        - everyorg
      mustBe: 0
      dimension: conformity
      severity: error
  - name: source_code
    logicalType: string
    physicalType: text
    description: Original code/slug within the vocabulary (e.g. 'E20', 'climate').
    required: true
  - name: label
    logicalType: string
    physicalType: text
    description: Human-readable tag name.
  - name: description
    logicalType: string
    physicalType: text
    description: Detailed description, when available.
  - name: parent_tag_id
    logicalType: string
    physicalType: text
    description: Adjacency edge to the parent node; NULL at roots. The self-referential FK is enforced in Postgres via the Neon DDL (fk_tag_parent) rather than a dbt constraint, which would introduce a self-cycle in the model DAG; integrity is checked here by the relationships test.
    relationships:
    - type: foreignKey
      to: tag.tag_id
  - name: depth
    logicalType: integer
    physicalType: integer
    description: Distance from root (0 = root), derived from tag_closure.
  - name: breadcrumb
    logicalType: string
    physicalType: text
    description: 'Denormalized root->leaf path for display (NTEE: '' > '' joined).'
  - name: category
    logicalType: string
    physicalType: text
    description: Vocabulary-specific categorization.
  - name: subcategory
    logicalType: string
    physicalType: text
    description: NTEE subcategory (NULL for EveryOrg).
  - name: icon
    logicalType: string
    physicalType: text
    description: EveryOrg icon slug (NULL for NTEE).
  - name: popularity_rank
    logicalType: integer
    physicalType: integer
    description: EveryOrg popularity rank (NULL for NTEE).
  - name: source
    logicalType: string
    physicalType: text
    description: 'Provenance: ''irs'' (NTEE) or ''everyorg''.'
  - name: source_ingested_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: When the source row was last landed in bronze.
  - name: dbt_loaded_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: dbt build timestamp.

schema:
- id: civicsearch_topic
  name: civicsearch_topic
  physicalName: public.civicsearch_topic
  logicalType: object
  description: 'public.civicsearch_topic — the CivicSearch policy-topic taxonomy CivicSearch uses to tag meeting transcript snippets. One row per topic_id. A FLAT topic -> keyword-cluster dictionary (NOT hierarchical): keyword_stats holds the cluster''s representative keyword strings as a JSONB array. Source: staging.stg_civicsearch__topic (bronze.bronze_events_civicsearch_topic), plus hand-authored curated topics from the curated_topics seed (source = ''curated'', topic_id >= 100000, e.g. "Data centers"; issue #500).'
  dataGranularityDescription: One row per topic_id.
  properties:
  - id: topic_id
    name: topic_id
    logicalType: integer
    physicalType: integer
    description: Primary key — CivicSearch topic id, or a curated topic id (>= 100000, never collides).
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: name
    name: name
    logicalType: string
    physicalType: text
    description: Human-readable topic label.
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: query_id
    name: query_id
    logicalType: string
    physicalType: text
    description: CivicSearch query/slug this topic was harvested under.
  - id: keyword_stats
    name: keyword_stats
    logicalType: object
    physicalType: jsonb
    description: JSONB array of representative keyword strings for the topic cluster.
    required: true
  - id: transcript_occurrences
    name: transcript_occurrences
    logicalType: integer
    physicalType: integer
    description: 'Count of CivicSearch transcript snippets tagged with this topic_id (from staging.stg_civicsearch__snippet). 0 for topics with no snippet matches (coalesced, never NULL), which includes every curated topic: their meeting counts come from browse_transcript_count. Lets the API rank topics by how often they occur across meeting transcripts.'
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: source
    name: source
    logicalType: string
    physicalType: text
    description: '''civicsearch'' (CivicSearch taxonomy) or ''curated'' (curated_topics seed). Curated keywords are specific phrases, so the keyword models match them at 1 phrase hit instead of CivicSearch''s 2.'
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - civicsearch
        - curated
      mustBe: 0
      dimension: conformity
      severity: error

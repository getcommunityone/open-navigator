  description: 'One row per comment segmented from a meeting''s captions, with free keyword flags (seeds comment_concern_terms, comment_entity_terms, comment_role_terms, curated_topics). A comment runs from a self-introduction or the chair calling a speaker to the next speaker, a closing ("your time is up"), a 20-second pause or 8 minutes. No text is carried. speaker_display_name is "First L." from the self-introduction (never the full surname), null for a possible minor. stance_shape and shape_cue_text (#1386) say how a position is stated; which side, as a count, still needs the per-comment classifier (epic #1232 phase 2, on hold).'

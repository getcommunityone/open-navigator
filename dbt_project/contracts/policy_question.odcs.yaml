apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-policy_question
name: policy_question
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.policy_question`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- id: policy_question
  name: policy_question
  physicalName: public.policy_question
  logicalType: object
  description: 'public.policy_question — registry of recurring, jurisdiction-neutral policy questions minted by clustering decisions (Phase 2: + bills) within a coarse theme and labeling each cluster. Rollup counts are denormalized in for the comparative API. PK is contract-enforced; topic_code -> cap_topic is a relationships(warn) test (the seed only carries CAP major topics today).'
  properties:
  - id: question_id
    name: question_id
    logicalType: string
    physicalType: text
    description: PK — md5(coarse_theme || '|' || canonical_text).
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: canonical_text
    name: canonical_text
    logicalType: string
    physicalType: text
    description: The policy question phrased neutrally (or a heuristic label pre-LLM).
    required: true
  - id: topic_code
    name: topic_code
    logicalType: string
    physicalType: text
    description: CAP subtopic/major code; null until the LLM labeler assigns it.
  - id: primary_theme
    name: primary_theme
    logicalType: string
    physicalType: text
    description: Coarse COFOG theme bucket used as the clustering partition.
  - id: cofog_code
    name: cofog_code
    logicalType: string
    physicalType: text
  - id: scope
    name: scope
    logicalType: string
    physicalType: text
    description: local | state | both.
    required: true
  - id: status
    name: status
    logicalType: string
    physicalType: text
  - id: first_seen
    name: first_seen
    logicalType: timestamp
    physicalType: timestamp with time zone
  - id: member_count
    name: member_count
    logicalType: integer
    physicalType: integer
  - id: instances_total
    name: instances_total
    logicalType: integer
    physicalType: integer
  - id: decisions_total
    name: decisions_total
    logicalType: integer
    physicalType: integer
  - id: bills_total
    name: bills_total
    logicalType: integer
    physicalType: integer
  - id: jurisdictions_total
    name: jurisdictions_total
    logicalType: integer
    physicalType: integer
  - id: jurisdictions_approved
    name: jurisdictions_approved
    logicalType: integer
    physicalType: integer
  - id: states_total
    name: states_total
    logicalType: integer
    physicalType: integer
  - id: approved_count
    name: approved_count
    logicalType: integer
    physicalType: integer
  - id: denied_count
    name: denied_count
    logicalType: integer
    physicalType: integer
  - id: deferred_count
    name: deferred_count
    logicalType: integer
    physicalType: integer
  - id: other_count
    name: other_count
    logicalType: integer
    physicalType: integer
  - id: model_name
    name: model_name
    logicalType: string
    physicalType: text
  - id: is_featured
    name: is_featured
    logicalType: boolean
    physicalType: boolean
    description: true for hand-authored editorial "featured" questions (from the curated_policy_questions seed); false for LLM-clustered questions.
    required: true
  - id: display_order
    name: display_order
    logicalType: integer
    physicalType: integer
    description: 1-based sort order for featured questions on the home page / search; null for clustered questions.
  - id: money_total
    name: money_total
    logicalType: number
    physicalType: numeric
    description: 'Real dollars moved by this question''s local decisions: sum of item_interestingness.net_dollar_impact (already per-decision, max-not- summed) over the linked event_decisions. Bills carry no dollar impact.'
  - id: money_share
    name: money_share
    logicalType: number
    physicalType: double precision
    description: money_total as a percent of ALL decisions' dollar impact (grand denominator over item_interestingness) — "share of all decisions".
  - id: talk_share
    name: talk_share
    logicalType: number
    physicalType: double precision
    description: instances_total as a percent of the total count of all civic decisions — the question's slice of how often local government acts.
  - id: aliases
    name: aliases
    logicalType: array
    physicalType: text[]
    description: Alternate search terms for the question (brand/colloquial names not in the neutral canonical_text, e.g. {airbnb,vrbo} for short-term rentals). Matched alongside canonical_text by /search so a query for an alias still finds the renamed question. Empty array when none.

apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-data_center_site
name: data_center_site
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.data_center_site`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- id: data_center_site
  name: data_center_site
  physicalName: public.data_center_site
  logicalType: object
  description: 'One row per data center site (PK data_center_site_id), from Epoch AI''s "AI data centers" dataset, credited on every row (source_name, source_url, license, attribution). status is derived from Epoch''s dated timeline rows, because Epoch publishes no status field. A site that leaves Epoch''s list stays here as ''no_longer_listed'' with its last known status and last-seen date. Nothing is marked cancelled: Epoch has no such flag.'
  dataGranularityDescription: One row per data center site (PK data_center_site_id), from Epoch AI's "AI data centers" dataset, credited on every row (source_name, source_url, license, attribution).
  properties:
  - id: data_center_site_id
    name: data_center_site_id
    logicalType: string
    physicalType: text
    description: 'Primary key: md5(''epoch|'' || site name).'
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: site_name
    name: site_name
    logicalType: string
    physicalType: text
    description: The site or campus name, as Epoch AI gives it.
    required: true
  - id: owner
    name: owner
    logicalType: string
    physicalType: text
    description: 'Owner of the AI hardware. Epoch''s #likely / #speculative tags shown as (likely) / (speculative).'
  - id: users
    name: users
    logicalType: string
    physicalType: text
    description: AI labs using the site, with the same confidence wording.
  - id: project
    name: project
    logicalType: string
    physicalType: text
    description: The broader project the site belongs to, if any.
  - id: address
    name: address
    logicalType: string
    physicalType: text
    description: Street address from public records, as Epoch AI gives it.
  - id: country
    name: country
    logicalType: string
    physicalType: text
    description: Country, as Epoch AI gives it.
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter US state code, when the address ends in one; else null.
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name for state_code.
  - id: status
    name: status
    logicalType: string
    physicalType: text
    description: planned, under_construction, operating or no_longer_listed; null when Epoch has no dated rows for the site.
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - planned
        - under_construction
        - operating
        - no_longer_listed
      mustBe: 0
      dimension: conformity
      severity: error
    - type: text
      description: 'Postgres CHECK constraint: status is null or status in (''planned'', ''under_construction'', ''operating'', ''no_longer_listed'')'
      dimension: conformity
      severity: error
  - id: last_known_status
    name: last_known_status
    logicalType: string
    physicalType: text
    description: The status from the dated rows, kept when status is no_longer_listed.
  - id: status_as_of
    name: status_as_of
    logicalType: date
    physicalType: date
    description: Date of the timeline row the status comes from.
  - id: construction_note
    name: construction_note
    logicalType: string
    physicalType: text
    description: Epoch's free-text construction status on that date.
  - id: it_power_mw
    name: it_power_mw
    logicalType: number
    physicalType: double precision
    description: IT power capacity (MW) on the latest dated row on or before today; null when not given.
  - id: first_seen_on
    name: first_seen_on
    logicalType: date
    physicalType: date
    description: First Epoch download that listed the site.
  - id: last_seen_on
    name: last_seen_on
    logicalType: date
    physicalType: date
    description: Latest Epoch download that listed the site.
  - id: is_listed
    name: is_listed
    logicalType: boolean
    physicalType: boolean
    description: True when the newest Epoch download lists the site.
  - id: source_name
    name: source_name
    logicalType: string
    physicalType: text
    description: Always 'Epoch AI'.
  - id: source_url
    name: source_url
    logicalType: string
    physicalType: text
    description: The Epoch AI dataset page.
  - id: license
    name: license
    logicalType: string
    physicalType: text
    description: Always 'CC BY 4.0'.
  - id: attribution
    name: attribution
    logicalType: string
    physicalType: text
    description: The credit line to show with the data.

schema:
- id: recent_transcribed_meeting
  name: recent_transcribed_meeting
  physicalName: public.recent_transcribed_meeting
  logicalType: object
  description: 'One row per video_id: a meeting from the last 180 days (and not later than today) that has a transcript in event_documents, passes the junk-channel gate (event_youtube_with_jurisdiction), has a title that names a public meeting (meeting_title_regex) and has NOT been AI-analyzed (not in event_meeting). Served next to meeting_browse by GET /api/meetings?sort=recent and labelled "Not yet analyzed": title, date, place and video only, no decision counts. evidence is the verbatim, <mark>ed passage from the meeting''s curated topic link (topic_transcript_link) or, failing that, its curated question link (question_transcript_link); null when the transcript matches neither. No transcript text is read at request time (#496). No LLM.'
  dataGranularityDescription: 'One row per video_id: a meeting from the last 180 days (and not later than today) that has a transcript in event_documents, passes the junk-channel gate (event_youtube_with_jurisdiction), has a title that names a public meeting (meeting_title_regex) and has NOT been AI-analyzed (not in event_meeting).'
  properties:
  - id: video_id
    name: video_id
    logicalType: string
    physicalType: text
    description: 'Primary key: the meeting video (event_documents.video_id).'
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: meeting_title
    name: meeting_title
    logicalType: string
    physicalType: text
    description: Meeting/video title (event_documents.event_title, else the YouTube title).
  - id: meeting_date
    name: meeting_date
    logicalType: date
    physicalType: date
    description: 'Meeting date (event_documents.event_date): within the last 180 days and not later than today at build time.'
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: jurisdiction_id
    name: jurisdiction_id
    logicalType: string
    physicalType: text
    description: FK -> jurisdictions.jurisdiction_id; null when the video's resolved jurisdiction isn't in jurisdictions.
    relationships:
    - type: foreignKey
      to: jurisdictions.odcs.yaml#/schema/jurisdictions/properties/jurisdiction_id
  - id: jurisdiction_name
    name: jurisdiction_name
    logicalType: string
    physicalType: text
    description: Jurisdiction name (event_youtube_with_jurisdiction, else jurisdictions.name).
  - id: city
    name: city
    logicalType: string
    physicalType: text
    description: City, when the source carries one.
  - id: state_code
    name: state_code
    logicalType: string
    physicalType: text
    description: 2-letter state code (event_youtube_with_jurisdiction).
  - id: state
    name: state
    logicalType: string
    physicalType: text
    description: Full state name.
  - id: video_url
    name: video_url
    logicalType: string
    physicalType: text
    description: 'Recording URL (the card links here: there is no analyzed meeting page yet).'
    required: true
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - id: evidence
    name: evidence
    logicalType: string
    physicalType: text
    description: Verbatim transcript passage with the matched words in <mark>…</mark>, copied from topic_transcript_link.evidence_passage or question_transcript_link.evidence. Null when the meeting matches no curated topic or question.
  - id: evidence_source
    name: evidence_source
    logicalType: string
    physicalType: text
    description: 'Where evidence came from: ''topic'' or ''question''; null with no evidence.'
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - topic
        - question
      mustBe: 0
      dimension: conformity
      severity: error
  - id: evidence_label
    name: evidence_label
    logicalType: string
    physicalType: text
    description: 'What matched: the curated topic name, or the policy question''s canonical text.'
  - id: evidence_start_seconds
    name: evidence_start_seconds
    logicalType: number
    physicalType: numeric(12, 3)
    description: Second of the recording where the passage starts (question links with timed captions); null otherwise.

  dataGranularityDescription: 'One row per public comment counted as about a data center item (the comments behind data_center_meeting_position): linked to a decision whose headline or statement says a data center word (match_basis data_center_decision), or saying one in the speaker''s own quoted words or the comment''s summary (own_words).'

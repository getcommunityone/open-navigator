apiVersion: v3.1.0
kind: DataContract
id: open-navigator-public-item_flags
name: item_flags
version: 1.0.0
status: active
dataProduct: open-navigator-public-api
description:
  purpose: The columns, keys and quality rules the Open Navigator public API relies on in `public.item_flags`.
  usage: Read by the Open Navigator public API from the `public` schema, where the publish_public_serving dbt macro publishes it (by default as a view over gold).
  limitations: 'Structure only: no row counts, freshness or service levels. Describes the relation as publish_public_serving builds it by default; with the public_serving_launch_scope var on, rows may be limited to the launch jurisdictions.'
tags:
- open-navigator
- public-api
schema:
- name: item_flags
  physicalName: public.item_flags
  logicalType: object
  description: Per-(subject, flag) anomaly scaffold for the Raised Eyebrows lens. Kept SEPARATE from item_interestingness on purpose — anomalies are review-sensitive and must never inflate the discovery score. Each flag is an UNVERIFIED anomaly (a review prompt), NOT a finding; verify against source_record_url before drawing any conclusion. Detectors are gated by per-type feature-flag vars (default off); see model SQL for the TODO detectors awaiting sources.
  properties:
  - name: item_flag_id
    logicalType: string
    physicalType: text
    description: PK — md5(flag_type || '|' || subject_ref).
    required: true
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    - type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
  - name: flag_type
    logicalType: string
    physicalType: text
    description: 'Anomaly type: threshold_structuring | residency_mismatch | vendor_official_tie | expense_outlier | sole_source_concentration | late_disclosure.'
    required: true
  - name: subject_ref
    logicalType: string
    physicalType: text
    description: The flagged subject's id (an item/financial_item id or an official id).
    required: true
  - name: subject_kind
    logicalType: string
    physicalType: text
    description: 'What subject_ref points at: ''item'' | ''financial_item'' | ''official''.'
  - name: state_code
    logicalType: string
    physicalType: text
  - name: severity
    logicalType: number
    physicalType: double precision
    description: UNVERIFIED anomaly strength in [0,1]. NOT a probability of wrongdoing.
    quality:
    - type: text
      description: Values from 0 to 1 (dbt test dbt_expectations.expect_column_values_to_be_between).
      dimension: conformity
      severity: error
  - name: evidence
    logicalType: object
    physicalType: jsonb
    description: JSONB supporting detail (amounts, limits, links). Review material, not proof.
  - name: source_record_url
    logicalType: string
    physicalType: text
    description: Relative URL to the underlying record so the UI can link to evidence for human review.
  - name: anomaly_score
    logicalType: number
    physicalType: double precision
    description: Per-subject max(severity) for the Raised Eyebrows lens sort. UNVERIFIED.
  - name: anomaly_any
    logicalType: boolean
    physicalType: boolean
    description: True for any flagged subject row (rollup convenience).

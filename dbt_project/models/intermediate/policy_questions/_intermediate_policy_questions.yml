version: 2

models:
  - name: int_policy_question_rollup
    description: >
      Per-question comparative rollup (jurisdiction + outcome counts) feeding the
      public policy_question mart and the API rollup response.
    columns:
      - name: question_id
        tests: [unique, not_null]
      - name: moratorium_count
        description: >
          Instances whose outcome family is moratorium (an adopted or recommended
          moratorium, #483); never null (0 when none).
        tests: [not_null]

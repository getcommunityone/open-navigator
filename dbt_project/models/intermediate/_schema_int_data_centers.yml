version: 2

# #445: transcript passages that discuss data centers, and the governments around each site.

models:
  - name: int_data_center_transcript__passage
    description: >
      One row per (video_id, passage_index) whose own text says a data center word. A passage
      is a ~3-minute window of timed cues (segments, else caption_text_timed), or a
      2,500-character window of raw_text when the transcript has no timing.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [video_id, passage_index]
    columns:
      - name: video_id
        description: "YouTube video id."
        tests:
          - not_null
      - name: passage_index
        description: "floor(start / 180) when timed; the window number otherwise."
        tests:
          - not_null
      - name: timing_source
        description: "segments, caption_text_timed, or null (untimed, character windows)."
        tests:
          - accepted_values:
              values: ['segments', 'caption_text_timed']
      - name: start_seconds
        description: "Start of the first cue in the passage that says a data center word, else of the passage; null when untimed."
      - name: passage_text
        description: "The transcript's own words for the passage."
        tests:
          - not_null

  - name: int_data_center_site__jurisdiction
    description: >
      One row per (data_center_site_id, jurisdiction_id): the governments around each data
      center site, from the meeting-source survey (bronze_jurisdiction_meeting_source, when it
      exists), the city in the site's address, and that city's county.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_center_site_id, jurisdiction_id]
    columns:
      - name: data_center_site_id
        description: "The site (data_center_site)."
        tests:
          - not_null
          - relationships:
              to: ref('data_center_site')
              field: data_center_site_id
      - name: jurisdiction_id
        description: "The government (jurisdictions)."
        tests:
          - not_null
          - relationships:
              to: ref('jurisdictions')
              field: jurisdiction_id
      - name: link_basis
        description: "meeting_source_survey, address_city or address_county (strongest kept)."
        tests:
          - accepted_values:
              values: ['meeting_source_survey', 'address_city', 'address_county']

  - name: int_data_center_project__base
    description: >
      One row per data center project (#531) before figures and governments are attached:
      curated seed projects plus every other Epoch AI site. data_center_project builds on it.
    columns:
      - name: project_id
        tests: [unique, not_null]

  - name: int_data_center_project__figure
    description: >
      One row per (project, metric, source, value) (#531): curated figures with their
      verbatim excerpt, plus Epoch AI's IT power for a project that is an Epoch site.
    columns:
      - name: project_figure_id
        tests: [unique, not_null]

  - name: int_data_center_project__jurisdiction
    description: >
      One row per (project_id, jurisdiction_id) (#531): a curated project's stated city
      and county, and an Epoch site's governments (int_data_center_site__jurisdiction).
    columns:
      - name: project_jurisdiction_id
        tests: [unique, not_null]

  - name: int_data_center_news_item__match
    description: >
      One row per data center news item (#532): the host company, project, government,
      meeting kind, stated date and any video link its own text gives, and a status
      (confirmed, unconfirmed, not_event). Deterministic text matching only.
    columns:
      - name: news_item_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['confirmed', 'unconfirmed', 'not_event']

  - name: int_data_center_community_event__item
    description: >
      One row per news item that describes a company-hosted meeting (#532), with the key of
      the event it reports (community_event_id = md5(event_key)).
    columns:
      - name: news_item_id
        tests: [unique, not_null]

  - name: int_data_center_community_event__recording
    description: >
      One row per (community_event_id, video_url) recording candidate from the YouTube
      search (#532); empty until the search has run.

  - name: int_data_center__public_comment
    description: >
      One row per public comment counted as about a data center item (#930, #932): linked
      to a decision whose headline or statement says a data center word, on an uncontested
      item whose headline says one, saying one in the speaker's own quoted words or the
      comment's summary, or on the same item of the same meeting as a speaker who says one
      (data_center_regex). The one definition of the rule; data_center_meeting_position and
      data_center_public_comment read it. is_counted marks the one row counted for a speaker
      in a meeting.
    columns:
      - name: public_comment_id
        tests: [unique, not_null]
      - name: match_basis
        tests:
          - not_null
          - accepted_values:
              values: ['data_center_decision', 'data_center_item', 'own_words', 'same_item']
      - name: is_counted
        tests: [not_null]

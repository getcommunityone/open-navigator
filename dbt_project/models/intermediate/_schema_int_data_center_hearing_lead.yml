version: 2

# #955 / #956: every data center hearing lead, curated and from trackers, one per meeting.

models:
  - name: int_data_center_hearing_lead
    description: >
      The curated seed (data_center_hearing_lead) plus the CC BY tracker leads
      (stg_data_center_hearing_tracker_lead), one row per (state, place, meeting date). Of
      duplicates it keeps a seed lead with an official URL, then a tracker lead with one, then
      any other seed lead, then any other tracker lead. Read by fetch_hearing_sources and
      data_center_hearing. Leads only; nothing here is served.
    columns:
      - name: lead_id
        description: "Primary key: the seed's lead_id, or 'dcf-' / 'sr-' plus the tracker record id."
        tests: [unique, not_null]
      - name: meeting_date
        description: "The claimed meeting date."
        tests: [not_null]
      - name: jurisdiction_name
        description: "The place as the lead names it."
        tests: [not_null]
      - name: state_code
        description: "2-letter state code."
        tests: [not_null]
      - name: body_name
        description: "The body as the lead names it."
      - name: topic
        description: "The lead's topic."
      - name: source_kind
        description: "official, tracker, news or none."
        tests:
          - accepted_values:
              values: ['official', 'tracker', 'news', 'none']
      - name: source_name
        description: "Who the lead's source is credited to."
      - name: source_url
        description: "The source URL; only an official one can verify a hearing."
      - name: lead_from
        description: "Where the lead came from: the owner's list (owner_list_1 / owner_list_2), datacenterfights or sitingradar."
      - name: census_geoid
        description: "Census GEOID when the tracker gives one (Siting Radar)."
      - name: attribution
        description: "The CC BY credit for a tracker lead; null for a seed lead."

unit_tests:
  - name: dc_hearing_lead_dedupe_keeps_official_then_seed
    description: "Same meeting from several leads: a seed official lead wins; a tracker's official URL beats a seed lead without one."
    model: int_data_center_hearing_lead
    given:
      - input: ref('data_center_hearing_lead')
        rows:
          - {lead_id: seed-off, meeting_date: '2026-12-01', jurisdiction_name: Deer Park, state_code: TX, body_name: Council, topic: t, source_kind: official, source_name: s, source_url: 'https://x.gov/a', lead_from: owner_list_1}
          - {lead_id: seed-none, meeting_date: '2026-12-07', jurisdiction_name: Hazle Township, state_code: PA, body_name: Board, topic: t, source_kind: none, source_name: null, source_url: null, lead_from: owner_list_2}
          - {lead_id: seed-trk, meeting_date: '2026-12-09', jurisdiction_name: Cochise County, state_code: AZ, body_name: P&Z, topic: t, source_kind: tracker, source_name: s, source_url: null, lead_from: owner_list_2}
      - input: ref('stg_data_center_hearing_tracker_lead')
        rows:
          - {lead_id: dcf-1, tracker: datacenterfights, meeting_date: '2026-12-01', jurisdiction_name: Deer Park, state_code: TX, source_kind: official, source_url: 'https://y.gov/b'}
          - {lead_id: dcf-2, tracker: datacenterfights, meeting_date: '2026-12-07', jurisdiction_name: Hazle Township, state_code: PA, source_kind: official, source_url: 'https://hazletownship.us/x'}
          - {lead_id: dcf-3, tracker: datacenterfights, meeting_date: '2026-12-09', jurisdiction_name: Cochise County, state_code: AZ, source_kind: tracker, source_url: 'https://news.example/x'}
          - {lead_id: sr-9, tracker: sitingradar, meeting_date: '2026-12-15', jurisdiction_name: Dorr Township, state_code: MI, source_kind: official, source_url: 'https://www.dorrtownshipmi.gov/x'}
          - {lead_id: dcf-9, tracker: datacenterfights, meeting_date: '2026-12-15', jurisdiction_name: Dorr, state_code: MI, source_kind: official, source_url: 'https://dorr.gov/x'}
    expect:
      rows:
        - {lead_id: seed-off}
        - {lead_id: dcf-2}
        - {lead_id: seed-trk}
        - {lead_id: sr-9}

version: 2

models:
- name: jurisdiction_state_aggregate
  description: "public.jurisdiction_state_aggregate - multi-level rollup of nonprofit, event, person,\
    \ leader, bill and decision counts (plus trending causes JSON) used by the API/UI stats panels. One\
    \ row per (level, state_code, county, city). `level` is one of national/state/county/city. For coarser\
    \ levels the finer-grain columns are empty-string sentinels (#567) so the composite PRIMARY KEY can\
    \ be NOT NULL: national has state_code/county/city = ''; state has county/city = ''; county has city\
    \ = ''. The compound grain (level, state_code, county, city) is the natural key \u2014 unique_combination_of_columns\
    \ + PK enforce it. The model SQL carries each city's primary county into the `county` column so distinct\
    \ same-named cities in different counties stay on separate rows; cities with no county map use ''\
    \ rather than NULL.\n"
  config:
    materialized: table
    contract:
      enforced: true
    on_schema_change: fail
  constraints:
  - type: primary_key
    columns:
    - level
    - state_code
    - county
    - city
  columns:
  - name: level
    data_type: text
    description: 'Aggregation level: national | state | county | city. Natural-key / PK component.'
    tests:
    - not_null
    - accepted_values:
        values:
        - national
        - state
        - county
        - city
    constraints:
    - type: not_null
  - name: state_code
    data_type: varchar
    description: 2-letter state code. Empty string for the national level (PK sentinel). Natural-key /
      PK component.
    tests:
    - not_null
    constraints:
    - type: not_null
  - name: state
    data_type: varchar(50)
    description: Full state name (populated for city level via state_code_to_name; NULL at coarser levels).
  - name: county
    data_type: varchar(100)
    description: 'County name. Natural-key / PK component. Populated for county level (the county''s own
      name) and for city level (the city''s primary county, the county holding the most of that city''s
      nonprofits). Empty string for national/state levels and for city rows with no county map.

      '
    tests:
    - not_null
    constraints:
    - type: not_null
  - name: city
    data_type: varchar(100)
    description: City name. Natural-key / PK component. Populated only for the city level; empty string
      otherwise.
    tests:
    - not_null
    constraints:
    - type: not_null
  - name: jurisdictions_count
    data_type: integer
    description: 'Census geographies below the state in int_jurisdictions: counties, Census places (including
      census-designated places, which have no government), county subdivisions and school districts. A
      count of mapped geographies, not of governments. Populated on national and state rows; 0 on county/city
      rows (not yet computed at that grain).'
    tests:
    - not_null
  - name: school_districts_count
    data_type: integer
    description: School districts from int_jurisdictions (jurisdiction_type = 'school_district'). Populated
      on national and state rows; 0 on county/city rows.
    tests:
    - not_null
  - name: governments_count
    data_type: integer
    description: "Local governments (#351, #356): places/townships/counties with Census FUNCSTAT A/B/C,\
      \ and school districts with A/B/C/E (TIGER active education agency). Excludes statistical areas\
      \ (FUNCSTAT S), fictitious county-equivalents for independent cities (F \u2014 those count once\
      \ as places), and fictitious school districts (F). Populated on national and state rows; 0 on county/city\
      \ rows."
  - name: nonprofits_count
    data_type: integer
    description: Number of nonprofits in the geography.
    tests:
    - not_null
  - name: events_count
    data_type: integer
    description: Number of meetings/events in the geography.
    tests:
    - not_null
  - name: bills_count
    data_type: integer
    description: Number of legislative bills (populated at national/state level; 0 at county/city).
    tests:
    - not_null
  - name: persons_count
    data_type: integer
    description: Number of people (mdm_person) in the geography.
    tests:
    - not_null
  - name: leaders_count
    data_type: integer
    description: 'Civic leaders ONLY: elected/government officials (contact_official) in the geography.
      Defined to match the app''s search "Leaders" drilldown population. Nonprofit board members are a
      disjoint id namespace and are reported separately in nonprofit_leaders_count (do not add the two
      for a "total leaders" figure unless that is explicitly intended).

      '
    tests:
    - not_null
  - name: nonprofit_leaders_count
    data_type: integer
    description: "Nonprofit LEADERSHIP POSITIONS in the geography, not people (#291, decided 2026-11-15):\
      \ DISTINCT officer_person_uid from mdm_bridge_person_organization holding a leadership flag (officer\
      \ / director-trustee / key-employee / institutional-trustee). officer_person_uid is name + EIN,\
      \ so one person on three boards counts three times, and board members are not yet resolved into\
      \ mdm_person \u2014 this figure can exceed persons_count and must not be labelled or compared as\
      \ a count of people. A separate population from leaders_count (civic officials); the two cannot\
      \ be deduped against each other.\n"
    tests:
    - not_null
  - name: decisions_count
    data_type: integer
    description: 'Number of distinct policy decisions in the geography, sourced from event_policy_decision
      and rolled up by jurisdiction_id (resolved to the city grain via int_jurisdictions).

      '
    tests:
    - not_null
  - name: total_revenue
    data_type: numeric
    description: Sum of nonprofit revenue (irs_revenue_amt) in the geography.
  - name: total_assets
    data_type: numeric
    description: Sum of nonprofit assets (irs_asset_amt) in the geography.
  - name: trending_causes
    data_type: jsonb
    description: JSONB array of trending causes for the geography (last-90-day decisions). NULL at county
      level.
  - name: last_updated
    data_type: timestamptz
    description: Build timestamp for this row.
    tests:
    - not_null
  tests:
  - dbt_utils.recency:
      arguments:
        datepart: day
        field: last_updated
        interval: 7
      config:
        severity: warn
        tags:
        - freshness
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - level
      - state_code
      - county
      - city

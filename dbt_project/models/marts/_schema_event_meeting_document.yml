version: 2

# public.event_meeting_document — scraped agenda/minutes PDFs linked to the
# analyzed meeting they belong to. One row per document. Phase 1 of the meeting-
# documents feature; Phase 0 (scraping into bronze) is done.
#
# Keys (per CLAUDE.md, enforced as Postgres constraints via contract):
#   - PK: event_meeting_document_id (md5 of jurisdiction_id + url_sha256).
#   - FK: event_meeting_id -> public.event_meeting.event_meeting_id. event_meeting
#     is the NON-partitioned, single-column-PK parent, so this FK is a REAL
#     enforced constraint (not a relationships-test stand-in). It is NULLABLE on
#     purpose: orphan documents (no matched meeting) keep a NULL FK, which a
#     foreign key allows.

models:
  - name: event_meeting_document
    description: >
      public.event_meeting_document — scraped meeting AGENDA / MINUTES PDFs linked
      to the meeting they belong to (public.event_meeting), so the API can show
      document links on a decision / meeting. One row per document. Matched on
      jurisdiction (census geoid embedded in event_meeting.jurisdiction) + date +
      canonical body key. event_meeting_id is NULL for orphan documents and for
      meetings whose agenda/minutes is not yet published. Sources: the SuiteOne
      municipal-calendar crawl (source='suiteone') and the nationwide
      jurisdiction homepage crawl's day-dated agenda/minutes PDFs for counties and municipalities in every state
      (source='scraped_meetings', #392), and Granicus / Legistar meetings
      (source='legistar' | 'granicus', #536) whose content is the agenda / minutes
      text the platform serves.
    config:
      materialized: table
      on_schema_change: fail
      tags: ['marts', 'meetings', 'documents', 'suiteone', 'scraped_meetings', 'production']
      contract:
        enforced: true
    columns:
      - name: event_meeting_document_id
        description: "Primary key — md5(jurisdiction_id || '|' || url_sha256), stable per document."
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: event_meeting_id
        description: >
          FK -> public.event_meeting.event_meeting_id (the matched analyzed
          meeting). NULLABLE — orphan documents and not-yet-published
          agenda/minutes keep a NULL value. Enforced FK (event_meeting has a
          single-column PK).
        data_type: integer
        constraints:
          - type: foreign_key
            to: ref('event_meeting')
            to_columns: [event_meeting_id]
        data_tests:
          - relationships:
              arguments:
                to: ref('event_meeting')
                field: event_meeting_id
              config:
                severity: warn
      - name: jurisdiction_id
        description: "Canonical jurisdiction id (e.g. 'tuscaloosa_0177256')."
        data_type: text
        constraints:
          - type: not_null
      - name: census_geoid
        description: "Census GEOID of the jurisdiction (e.g. '0177256')."
        data_type: text
        constraints:
          - type: not_null
      - name: state_code
        description: "2-letter state code (e.g. 'AL')."
        data_type: text
      - name: state
        description: "Full state name (e.g. 'Alabama')."
        data_type: text
      - name: document_type
        description: "Document kind — 'agenda', 'minutes', or 'attachment'."
        data_type: text
        constraints:
          - type: not_null
      - name: document_url
        description: "URL of the agenda/minutes PDF (the document link)."
        data_type: text
        constraints:
          - type: not_null
      - name: doc_date
        description: "Meeting date the document is for (real DATE)."
        data_type: date
      - name: body_name
        description: "Canonical body category (key) the document/meeting belongs to (e.g. 'finance', 'council', 'projects')."
        data_type: text
      - name: meeting_title
        description: "Original meeting title: the SuiteOne listing title (e.g. '3:00 p.m. Finance Committee') or, for crawled docs, the PDF link text or filename title."
        data_type: text
      - name: content
        description: >
          Extracted PDF text body (from bronze.bronze_meeting_document_text,
          joined on jurisdiction_id + url_sha256). NULLABLE — populated only where
          text has been extracted (scrapers.suiteone.doctext /
          scrapers.meetings.doctext); NULL otherwise.
        data_type: text
      - name: word_count
        description: "Word count of the extracted PDF text. NULLABLE — present only where content is."
        data_type: integer
      - name: content_tsv
        description: >
          Stored full-text search vector over content + meeting_title + body_name,
          so search ranks/matches without recomputing to_tsvector. Backed by a GIN
          index (see the model's indexes config).
        data_type: tsvector
      - name: source
        description: "Scrape source — 'suiteone' (SuiteOne portal listing), 'scraped_meetings' (nationwide homepage crawl), or 'legistar' / 'granicus' (meeting platforms, #536)."
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['suiteone', 'scraped_meetings', 'legistar', 'granicus']
      - name: created_at
        description: "When the document row was landed in bronze."
        data_type: timestamp

unit_tests:
  # #392 review: canonical county ids drop "County" ('tuscaloosa_01125'), so a
  # county document's name slug equals the same-named city's normalized name.
  # County documents must link by geoid only; the name fallback is for
  # geoid-less meetings and non-county documents.
  - name: county_document_never_links_to_same_named_city_meeting
    model: event_meeting_document
    given:
      - input: ref('stg_suiteone_meeting_documents')
        rows: []
      - input: ref('stg_platform_meeting_documents')
        rows: []
      - input: ref('stg_scraped_meeting_documents')
        rows:
          # County planning agenda, same day + body as a geoid-less city meeting.
          - {event_meeting_document_id: county-same-day-as-freetext-city, jurisdiction_id: tuscaloosa_01125, census_geoid: '01125', url_sha256: a1, state_code: AL, document_type: agenda, document_url: 'https://example.invalid/a1.pdf', doc_date: '2026-03-03', meeting_title: Planning Commission Agenda, body_key: planning, source: scraped_meetings}
          # City planning agenda, same day + body: links to the city meeting by name.
          - {event_meeting_document_id: city-same-day-as-freetext-city, jurisdiction_id: tuscaloosa_0177256, census_geoid: '0177256', url_sha256: a2, state_code: AL, document_type: agenda, document_url: 'https://example.invalid/a2.pdf', doc_date: '2026-03-03', meeting_title: Planning Commission Agenda, body_key: planning, source: scraped_meetings}
          # County planning agenda, same day + body as a city meeting that carries its geoid.
          - {event_meeting_document_id: county-same-day-as-geoid-city, jurisdiction_id: tuscaloosa_01125, census_geoid: '01125', url_sha256: a3, state_code: AL, document_type: agenda, document_url: 'https://example.invalid/a3.pdf', doc_date: '2026-03-04', meeting_title: Planning Commission Agenda, body_key: planning, source: scraped_meetings}
          # County planning agenda for the county's own meeting: links by geoid.
          - {event_meeting_document_id: county-own-meeting, jurisdiction_id: tuscaloosa_01125, census_geoid: '01125', url_sha256: a4, state_code: AL, document_type: agenda, document_url: 'https://example.invalid/a4.pdf', doc_date: '2026-03-05', meeting_title: Planning Commission Agenda, body_key: planning, source: scraped_meetings}
      - input: ref('event_meeting')
        rows:
          - {event_meeting_id: 1, jurisdiction: 'City of Tuscaloosa, Alabama', jurisdiction_name: 'City of Tuscaloosa', state_code: AL, meeting_date: '2026-03-03', body_name: Planning Commission}
          - {event_meeting_id: 2, jurisdiction: tuscaloosa_0177256, jurisdiction_name: Tuscaloosa, state_code: AL, meeting_date: '2026-03-04', body_name: Planning Commission}
          - {event_meeting_id: 3, jurisdiction: tuscaloosa_01125, jurisdiction_name: Tuscaloosa County, state_code: AL, meeting_date: '2026-03-05', body_name: Planning Commission}
      - input: source('bronze', 'bronze_meeting_document_text')
        rows: []
    expect:
      rows:
        - {event_meeting_document_id: county-same-day-as-freetext-city, event_meeting_id: null}
        - {event_meeting_document_id: city-same-day-as-freetext-city, event_meeting_id: 1}
        - {event_meeting_document_id: county-same-day-as-geoid-city, event_meeting_id: null}
        - {event_meeting_document_id: county-own-meeting, event_meeting_id: 3}

  # #536: a Granicus / Legistar document carries the agenda / minutes text the platform
  # serves; it is the content when no PDF extraction exists for the document.
  - name: platform_document_content_comes_from_the_platform
    model: event_meeting_document
    given:
      - input: ref('stg_suiteone_meeting_documents')
        rows: []
      - input: ref('stg_scraped_meeting_documents')
        rows: []
      - input: ref('stg_platform_meeting_documents')
        rows:
          - {event_meeting_document_id: legistar-minutes, jurisdiction_id: dakota_27037, census_geoid: '27037', url_sha256: b1, state_code: MN, document_type: minutes, document_url: 'https://example.invalid/m.pdf', doc_date: '2026-10-27', meeting_title: Board of Commissioners, body_key: council, source: legistar, content: 'The meeting was called to order at 9:00 a.m.'}
      - input: ref('event_meeting')
        rows: []
      - input: source('bronze', 'bronze_meeting_document_text')
        rows: []
    expect:
      rows:
        - {event_meeting_document_id: legistar-minutes, source: legistar, content: 'The meeting was called to order at 9:00 a.m.', word_count: 9, event_meeting_id: null}

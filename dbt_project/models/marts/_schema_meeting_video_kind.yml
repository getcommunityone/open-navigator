version: 2

models:
  - name: meeting_video_kind
    description: >
      What kind of video each quoted recording is (#1230): Jev's meeting_kind for every video a topic link or a
      data-center mention quotes and that Jev screened. One row per video_id. The story map cards quote only videos
      read as a public meeting (or never screened), never a media briefing, interview, podcast or stream. A
      classifier's reading, nothing tied to a person. Feeds GET /api/topics/{topic_id}/states (newest) and
      GET /api/data-centers/meeting-mentions?quotes_per_state=.
    config:
      materialized: table
      on_schema_change: fail
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [video_id]
    columns:
      - name: video_id
        description: 'The recording (YouTube id), primary key. No FK: it is the recording key the topic and data-center marts share, none of which has it as a single-column key.'
        data_type: text
        constraints:
          - type: not_null
        tests: [not_null, unique]
      - name: meeting_kind
        description: "Jev's reading: government_meeting, town_hall, government_other or not_government."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['government_meeting', 'town_hall', 'government_other', 'not_government']
      - name: kind_source
        description: 'Which Jev screen answered: transcript_screen (preferred) or video_meta_screen.'
        data_type: text
        tests:
          - accepted_values:
              values: ['transcript_screen', 'video_meta_screen']
      - name: is_public_meeting
        description: 'True when meeting_kind is government_meeting or town_hall.'
        data_type: boolean
      - name: screened_at
        description: 'When that screen read the video.'
        data_type: timestamp with time zone

version: 2

# DC-4.1 (#249): data center sites from Epoch AI (CC BY 4.0), with status and source.
# #958: plus the US Data Center Registry (CC BY 4.0) facilities that are not Epoch sites.
# Built into gold and published to public (publish_public_serving's served list). Small
# (one row per tracked site), so it is served whole, without a state subset filter.

models:
  - name: data_center_site
    data_tests:
      - dbt_utils.recency:
          # Freshness (context-engineering.md, principle 5): no Epoch AI snapshot loaded in 14 days. Per source, so a
          # fresh registry load can't hide a stale Epoch one (#958 review).
          arguments:
            datepart: day
            field: last_seen_on
            interval: 14
            where: "source = 'epoch'"
          config:
            severity: warn
            tags: ['freshness']
    description: >
      One row per data center site (PK data_center_site_id), each credited to its source on
      the row (source, source_name, source_url, license, attribution).
      source 'epoch': Epoch AI's "AI data centers"; status derived from Epoch's dated timeline
      rows, because Epoch publishes no status field. source 'us_data_center_registry': the US
      Data Center Registry's data centers that are not the same site as an Epoch site (equal
      names in the state, one-to-one; int_data_center_facility_registry__site), with the
      registry's status mapped (source_status keeps its word). A site that leaves its source's
      list stays as 'no_longer_listed' with its last known status and last-seen date.
      'cancelled' appears only where the registry publishes it; Epoch has no such flag.
    config:
      materialized: table
      on_schema_change: fail
      contract:
        enforced: true
    columns:
      - name: data_center_site_id
        description: "Primary key: md5('epoch|' || site name), or md5('us_data_center_registry|' || registry id)."
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: site_name
        description: "The site or campus name, as Epoch AI gives it."
        data_type: text
        constraints:
          - type: not_null
      - name: owner
        description: "Owner of the AI hardware. Epoch's #likely / #speculative tags shown as (likely) / (speculative)."
        data_type: text
      - name: users
        description: "AI labs using the site, with the same confidence wording."
        data_type: text
      - name: project
        description: "The broader project the site belongs to, if any."
        data_type: text
      - name: address
        description: "Street address from public records, as Epoch AI gives it."
        data_type: text
      - name: country
        description: "Country, as Epoch AI gives it."
        data_type: text
      - name: state_code
        description: "2-letter US state code, when the address ends in one; else null."
        data_type: text
      - name: state
        description: "Full state name for state_code."
        data_type: text
      - name: status
        description: "planned, under_construction, operating, cancelled (registry only) or no_longer_listed; null when the source gives none."
        data_type: text
        constraints:
          - type: check
            expression: "status is null or status in ('planned', 'under_construction', 'operating', 'cancelled', 'no_longer_listed')"
        tests:
          - accepted_values:
              values: ['planned', 'under_construction', 'operating', 'cancelled', 'no_longer_listed']
      - name: last_known_status
        description: "The status from the dated rows, kept when status is no_longer_listed."
        data_type: text
      - name: status_as_of
        description: "Date of the timeline row the status comes from."
        data_type: date
      - name: construction_note
        description: "Epoch's free-text construction status on that date."
        data_type: text
      - name: it_power_mw
        description: "IT power capacity (MW) on the latest dated row on or before today; null when not given."
        data_type: double precision
      - name: first_seen_on
        description: "First load of the site's source that listed it."
        data_type: date
      - name: last_seen_on
        description: "Latest load of the site's source that listed it."
        data_type: date
      - name: is_listed
        description: "True when the newest load of the site's source lists it."
        data_type: boolean
      - name: source_name
        description: "'Epoch AI' or 'US Data Center Registry (SueDataCenters.org)'."
        data_type: text
      - name: source_url
        description: "The Epoch AI dataset page, or the record's own page on the registry (the registry's dataset page when the record has none, #983). Never null."
        data_type: text
        constraints:
          - type: not_null
        tests: [not_null]
      - name: license
        description: "Always 'CC BY 4.0'."
        data_type: text
      - name: attribution
        description: "The credit line to show with the data."
        data_type: text
      - name: source
        description: "epoch or us_data_center_registry (#958). Models that match sites by name read 'epoch' only."
        data_type: text
        constraints:
          - type: not_null
        tests:
          - accepted_values:
              values: ['epoch', 'us_data_center_registry']
      - name: source_status
        description: "The registry's own status word (operational, under_construction, proposed, permitted, cancelled); null for Epoch."
        data_type: text
      - name: operator
        description: "The operator the registry names; null for Epoch (Epoch's owner is in owner)."
        data_type: text
      - name: city
        description: "City, as the registry gives it; null for Epoch (its street address is in address)."
        data_type: text
      - name: county
        description: "County, as the registry gives it; null for Epoch."
        data_type: text
      - name: latitude
        description: "Latitude from the registry (often approximate); null for Epoch."
        data_type: double precision
      - name: longitude
        description: "Longitude from the registry (often approximate); null for Epoch."
        data_type: double precision
      - name: capacity_mw_planned
        description: "Planned capacity (MW) as the registry gives it; null when not given."
        data_type: double precision
      - name: capacity_mw_operational
        description: "Operational capacity (MW) as the registry gives it; null when not given."
        data_type: double precision

version: 2

# #1348: the Data Center Story's "Over time" screen. One row per data_center_site, with the year of its
# earliest real date and its coordinates. Built into gold and published to public (publish_public_serving).

models:
  - name: data_center_site_timeline
    description: >
      One row per data center site (PK data_center_site_id, FK data_center_site): the year of its earliest
      date on record (appear_year; the registry's announced date or Epoch AI's first dated timeline row, else (#1428)
      the earliest date a source had it listed, an upper bound labelled listed_by; appear_basis says which,
      appear_precision how precise), Epoch's first operating year (operating_year,
      operating_is_expected when after today) and the coordinates the sources publish. A site with no date
      on record at all (appear_basis none) has appear_year null: it is shown only at today, never at a guessed year.
    config:
      materialized: table
      on_schema_change: fail
      contract:
        enforced: true
    constraints:
      - type: foreign_key
        columns: [data_center_site_id]
        to: ref('data_center_site')
        to_columns: [data_center_site_id]
    columns:
      - name: data_center_site_id
        description: "Primary key; also the foreign key to data_center_site."
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('data_center_site')
                field: data_center_site_id
      - name: state_code
        description: "2-letter state code, as on data_center_site."
        data_type: text
      - name: state
        description: "Full state name."
        data_type: text
      - name: latitude
        description: "Registry latitude (an Epoch site takes its same-name registry record's); null when none."
        data_type: double precision
      - name: longitude
        description: "Registry longitude, same rule."
        data_type: double precision
      - name: appear_year
        description: "Year of the earliest real date on record (for listed_by, the year it was first listed: an upper bound); null only for appear_basis none."
        data_type: integer
        constraints:
          - type: check
            expression: "appear_year is null or appear_year between 1990 and 2100"
      - name: appear_basis
        description: "announced (registry announced_date), epoch_first_report (Epoch's first dated timeline row), listed_by (earliest of first_seen_on / status_as_of: the site existed by then, not an opening date) or none."
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['announced', 'epoch_first_report', 'listed_by', 'none']
      - name: appear_precision
        description: "day, month or year for a start date; listed_by for an upper-bound listed date; null for none."
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['day', 'month', 'year', 'listed_by']
      - name: listed_on
        description: "Earliest date a source had the site listed (least of data_center_site.first_seen_on and status_as_of). An upper bound on when the site existed, never an opening date."
        data_type: date
      - name: first_report_year
        description: "Epoch only: year of the first dated timeline row (work on the site on record); null for registry sites."
        data_type: integer
      - name: operating_year
        description: "Epoch only: year of the first timeline row with a building operational; null for registry sites."
        data_type: integer
      - name: operating_is_expected
        description: "True when operating_year is Epoch's projection (its date is after today)."
        data_type: boolean
        constraints:
          - type: not_null

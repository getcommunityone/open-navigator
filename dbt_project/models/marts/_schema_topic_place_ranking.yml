version: 2
models:
- name: topic_place_ranking
  description: 'One row per place x topic x window (#1437): where a place''s public speakers stood on a topic, from their
    own classifier sides (meeting_speaker_topic_side). Each speaker counts once on their majority side; ranked only with
    >= 10 sided speakers across >= 2 meetings in 24 months; the score is shrunk toward the topic''s national rate with 10
    pseudo-speakers; ranked within Census size bands. Officials (roster-confirmed only) are kept apart. No names. Decision
    record: web_docs/docs/development/topic-place-rankings.md.'
  config:
    contract:
      enforced: true
  constraints:
  - type: primary_key
    columns:
    - jurisdiction_id
    - topic_id
    - window_months
  - type: foreign_key
    columns:
    - jurisdiction_id
    to: ref('jurisdictions')
    to_columns:
    - jurisdiction_id
  - type: foreign_key
    columns:
    - topic_id
    to: ref('civicsearch_topic')
    to_columns:
    - topic_id
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - jurisdiction_id
      - topic_id
      - window_months
  columns:
  - name: jurisdiction_id
    data_type: text
    description: The place (FK to jurisdictions). Part of the primary key.
    constraints:
    - type: not_null
  - name: topic_id
    data_type: int
    description: The topic (FK to civicsearch_topic). Part of the primary key.
    constraints:
    - type: not_null
  - name: window_months
    data_type: int
    description: The window length in months (var ranking_window_months). Part of the primary key.
    constraints:
    - type: not_null
  - name: jurisdiction_name
    data_type: text
    description: The place name.
  - name: state_code
    data_type: text
    description: Two-letter state code.
  - name: state
    data_type: text
    description: Full state name.
  - name: population
    data_type: bigint
    description: Census ACS total population (jurisdictions.population); NULL where none.
  - name: size_band
    data_type: text
    description: large (>= 250k) | mid (50k-250k) | small (< 50k) | unknown (no population).
    constraints:
    - type: not_null
    tests:
    - accepted_values:
        values:
        - large
        - mid
        - small
        - unknown
  - name: speakers_for
    data_type: int
    description: Distinct public speakers whose majority side was for.
    constraints:
    - type: not_null
  - name: speakers_against
    data_type: int
    description: Distinct public speakers whose majority side was against.
    constraints:
    - type: not_null
  - name: speakers_split
    data_type: int
    description: Distinct public speakers evenly split; they take no side.
    constraints:
    - type: not_null
  - name: meetings
    data_type: int
    description: Distinct meetings with a counted resident reading in the window.
    constraints:
    - type: not_null
  - name: first_meeting_date
    data_type: date
    description: Earliest such meeting.
  - name: last_meeting_date
    data_type: date
    description: Latest such meeting.
  - name: against_share
    data_type: numeric(5, 4)
    description: speakers_against / (speakers_for + speakers_against).
  - name: national_against_share
    data_type: numeric(5, 4)
    description: The topic's against share over every place's sided speakers in the window (the shrinkage target).
  - name: shrunk_against_share
    data_type: numeric(5, 4)
    description: (against + prior_weight * national) / (for + against + prior_weight).
  - name: prior_weight
    data_type: int
    description: Pseudo-speakers at the national rate (var ranking_prior_weight).
    constraints:
    - type: not_null
  - name: is_ranked
    data_type: boolean
    description: At least ranking_min_speakers sided speakers across ranking_min_meetings meetings in the window.
    constraints:
    - type: not_null
  - name: band_rank
    data_type: int
    description: 1 = most against among ranked places in the same size band; NULL when unranked.
  - name: band_ranked_count
    data_type: int
    description: Ranked places in the band; NULL when unranked.
  - name: officials_for
    data_type: int
    description: Roster-confirmed officials whose majority side was for (never in the resident counts).
  - name: officials_against
    data_type: int
    description: Roster-confirmed officials whose majority side was against.
  - name: officials_side
    data_type: text
    description: for | against | split; NULL when no roster-confirmed official took a side.
  - name: window_end_date
    data_type: date
    description: The window end (var ranking_as_of, or the run date).
  - name: built_at
    data_type: timestamp
    description: When the row was built.
unit_tests:
- name: topic_place_ranking_counts_once_shrinks_and_bands
  description: Each speaker counts once on their majority side (a split speaker takes no side); only for/against inside
    the window count; officials apart; the 10-speaker / 2-meeting minimum; shrinkage toward the national rate (7 of 19 against);
    size bands.

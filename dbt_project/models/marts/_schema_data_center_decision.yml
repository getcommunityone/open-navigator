version: 2

models:
  - name: data_center_decision
    description: >
      One row per decision a local meeting took on a data center item (#933): contested
      decisions from event_decision (headline or statement says a data center word) and
      uncontested items from event_uncontested_item (headline says one). votes_for and
      votes_against come only from a contested decision's tally when both sides are whole
      numbers; an uncontested item's vote is text as said, in vote_text.
    config:
      materialized: table
      on_schema_change: fail
      contract:
        enforced: true
      tags: ['marts', 'data_centers', 'serving']
      indexes:
        - columns: ["state_code", "meeting_date desc"]
          type: btree
    constraints:
      - type: foreign_key
        columns: [event_meeting_id]
        to: ref('event_meeting')
        to_columns: [event_meeting_id]
    columns:
      - name: data_center_decision_id
        description: "Primary key: the source row's id (event_decision_id for a contested decision, event_uncontested_item_id for an uncontested one)."
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: event_meeting_id
        description: "FK -> event_meeting.event_meeting_id (the analysed meeting); enforced constraint."
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - relationships:
              to: ref('event_meeting')
              field: event_meeting_id
      - name: contested
        description: "true: debated (event_decision); false: passed without debate (event_uncontested_item)."
        data_type: boolean
        constraints:
          - type: not_null
      - name: item_id
        description: "The item's id within the analysis (D001 for a decision, U001 for an uncontested item)."
        data_type: text
      - name: headline
        description: "What was decided, as the analysis wrote it."
        data_type: text
      - name: outcome
        description: "Approved / Denied / Tabled ..., as extracted; null when not stated."
        data_type: text
      - name: votes_for
        description: "Yes votes, only for a contested decision whose tally has both yes and no as whole numbers; else null (never 0 for unknown)."
        data_type: integer
      - name: votes_against
        description: "No votes, under the same rule as votes_for."
        data_type: integer
      - name: vote_text
        description: "An uncontested item's vote as said (voice vote, 5-0, unanimous); null for contested decisions and when not stated."
        data_type: text
      - name: meeting_date
        description: "Date of the meeting; null when unknown or later than the load date."
        data_type: date
      - name: jurisdiction_name
        description: "Jurisdiction of the meeting."
        data_type: text
      - name: state_code
        description: "Two-letter state code."
        data_type: text
      - name: state
        description: "Full state name."
        data_type: text
      - name: video_id
        description: "YouTube id of the meeting recording."
        data_type: text
      - name: video_url
        description: "Link to the meeting recording."
        data_type: text
      - name: decision_url
        description: "Site path of the decision's page (/decisions/:id); contested decisions only, since uncontested items have no page."
        data_type: text

version: 2

# DC-1.1 (#246): jobs claims split by phase. Rows the job_claim mart can't keep (no quote,
# a phase outside construction/operations, a meeting not in event_meeting) are filtered
# there; these warn-level tests count them so the gap is reported in every run.

models:
  - name: stg_job_claim_ai
    description: >
      Jobs claims from the Part 1 meeting analysis
      (bronze.bronze_events_analysis_ai.structured_analysis -> 'job_claims'), one row per
      array element per analysis. Headcounts, dates and timestamps are cast only when the
      model wrote a clean value; anything else is null, never guessed.
    columns:
      - name: job_claim_id
        description: "md5(analysis id | start_seconds | phase | quote)."
      - name: event_meeting_id
        description: "The analysis id (bronze_events_analysis_ai.id) = event_meeting.event_meeting_id."
        tests:
          - relationships:
              to: ref('event_meeting')
              field: event_meeting_id
              config:
                severity: warn
      - name: phase
        description: "construction or operations, as the model wrote it (lower-cased, trimmed)."
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              values: ['construction', 'operations']
              config:
                severity: warn
      - name: headcount_low
        description: "Low end of the jobs figure; null when absent or not a clean whole number."
      - name: headcount_high
        description: "High end of the jobs figure; null when absent or not a clean whole number."
      - name: starts_on
        description: "When the jobs start (ISO date), null when absent or free text."
      - name: ends_on
        description: "When the jobs end (ISO date), null when absent or free text."
      - name: project_name
        description: "The project the claim is about, as named in the meeting."
      - name: project_type
        description: "data_center or another project type (lower-cased, trimmed)."
      - name: speaker_name
        description: "Who made the claim, as the analysis names them; else the full_name of the people[] entry the claim binds to."
      - name: speaker_role
        description: "The speaker's role as said in the meeting (DC-1.2); else the role of the people[] entry the claim binds to; null when neither says."
      - name: speaker_person_ref
        description: "The claim's speaker_person_id: a people[].person_id local to this analysis, not a key."
      - name: start_seconds
        description: "Offset into the meeting video where the quote starts."
      - name: quote
        description: "The claim, verbatim from the transcript."
        tests:
          - not_null:
              config:
                severity: warn
      - name: source_ai_model
        description: "The model that produced the analysis."
      - name: extracted_at
        description: "When the analysis was produced (bronze_events_analysis_ai.created_at)."
  - name: stg_epoch_data_center
    description: >
      Epoch AI data center sites (CC BY 4.0), one row per site name from the newest snapshot
      that lists it (DC-4.1, #249). is_listed is false for a site missing from the newest
      download, so it stays visible downstream.
    columns:
      - name: name
        description: "Site name; unique."
        tests:
          - unique
          - not_null
      - name: owner
        description: "Owner, with Epoch's confidence tags turned into words."
      - name: users
        description: "Users, with the same confidence wording."
      - name: project
        description: "Broader project, if any."
      - name: address
        description: "Street address as given."
      - name: country
        description: "Country as given."
      - name: state_code
        description: "US state code parsed from the end of the address; null otherwise."
      - name: selected_sources
        description: "Epoch's main sources for the record."
      - name: source_url
        description: "The Epoch AI file URL the row came from."
      - name: first_seen_on
        description: "First snapshot that listed the site."
      - name: last_seen_on
        description: "Latest snapshot that listed the site."
      - name: is_listed
        description: "Listed in the newest snapshot."
  - name: stg_epoch_data_center_timeline
    description: >
      Epoch AI timeline rows (CC BY 4.0): one row per site per as-of date, from the site's
      newest snapshot (DC-4.1, #249). Numbers are guarded casts.
    columns:
      - name: name
        description: "Site name."
      - name: as_of_on
        description: "As-of date."
      - name: construction_note
        description: "Free-text construction status on that date."
      - name: buildings_operational
        description: "Buildings operational by that date."
      - name: it_power_mw
        description: "IT power capacity (MW)."

  - name: stg_event_youtube_transcript__data_center
    description: >
      Transcripts whose text says "data center" / "data centre" / "datacenter" / "hyperscale"
      (#445), one row per video_id, with segments and caption_text_timed kept for timing.
      Prefiltered with the GIN-indexed tsvector expression of bronze_event_youtube_transcript,
      then confirmed with a word-boundary regex.
    columns:
      - name: video_id
        description: "YouTube video id (unique)."
        tests:
          - unique
          - not_null
      - name: raw_text
        description: "Full transcript text."
      - name: segments
        description: "Timed caption cues (JSON array of {text, start, duration}); null when absent or empty."
      - name: caption_text_timed
        description: "Transcript text with {HH:MM:SS} markers; null when absent."
      - name: transcript_source
        description: "Where the transcript came from (lower-cased)."


# Sister project file at repo root: ../dbt_project.yml (for dbt without --project-dir).
# When you change models/seeds/snapshots/vars here, mirror those sections in ../dbt_project.yml.

# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'open_navigator_dbt'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'open_navigator'

# Roll the next month's partition forward for the partitioned event_* AI-extraction
# marts on every run. Guarded: no-op until the partitioned parent is bootstrapped
# (dbt run-operation bootstrap_event_people). See macros/event_extractions.sql.
on-run-start:
  # pg_trgm before any model builds: trigram indexes are declared in models' `indexes`
  # config, which dbt builds on the tmp table before the swap, ahead of any hook (#938).
  - "create extension if not exists pg_trgm"
  - "{{ ensure_event_partitions('gold.event_person') }}"
  - "{{ ensure_event_partitions('gold.event_decision') }}"
  - "{{ ensure_event_partitions('gold.event_place') }}"
  - "{{ ensure_event_partitions('gold.event_financial_item') }}"
  - "{{ ensure_event_partitions('gold.event_topic') }}"
  - "{{ ensure_event_partitions('gold.event_bill') }}"
  - "{{ ensure_event_partitions('gold.event_organization') }}"
  # bronze tables the data center hearing marts read; empty until the loaders run (#956)
  - "{{ ensure_data_center_hearing_tables() }}"
  # bronze tables of the open data center inventories; empty until the loader runs (#958)
  - "{{ ensure_data_center_inventory_tables() }}"

# Rebuild-proof the /search performance indexes. Models declare them in their dbt `indexes`
# config (#938; built before the swap). If one still goes missing, its text-search leg
# falls back to a multi-second seq-scan that can push the homepage past the frontend's
# fetch-abort, so this re-ensures them idempotently after every run.
# See macros/ensure_search_indexes.sql.
#
# Then re-publish the public serving layer: the warehouse marts live in `gold`
# (the full/private set); `public` exposes ONLY the API-served relations as thin
# views over gold ("public = serving data and nothing else"). publish_public_serving
# is idempotent (CREATE OR REPLACE VIEW) so it re-syncs the views after every run.
# See macros/publish_public_serving.sql.
on-run-end:
  - "{{ ensure_search_indexes() }}"
  - "{{ ensure_declared_foreign_keys() }}"
  - "{{ publish_public_serving() }}"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  open_navigator_dbt:
    # Staging models - bronze data cleaning
    staging:
      +materialized: view
      +schema: staging
      
    # Intermediate models - deduplication and matching  
    intermediate:
      +materialized: table
      +schema: intermediate
      
    # Marts - production-ready tables.
    # The FULL warehouse builds into the `gold` schema (the private/internal set).
    # The public API reads thin views in `public` published over gold by
    # publish_public_serving (on-run-end) for ONLY the API-served relations.
    # generate_schema_name.sql is pass-through, so +schema: gold => literal `gold`.
    marts:
      +materialized: incremental
      +schema: gold
      # append_new_columns (not sync_all_columns): contracted incremental models
      # require append_new_columns or fail (#271). Uncontracted models keep working.
      +on_schema_change: append_new_columns
      +unique_key: id

# Seeds configuration
seeds:
  open_navigator_dbt:
    +schema: seeds
    governing_body_pattern:
      # #1442: meeting title -> governing body patterns, tried by priority (Python twin: ingestion.governance.body_titles).
      +column_types:
        pattern_id: text
        priority: integer
        applies_to: text
        pattern: text
        body_key: text
        body_name: text
        body_type: text
        name_from_title: boolean
    governing_body_title_example:
      # #1442: real titles and the body each must map to (pytest and assert_governing_body_title_examples).
      +column_types:
        title: text
        jurisdiction_name: text
        jurisdiction_type: text
        expected_body_key: text
        expected_body_name: text
    topic_organization_rule:
      # #1345: how each curated topic is tied to nonprofits (NTEE code, name or mission keyword regex).
      +column_types:
        topic_query_id: text
        rule_type: text
        pattern: text
        side: text
        label: text
    aspep_function_code:
      +column_types:
        function_code: text
        function_name: text
    cap_topic:
      +column_types:
        code: varchar
        major_code: varchar
    comment_concern_terms:
      # #1233: per-comment concern keyword patterns (Postgres regex on lower(comment_text)).
      +column_types:
        topic_query_id: text
        concern_key: text
        concern_label: text
        in_reference_list: boolean
        pattern: text
    trending_term_excluded:
      # #1399: filler / procedural / generic words (match = word: first or last word) and boilerplate phrases
      # (match = phrase: contained) left out of trending terms.
      +column_types: {term: text, match: text, reason: text}
    trending_term_public_figure:
      # #1399: reviewed allow-list of widely known public figures whose names may trend.
      +column_types: {term: text, label: text, note: text}
    trending_term_sensitive:
      # #1399: sensitive words (health, religion, immigration ...): counts only, never tied to a speaker.
      +column_types: {term: text, category: text}
    trending_term_common_word:
      # #1399: common civic words that are also names ("bill", "park"): not treated as a person's name.
      +column_types: {term: text, note: text}
    comment_entity_terms:
      # #1233: companies, people and AI terms named in a comment.
      +column_types:
        entity_type: text
        entity_key: text
        entity_label: text
        pattern: text
    comment_role_terms:
      # #1233: self-described speaker roles, matched on the introduction.
      +column_types:
        role_key: text
        role_label: text
        is_public_comment: boolean
        pattern: text
    comment_place_patterns:
      # #1233 (1b): public place shapes (roads, schools, counties, sites) in comment text.
      +column_types:
        pattern_key: text
        place_kind: text
        pattern: text
    topic_legislation_vocabulary:
      # Category vocabulary per curated topic for state bills. '*' = the generic set.
      +column_types:
        topic_query_id: text
        category: text
        display_order: integer
        label: text
        description: text
    topic_legislation_rule:
      # Ordered keyword rules (POSIX regex on lowercased title + abstract) that pick a bill's category.
      # Empty category = leave the bill out. '*' = the generic rules for topics without their own.
      +column_types:
        topic_query_id: text
        rule_order: integer
        category: text
        pattern: text
        note: text
    topic_legislation_scope:
      # Extra per-topic bill filters: require / exclude regex, and keywords not to use on bills.
      +column_types:
        topic_query_id: text
        require_pattern: text
        exclude_pattern: text
        drop_keywords: text
        note: text
    curated_topics:
      # Hand-authored topics unioned into stg_civicsearch__topic (issue #500).
      # topic_id >= 100000 so it can never collide with a CivicSearch id.
      +column_types:
        topic_id: integer
        name: text
        query_id: text
        keywords: text
    curated_policy_questions:
      # Hand-authored "featured" policy questions unioned into public.policy_question.
      # Pin types: topic_code/cofog_code seed empty (all-null) which dbt would
      # otherwise infer to boolean/integer and break the text union in the mart.
      +column_types:
        canonical_text: text
        primary_theme: text
        topic_code: text
        cofog_code: text
        display_order: integer
        aliases: text
    curated_question_instance:
      # Hand-verified real decisions attached to featured questions. Pin text
      # types so empty cells (library rows have no state/jurisdiction/city) don't
      # get inferred to a non-text type and break the union in stg_question_instance.
      +column_types:
        question_id: text
        source_id: text
        state_code: text
        jurisdiction_name: text
        city: text
        outcome_raw: text
        occurred_at: timestamp
    youtube_channel_attribution_override:
      # Hand-reviewed YouTube channel/video -> jurisdiction corrections (#514, #515).
      # Pin text types: video_id/jurisdiction_id are empty on channel-wide rows and
      # issue is a number dbt would otherwise infer to integer.
      +column_types:
        channel_id: text
        video_id: text
        jurisdiction_id: text
        state_code: text
        issue: text
        evidence: text

# Snapshots configuration
snapshots:
  open_navigator_dbt:
    +target_schema: snapshots
    +unique_key: id
    +strategy: timestamp
    +updated_at: last_updated

# Variables
vars:
  # Trending terms and hot words (#1399; web_docs/docs/development/trending-terms-and-hot-words.md)
  trending_year_a: 2025
  trending_year_b: 2026
  trending_sample_per_year: 750
  trending_sample_min_meetings: 6
  trending_sample_min_jurisdictions: 3
  trending_max_doc_share: 0.35
  trending_name_ratio: 0.25
  trending_min_meetings_b: 15
  trending_min_jurisdictions: 5
  trending_state_min_meetings_b: 5
  trending_state_min_jurisdictions: 3
  trending_served_per_sort: 60
  trending_max_jurisdiction_share: 0.4
  trending_fragment_share: 0.85
  trending_place_min_population: 20000
  trending_hot_min_heat: 4
  trending_hot_prior: 500
  trending_hot_min_speakers: 5
  trending_hot_min_meetings: 3
  trending_evidence_national: 5
  trending_evidence_state: 1
  trending_evidence_rank: 20
  # Speaker attribution (#1386): bump when seeds/speaker_attribution_rules.csv changes
  speaker_attribution_version: 'speaker_attribution/1'
  # Comment heat (#1386). The rules baseline is served only when it passes calibration against the AI-rated
  # comments (within +-1 of the AI heat at least 70%, and exact match beating a constant guess); it did not.
  heat_version: 'heat/1'
  heat_rules_enabled: false
  heat_rules_within1: 0.78
  # Speaker side / heat from the classifier (#1391): a reading counts only at or above this probability (calibrated on
  # the hand-labelled gold set; llm.typesafe.speaker_stance.MIN_SIDE_CONFIDENCE, kept equal by a test).
  speaker_side_min_confidence: 0.8
  speaker_heat_min_confidence: 0.65
  # topic_place_ranking (#1437): where places stand on a topic, from the speaker sides above.
  # ranking_as_of: the window's end date ('' = the run date); the window is the last ranking_window_months months.
  ranking_as_of: ''
  ranking_window_months: 24
  ranking_min_speakers: 10
  ranking_min_meetings: 2
  # pseudo-speakers at the topic's national against-rate added to every place (shrinkage prior)
  ranking_prior_weight: 10
  # Confidence score thresholds
  confidence_authoritative: 1.0
  confidence_high: 0.90
  confidence_medium: 0.70
  confidence_ai: 0.60
  confidence_low: 0.50
  
  # Fuzzy matching threshold
  fuzzy_match_threshold: 0.85
  
  # Datasources
  authoritative_sources: ['openstates_api', 'irs_bmf', 'irs_990']
  ai_sources: ['gemini_ai_extraction']

  # int_jurisdictions: nearest ZCTA → zip column (slow). Default false keeps zip NULL.
  include_nearest_postal_zip: false

  # --- Civic interestingness score (item_interestingness / item_flags) ---
  # Composite time decay. 30 is a fine live-feed default; 90 better fits this
  # corpus (71% current-year, long historical tail) so old items sink gracefully
  # without collapsing the whole distribution to 0. Tunable per run via --vars.
  civic_half_life_days: 90
  # Trailing peer window (days) for percentile normalization within a size tier.
  civic_peer_window_days: 365
  # Forward 'soon' lens horizon (days) for the urgency component.
  civic_urgency_horizon_days: 14
  # Per-request proximity radius (meters) for rank_for_user. Static score excludes it.
  civic_proximity_radius_m: 40000
  # --- feature flags for signals with no data source yet (default off = honest stub) ---
  civic_enable_fee_tax_bonus: false        # is_new_or_increased_fee_tax not extracted
  civic_fee_tax_bonus: 0.15
  civic_enable_buried_no_discussion: false # treat any high-money item as buried when no discussion signal
  # --- item_flags detectors (default off; most await a data source) ---
  civic_flag_threshold_structuring: true   # ON: global-limit approximation ($50k) until per-jurisdiction limits land
  civic_approval_limit: 50000
  civic_structuring_band: 0.1

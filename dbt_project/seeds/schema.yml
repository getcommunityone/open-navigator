version: 2

seeds:
  - name: topic_legislation_vocabulary
    description: >
      Category vocabulary for state bills per curated topic, keyed by topic_query_id; '*' is the generic set used
      by every topic without its own rows. Served via the topic_legislation_category mart (the seed has a
      different name so the two never collide).
    columns:
      - name: topic_query_id
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: display_order
      - name: label
      - name: description

  - name: topic_legislation_rule
    description: >
      Ordered keyword rules that pick a state bill's category. pattern is a Postgres regex matched against the
      bill's lowercased title + abstract; the first matching rule by rule_order wins. An empty category leaves the
      bill out. '*' rules apply to topics without their own. Documented in
      web_docs/docs/development/topic-legislation-map.md.
    columns:
      - name: topic_query_id
        tests: [not_null]
      - name: rule_order
        tests: [not_null]
      - name: category
        description: "A category from topic_legislation_category for the same topic, or empty to leave the bill out."
      - name: pattern
        tests: [not_null]
      - name: note

  - name: topic_legislation_scope
    description: >
      Extra per-topic filters on bills: require_pattern must match, exclude_pattern must not ('*' exclude applies
      to every topic), and drop_keywords (pipe-separated) are topic keywords that misfire on bills and are not used
      to match them (they still apply to meetings).
    columns:
      - name: topic_query_id
        tests: [unique, not_null]
      - name: require_pattern
      - name: exclude_pattern
      - name: drop_keywords
      - name: note

  - name: tax_foundation_sales_tax_rates
    config:
      column_types:
        state_code: text
        state: text
        state_sales_tax_rate: numeric
        avg_local_sales_tax_rate: numeric
        combined_sales_tax_rate: numeric
        combined_rank: integer
        max_local_sales_tax_rate: numeric
        as_of_date: date
        vintage_year: integer
    description: >
      Combined state + average-local general sales-tax rates by state (50 states +
      DC), from the Tax Foundation report "State and Local Sales Tax Rates, 2026"
      (https://taxfoundation.org/data/all/state/sales-tax-rates/), as of
      2026-01-01. Rates are PERCENTAGES exactly as published (e.g. 9.46 = 9.46%);
      avg_local is population-weighted and can be slightly negative where the
      state mandates reduced-rate zones (e.g. New Jersey UEZ). Census publishes
      sales-tax revenue but NOT rates, so this is the standard free rate source.
      Feeds public.state_sales_tax_rate. Refresh annually: re-pull the report's
      table, replace this CSV, then `dbt seed --select tax_foundation_sales_tax_rates`.
    columns:
      - name: state_code
        description: "2-letter postal code (PK)."
        tests:
          - unique
          - not_null
      - name: state
        description: "Full state name."
        tests: [not_null]
      - name: state_sales_tax_rate
        description: "State-level statutory sales-tax rate, percent."
        tests: [not_null]
      - name: avg_local_sales_tax_rate
        description: "Population-weighted average local sales-tax rate, percent."
        tests: [not_null]
      - name: combined_sales_tax_rate
        description: "Published combined state + average-local rate, percent."
        tests: [not_null]
      - name: combined_rank
        description: "Tax Foundation rank by combined rate (1 = highest). NULL for DC."
      - name: max_local_sales_tax_rate
        description: "Highest local rate found in the state, percent."
      - name: as_of_date
        description: "Effective date of the published rates."
      - name: vintage_year
        description: "Report vintage year."

  - name: jurisdiction_website_domain_denylist
    description: >
      Lowercase hostname only (no scheme). Rows are removed from int_jurisdiction_websites for every
      source where domain_name matches. Curate manually for verified wrong or non-governmental hosts.
    columns:
      - name: domain
        description: "FQDN to exclude, e.g. wilcoxcountyal.gov"

  - name: curated_topics
    description: >
      Hand-authored, editorial topics unioned into the CivicSearch topic
      taxonomy (stg_civicsearch__topic -> public.civicsearch_topic, source =
      'curated'), so Browse Topics, topic pills, meeting_topic_link and the
      topic counts treat them like the CivicSearch topics (issue #500).
      topic_id RANGE: curated ids start at 100000. CivicSearch ids are small
      integers (max 121 today), so a curated id can never collide with one;
      the next curated topic takes the next free id (100002, ...).
      keywords are SPECIFIC phrases (unlike CivicSearch's generic keyword_stats),
      so the transcript keyword models count a single phrase hit as a match for
      a curated topic (CivicSearch topics need >= 2 distinct phrases), the same
      rule question_transcript_link uses for curated question aliases.
      After editing: dbt seed --select curated_topics && dbt build --select stg_civicsearch__topic+.
    columns:
      - name: topic_id
        description: "Curated topic id. Integer, unique, >= 100000 (never collides with a CivicSearch topic_id)."
        tests:
          - unique
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 100000
      - name: name
        description: "Topic label shown on Browse Topics (e.g. 'Data centers')."
        tests:
          - unique
          - not_null
      - name: query_id
        description: "URL-safe slug for the topic (e.g. 'data-centers')."
        tests:
          - unique
          - not_null
      - name: keywords
        description: "Pipe-delimited keyword phrases matched against transcripts and decisions (e.g. 'data center|data centre|hyperscale')."
        tests:
          - not_null

  - name: curated_policy_questions
    description: >
      Hand-authored, editorial "featured" policy questions unioned into
      public.policy_question as is_featured=true rows. NOT LLM-clustered. Real,
      hand-verified decisions can be attached via the curated_question_instance
      seed; rollup/comparative counts then reflect ONLY those verified instances
      (a featured question with no curated instances shows an honest empty rollup —
      never fabricated numbers). question_id is derived in the mart as
      md5(primary_theme || '|' || canonical_text), matching the clustered PK
      convention. topic_code/cofog_code are intentionally empty until curated.
      After editing: dbt seed --select curated_policy_questions && dbt run --select policy_question.
    columns:
      - name: canonical_text
        description: "The featured question phrased neutrally; verbatim editorial copy."
        tests:
          - unique
          - not_null
      - name: primary_theme
        description: "Coarse COFOG theme bucket; part of the md5 question_id."
        tests:
          - not_null
      - name: topic_code
        description: "CAP topic code; left empty for editorial questions (relationships test is warn/null-tolerant)."
      - name: cofog_code
        description: "COFOG code; left empty for editorial questions."
      - name: display_order
        description: "1-based sort order for the featured row on the home page / search."
        tests:
          - unique
          - not_null
      - name: aliases
        description: >
          Optional pipe-delimited ('|') list of alternate search terms for the
          question (e.g. brand/colloquial names that no longer appear in the
          neutral canonical_text). Split into a text[] in the policy_question
          mart and matched alongside canonical_text by /search. Empty for most
          rows; e.g. the short-term-rental question carries 'airbnb|vrbo'.

  - name: curated_question_instance
    description: >
      Hand-verified, genuinely on-topic real local decisions attached to a curated
      featured question (curated_policy_questions). Each row is a REAL event_decision
      (source_id = event_decision_id) whose denormalized fields (state/jurisdiction/
      city/outcome/occurred_at) were captured verbatim from public.event_decision —
      no fabricated instances. Unioned into stg_question_instance as
      source_type='local_decision'; the existing outcome normalization + rollup then
      produce the comparative counts for the featured question. A featured question
      with no rows here stays honestly empty. Survives the LLM clustering rebuild,
      which only truncates the bronze_* tables, not seeds.
      After editing: dbt seed --select curated_question_instance &&
      dbt run --select stg_question_instance int_policy_question_rollup policy_question question_instance.
    columns:
      - name: question_id
        description: "Curated featured question this decision instantiates (md5 PK from curated_policy_questions)."
        tests:
          - not_null
      - name: source_id
        description: "Real public.event_decision.event_decision_id. Together with question_id forms the instance PK."
        tests:
          - not_null
      - name: state_code
        description: "2-letter state of the decision (verbatim from event_decision; may be empty when source is null)."
      - name: jurisdiction_name
        description: "Jurisdiction of the decision (verbatim from event_decision; may be empty)."
      - name: city
        description: "City of the decision (verbatim from event_decision; may be empty)."
      - name: outcome_raw
        description: >
          Short factual decision outcome taken from the record: event_decision.outcome
          verbatim, or (when that alone is ambiguous, e.g. "Adopted" for a moratorium)
          a short phrase from the decision's own headline/statement such as
          "Moratorium adopted", "Moratorium proposed", "Regulations adopted",
          "Discussed". Never an invented outcome. Normalized in stg_question_instance.
      - name: occurred_at
        description: "When the decision was recorded (event_decision.extracted_at)."

  - name: youtube_channel_attribution_override
    description: >
      Hand-reviewed corrections for YouTube channels that discovery filed under the
      wrong government (#514, #515). One row per channel (video_id empty: the
      channel-wide default) plus optional per-video rows that win over it. An empty
      jurisdiction_id means the video is not attributable to any government (a
      citizen-media channel covering several places): it is served with no
      jurisdiction rather than a guessed one. Evidence is the channel/video title or
      website that proves the attribution. Applied by int_youtube__attribution_override
      in event_youtube_with_jurisdiction (so a re-crawl cannot bring the old
      attribution back into the served feed) and written back to bronze, the channel
      catalogs, civic_event and the append-only event_* marts by the
      repair_youtube_channel_attribution run-operation.
      After editing: dbt seed --select youtube_channel_attribution_override &&
      dbt run --select int_youtube__attribution_override &&
      dbt run-operation repair_youtube_channel_attribution (dry run, then --args '{dry_run: false}').
    columns:
      - name: channel_id
        description: "YouTube channel id (UC...)."
        tests:
          - not_null
      - name: video_id
        description: "YouTube video id; empty for the channel-wide default row."
      - name: jurisdiction_id
        description: "int_jurisdictions.jurisdiction_id the video belongs to; empty = no government."
        tests:
          - relationships:
              arguments:
                to: ref('int_jurisdictions')
                field: jurisdiction_id
      - name: state_code
        description: "2-letter state of the channel/video, used when jurisdiction_id is empty."
        tests:
          - not_null
      - name: issue
        description: "GitHub issue that recorded the misattribution."
      - name: evidence
        description: "Why this attribution is right: the verbatim title(s), handle or website."
        tests:
          - not_null

  - name: policy_theme_cofog
    description: >
      Maps each canonical policy-decision primary_theme label (the 18-label COFOG
      civic-theme vocabulary) to its COFOG code. Single source of truth mirrored from
      packages/llm/src/llm/gemini/policy_themes.py (THEME_TO_COFOG). Joined into
      int_trending_causes_by_jurisdiction to derive cause_code from the bronze label.
      After editing: dbt seed --select policy_theme_cofog.
    columns:
      - name: primary_theme
        description: "Canonical theme label, verbatim from bronze.bronze_policy_decisions.primary_theme"
        tests:
          - unique
          - not_null
      - name: cofog_code
        description: "COFOG-NN code for the theme (e.g. COFOG-01)"
        tests:
          - not_null

  - name: official_contact_override
    config:
      column_types:
        full_name: text
        state_code: text
        jurisdiction: text
        email: text
        is_current: boolean
        source_url: text
        verified_on: date
    description: >
      An official's public contact email, copied verbatim (a mailto link) from their government's own page, and
      corrections to whether they still hold office, each with the page it came from and the date it was checked (#1062).
      Matched on full name + state + jurisdiction and coalesced in contact_official; never guessed from an address
      pattern. Tuscaloosa pilot: six councilors' emails from tuscaloosa.com district pages; Kip Tyner marked no longer
      in office (the council page carries "In Memory of Councilor Kip Tyner" and lists District 5 as vacant).
      After editing: dbt seed --select official_contact_override && dbt build --select contact_official+
    columns:
      - name: full_name
        tests: [not_null]
      - name: state_code
        tests: [not_null]
      - name: jurisdiction
        tests: [not_null]
      - name: source_url
        description: 'The government page the email (or the office change) appears on.'
        tests: [not_null]
      - name: verified_on
        tests: [not_null]

  - name: official_term
    config:
      column_types:
        full_name: text
        state_code: text
        jurisdiction: text
        role: text
        district: text
        start_date: date
        start_year: integer
        end_date: date
        end_year: integer
        end_reason: text
        source_url: text
        verified_on: date
    description: >
      Office terms stated on a government's own page (#1068): start and end (the day when the page gives one, else the
      year), why the term ended, and leadership roles, each with the page and the date checked. 'died' only when the
      official source says so. Tuscaloosa from tuscaloosa.com: Kip Tyner (District 5 from 1997; died 2026-09-18, the
      city's memorial page), Lee Busby (District 4 from the October 2019 special election), Raevan Howard (President Pro
      Tempore from 2026-09-29).
    columns:
      - name: full_name
        tests: [not_null]
      - name: role
        tests: [not_null]
      - name: source_url
        tests: [not_null]
      - name: verified_on
        tests: [not_null]

  - name: official_photo_override
    # Pin text types: biography/source_url are often all-empty on first seed, which
    # otherwise infers to integer and breaks trim()/coalesce in downstream models.
    config:
      column_types:
        full_name: text
        state_code: text
        photo_url: text
        biography: text
        source_url: text
    description: >
      Manual/scraped headshot URL and biography for officials whose source
      (OpenStates) carries neither — e.g. mayors, whose photo and bio live on a
      city department / "meet the <office>" page, not the council page. LEFT
      JOINed into contact_official and coalesced over photo_url + biography
      (matched on lower(full_name) + state_code), so it patches the existing row
      without duplicating it. Regenerate from city sites via
      scrapers.municipal.council_roster.scrape_official_profile (OFFICIAL_PROFILE_SOURCES),
      e.g. `python -m scrapers.municipal.council_roster --profiles atlanta`;
      photo_url carries a Drupal ?itok= token that can expire — re-scrape to refresh.
      After editing: dbt seed --select official_photo_override && dbt run --select contact_official
    columns:
      - name: full_name
        description: "Official's full name; matched case-insensitively to contact_official.full_name"
        tests:
          - not_null
      - name: state_code
        description: "2-letter USPS code, disambiguates same-named officials across states"
        tests:
          - not_null
      - name: photo_url
        description: "Absolute headshot URL (https://…)"
        tests:
          - not_null
      - name: biography
        description: "Scraped biography prose for the official; nullable (empty when only a photo is overridden)"
      - name: source_url
        description: "Page the photo/bio was scraped from (provenance)"

  - name: interestingness_weights
    description: >
      Tunable per-component weights for public.item_interestingness. One row per
      component; the composite is a weight-normalized average so retuning never
      breaks the 0–100 bound. Read via the civic_component_weights() macro — never
      hardcoded in a model. After editing: dbt seed --select interestingness_weights
      && dbt run --select item_interestingness. Keep the component set in sync with
      the macro and int_civic__item_signal_norms.
    config:
      column_types:
        component: text
        weight: double precision
    columns:
      - name: component
        description: "Component name: conflict|money|novelty|engagement|surprise|urgency|buried"
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['conflict', 'money', 'novelty', 'engagement', 'surprise', 'urgency', 'buried']
      - name: weight
        description: "Non-negative weight; the set is normalized by its sum at score time."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1

  - name: lens_config
    description: >
      Drives the per-lens serving feed (rank_for_user macro): one row per story
      lens. eligibility_sql + sort_expr are SQL fragments evaluated against
      item_interestingness columns, so adding/retuning a lens is a config change,
      not new SQL. After editing: dbt seed --select lens_config.
    config:
      column_types:
        lens_id: text
        eligibility_sql: text
        sort_expr: text
        direction: text
    columns:
      - name: lens_id
        description: "Lens key: default|contested|money|new|people|changed|soon|slipped|near"
        tests:
          - unique
          - not_null
      - name: eligibility_sql
        description: "Boolean SQL fragment over item_interestingness columns (lens eligibility filter)."
        tests:
          - not_null
      - name: sort_expr
        description: "Column/expression the lens sorts by (default feed -> interestingness_score)."
        tests:
          - not_null
      - name: direction
        description: "Sort direction for sort_expr."
        tests:
          - not_null
          - accepted_values:
              values: ['asc', 'desc']

  - name: jurisdiction_website_url_overrides
    description: >
      Manual canonical website per jurisdiction_id when bronze/GSA/NACo rows are missing or wrong.
      Rows are unioned into int_jurisdiction_websites with website_source = override and win first in
      downstream URL pickers. After editing: dbt seed --select jurisdiction_website_url_overrides &&
      dbt run --select int_jurisdiction_websites
    columns:
      - name: jurisdiction_id
        description: "Primary key matching int_jurisdictions (e.g. county_01093)"
      - name: website_url
        description: "Full site URL (https://…); normalized like other sources"

  - name: data_center_operators
    config:
      column_types:
        operator_name: text
        aliases: text
        meeting_aliases: text
        source_kind: text
        source_url: text
        source_passage: text
    description: >
      Curated data center operators and developers (#508), matched against a data center
      decision's own headline / decision_statement by decision_company_mention (and, #525,
      against the meeting passages tied to the decision, under a developer cue). aliases is a
      '|'-separated list of the exact, case-sensitive forms that name the company. A brand
      name that is also an ordinary word (Switch, Stack, Compass, Aligned, Vantage, Meta,
      Oracle, Tract) is listed only in a company form ("Switch, Inc.", "Stack
      Infrastructure", "Meta Platforms", "Meta's", "Oracle Cloud"), never as the bare word.
      A row here also governs an Epoch AI owner/user name of the same spelling, so Epoch's
      bare "Meta" or "Cursor" (an Epoch user name that is an ordinary word) never matches.
      Add a company by adding a row; keep only real company names.
    columns:
      - name: operator_name
        description: "Company name as shown on the page (PK)."
        tests:
          - unique
          - not_null
      - name: aliases
        description: "'|'-separated exact forms that name it, matched as whole words/phrases."
        tests: [not_null]
      - name: meeting_aliases
        description: >
          '|'-separated forms that name the company ONLY in a meeting passage, and only
          under a developer cue ("on behalf of X", "teamed up with X", "X is a ... developer").
          Used for a bare word that is also ordinary English (Powerhouse); never matched in a
          decision's headline or statement.
      - name: source_kind
        description: "meeting_passage for a row added from a meeting's own words (#525); blank for the original curated rows."
      - name: source_url
        description: "The recording at the moment the passage is said. Required when source_kind is meeting_passage."
        tests:
          - not_null:
              config:
                where: "source_kind = 'meeting_passage'"
      - name: source_passage
        description: "The verbatim transcript words that name the company. Required when source_kind is meeting_passage."
        tests:
          - not_null:
              config:
                where: "source_kind = 'meeting_passage'"

  - name: company_foundation
    config:
      column_types:
        company_key: text
        company_name: text
        foundation_ein: text
        foundation_name: text
        relationship: text
        source_url: text
        source_excerpt: text
        verified_on: date
    description: >
      Companies we track and the nonprofit foundations tied to them (#1073), so the foundation's IRS 990 Schedule I
      grants (the grant mart) can be shown on the company's page. One row per (company_key, foundation_ein). A row is
      added only when the foundation's EIN is a grantor in the grant mart AND a public source ties it to the company;
      source_url / source_excerpt quote that source verbatim. relationship says how: founded_by_company (the company
      started it; it is a separate 501(c)(3)), governed_by_company (its board is the company's executives), or
      controls_company (the nonprofit controls the company, e.g. the OpenAI Foundation). The grant mart holds 990
      public-charity filers only, so private foundations that file a 990-PF (Google Foundation, Motorola Solutions
      Foundation, ...) cannot be linked yet. company_key matches topic_company.company_key; the company's
      master_org_id is resolved from there in company_grant, not stored here. Never a guessed EIN.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [company_key, foundation_ein]
    columns:
      - name: company_key
        description: "The company's slug in topic_company (data center, short-term rental or topic company)."
        tests: [not_null]
      - name: company_name
        tests: [not_null]
      - name: foundation_ein
        description: "9-digit EIN, no dash, as grant.grantor_ein holds it. Unique: one company per foundation, so a grant has one company (company_grant's PK is grant_id)."
        tests: [unique, not_null]
      - name: foundation_name
        tests: [not_null]
      - name: relationship
        tests:
          - not_null
          - accepted_values:
              values: ['founded_by_company', 'governed_by_company', 'controls_company']
      - name: source_url
        tests: [not_null]
      - name: source_excerpt
        description: "Verbatim sentence from source_url that ties the foundation to the company."
        tests: [not_null]
      - name: verified_on
        description: "Date the source was read."
        tests: [not_null]
  - name: short_term_rental_companies
    config:
      column_types:
        company_key: text
        company_name: text
        aliases: text
        match_terms: text
        roles: text
        website_url: text
        source_kind: text
        source_url: text
        source_excerpt: text
    description: >
      Curated short-term rental platform companies (#1015): Airbnb, Expedia Group (Vrbo, HomeAway) and Booking
      Holdings (Booking.com). Each row enters the organization master as org_type 'company'
      (stg_short_term_rental_companies__org -> mdm_organization) and gets a row in the
      mdm_organization_short_term_rental satellite. match_terms ('|'-separated, lowercase) are the words that name
      the company in a transcript or decision. Every row cites the company's own page (source_url) with a verbatim
      source_excerpt. Add only real companies a source names; never a guessed website.
    columns:
      - name: company_key
        description: "Stable slug (PK), e.g. airbnb."
        tests: [unique, not_null]
      - name: company_name
        description: "The company's name as it is commonly written."
        tests: [unique, not_null]
      - name: aliases
        description: "'|'-separated exact forms that name it (brands included, e.g. Vrbo)."
      - name: match_terms
        description: "'|'-separated lowercase full-text terms matched against transcripts and decisions."
        tests: [not_null]
      - name: roles
        description: "'|'-separated roles; short_term_rental_platform."
        tests: [not_null]
      - name: website_url
        description: "The company's own website."
      - name: source_kind
        description: "company_page: the company's own website."
        tests: [not_null]
      - name: source_url
        description: "The page the excerpt is from."
        tests: [not_null]
      - name: source_excerpt
        description: "Verbatim text from source_url."
        tests: [not_null]
  - name: data_center_job_sources
    config:
      column_types:
        job_source_id: text
        name: text
        url: text
        kind: text
        description: text
        description_source_url: text
        automated_access: text
        checked_on: date
    description: >
      Where data center jobs are tracked (#1019), cited on the jobs screen. kind: official_statistics, job_board or
      association. description is the site's own words, verbatim from description_source_url (blank when none was
      read). automated_access records what we found on checked_on: public_data (we load it), prohibited_by_terms
      (its terms forbid scraping or automated access; cited only), not_pulled (cited only: no listings, republished
      listings, or the board could not be read). Job listings are never scraped from a board whose terms forbid it.
    columns:
      - name: job_source_id
        description: "Stable slug (PK)."
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: url
        tests: [not_null]
      - name: kind
        tests:
          - not_null
          - accepted_values:
              values: ['official_statistics', 'job_board', 'association']
      - name: description
        description: "The site's own words (verbatim)."
      - name: description_source_url
      - name: automated_access
        tests:
          - not_null
          - accepted_values:
              values: ['public_data', 'prohibited_by_terms', 'not_pulled']
      - name: checked_on
        description: "When the terms and robots.txt were read."
  - name: data_center_companies
    config:
      column_types:
        company_key: text
        company_name: text
        aliases: text
        roles: text
        website_url: text
        press_feed_url: text
        source_kind: text
        source_url: text
        source_excerpt: text
    description: >
      Curated data center companies (#531): operators, developers, owners, tenants/users and
      utility partners. Each row enters the organization master as org_type 'company'
      (stg_data_center_companies__org -> mdm_organization) and gets a row in the
      mdm_organization_data_center satellite. A company has no city or state here, so it
      clusters with a same-name national mention already in the master (the AI-extracted
      "Google") instead of duplicating it. Every row carries source_url and a verbatim
      source_excerpt; source_kind is company_announcement, news_article or dataset_row
      (a quoted field of a published dataset, "<row> | <field>: <value>"). Add only real
      companies a source names; never a guessed website or feed.
    columns:
      - name: company_key
        description: "Stable slug (PK), e.g. applied-digital."
        tests: [unique, not_null]
      - name: company_name
        description: "The company's name as it is commonly written."
        tests: [unique, not_null]
      - name: aliases
        description: "'|'-separated exact forms that name it."
      - name: roles
        description: "'|'-separated roles: developer, operator, owner, tenant, user, utility."
        tests: [not_null]
      - name: website_url
        description: "The company's own website; blank when not confirmed."
      - name: press_feed_url
        description: "RSS feed of the company's press releases / investor news, when public and confirmed."
      - name: source_kind
        tests:
          - not_null
          - accepted_values:
              values: ['company_announcement', 'news_article', 'dataset_row']
      - name: source_url
        tests: [not_null]
      - name: source_excerpt
        description: "Verbatim text from source_url that names the company."
        tests: [not_null]

  - name: local_news_feeds
    config:
      column_types:
        feed_id: text
        outlet: text
        state_code: text
        feed_url: text
        robots_checked_on: date
        robots_allowed: boolean
        enabled: boolean
        note: text
    description: >
      Local news RSS/Atom feeds the data center meeting finder reads (#549), starting with the
      states that have tracked data center projects. One row per feed. The loader
      (`python -m ingestion.data_centers.community_events --source rss`) reads only rows that
      are enabled and whose robots.txt check allowed the feed path for its User-Agent, and
      checks robots.txt again live before fetching. robots_checked_on / robots_allowed are
      written by `python -m ingestion.data_centers.news_feeds --check-robots`. A feed_url with
      {term} is an outlet's own topic feed, expanded per tracked company name and project
      place. A row with no feed_url records an outlet with no published feed; a disabled row
      records why (note), e.g. a feed that answers HTTP 429 to automated clients. Never add a
      search engine's feed (Google News RSS is disallowed by its robots.txt).
    columns:
      - name: feed_id
        description: "Stable slug (PK), e.g. abc3340-local."
        tests: [unique, not_null]
      - name: outlet
        description: "The news outlet as it names itself."
        tests: [not_null]
      - name: state_code
        description: "Two-letter state the outlet covers."
        tests: [not_null]
      - name: feed_url
        description: "The feed URL; blank when the outlet publishes none."
      - name: robots_checked_on
        description: "Date robots.txt was last checked for the feed path."
      - name: robots_allowed
        description: "Whether robots.txt allowed the feed path for the loader's User-Agent on that date (403, 429 or a bot challenge in place of robots.txt counts as not allowed)."
        tests: [not_null]
      - name: enabled
        description: "false keeps a feed listed but unread (see note)."
        tests: [not_null]
      - name: note
        description: "Why a feed is disabled or blank, or what kind of feed it is."

  - name: data_center_hearing_lead
    config:
      column_types:
        lead_id: text
        meeting_date: date
        jurisdiction_name: text
        state_code: text
        body_name: text
        topic: text
        source_kind: text
        source_name: text
        source_url: text
        lead_from: text
    description: >
      Leads on upcoming local government data center hearings (#955), one row per claimed
      meeting, as collected from the owner's research lists (owner_list_1, owner_list_2, or both).
      A lead is a CLAIM, never shown as fact: only a row whose source_url is an official
      government page, fetched by ingestion.data_centers.fetch_hearing_sources and found to
      state the date and a data center word, becomes a verified hearing in data_center_hearing.
      source_kind: official (a government page), tracker (a third-party tracker named as the
      source, no URL kept), news, or none. Tracking parameters (utm_*) are stripped from URLs.
      body_name keeps the list's wording; "(as listed)" marks a body the list probably got wrong.
    columns:
      - name: lead_id
        tests: [unique, not_null]
      - name: meeting_date
        tests: [not_null]
      - name: state_code
        tests: [not_null]
      - name: source_kind
        tests:
          - accepted_values:
              values: ['official', 'tracker', 'news', 'none']
  - name: data_center_projects
    config:
      column_types:
        project_key: text
        project_name: text
        developer_key: text
        operator_key: text
        tenant_key: text
        area: text
        city: text
        county: text
        state_code: text
        status: text
        announced_on: text
        data_center_site_name: text
        source_kind: text
        source_url: text
        source_excerpt: text
        company_source_url: text
        company_source_excerpt: text
        announced_source_url: text
        announced_source_excerpt: text
        tenant_source_url: text
        tenant_source_excerpt: text
    description: >
      Curated data center projects (#531) found in company announcements and news, one row
      per project, each with the source that names it (source_url + verbatim
      source_excerpt). developer_key / operator_key / tenant_key are company_keys from
      data_center_companies, blank when no source names one. city / county / state_code
      only as a source states them. data_center_site_name names the Epoch AI site when the
      project is one (folded into data_center_project instead of repeated).
      company_source_url / company_source_excerpt source the developer / operator, and
      tenant_source_url / tenant_source_excerpt the tenant, when a different passage names them. Figures go in
      data_center_project_figures, one row per figure and source.
    columns:
      - name: project_key
        tests: [unique, not_null]
      - name: project_name
        tests: [not_null]
      - name: developer_key
        tests:
          - relationships: {arguments: {to: ref('data_center_companies'), field: company_key}}
      - name: operator_key
        tests:
          - relationships: {arguments: {to: ref('data_center_companies'), field: company_key}}
      - name: tenant_key
        tests:
          - relationships: {arguments: {to: ref('data_center_companies'), field: company_key}}
      - name: data_center_site_name
        description: "The Epoch AI site this project is (data_center_site.site_name); blank when none."
        tests:
          - relationships: {arguments: {to: ref('data_center_site'), field: site_name}}
      - name: status
        description: "announced, planned, under_construction, operating or cancelled; blank when no source says."
        tests:
          - accepted_values:
              values: ['announced', 'planned', 'under_construction', 'operating', 'cancelled']
      - name: announced_on
        description: "Date (YYYY-MM-DD) the announcement is dated; blank when no source dates it. Requires announced_source_url / announced_source_excerpt (the passage that dates it)."
      - name: source_kind
        tests:
          - not_null
          - accepted_values:
              values: ['company_announcement', 'news_article', 'dataset_row']
      - name: source_url
        tests: [not_null]
      - name: source_excerpt
        tests: [not_null]

  - name: data_center_project_figures
    config:
      column_types:
        project_key: text
        metric: text
        value: numeric
        unit: text
        source_kind: text
        source_url: text
        source_excerpt: text
        published_on: text
    description: >
      One row per figure a source states about a curated data center project (#531).
      Sources that disagree each get their own row; nothing is averaged or picked.
      value is the number the excerpt states, in unit (e.g. "$3.2 billion" -> 3200000000 usd).
    columns:
      - name: project_key
        tests:
          - not_null
          - relationships:
              to: ref('data_center_projects')
              field: project_key
      - name: metric
        tests:
          - not_null
          - accepted_values:
              values: ['investment_usd', 'it_mw', 'utility_mw', 'acres', 'square_feet', 'jobs']
      - name: value
        tests: [not_null]
      - name: unit
        tests:
          - not_null
          - accepted_values:
              values: ['usd', 'mw', 'acres', 'sq_ft', 'jobs']
      - name: source_url
        tests: [not_null]
      - name: source_excerpt
        description: "Verbatim text from source_url that states the figure."
        tests: [not_null]
      - name: published_on
        description: "The source's publication date (YYYY-MM-DD), when it gives one."
  - name: comment_concern_terms
    description: >
      #1233: per-comment concern keyword patterns (Postgres regex, matched on lower(comment_text)), by topic.
      data-centers rows follow the reference category list (in_reference_list = true); extra categories we track
      are in_reference_list = false and are left out of the multi-concern share.
    columns:
      - name: concern_key
        tests: [unique, not_null]
  - name: comment_entity_terms
    description: "#1233: companies, public figures and AI terms a comment names (regex on lower(comment_text))."
    columns:
      - name: entity_key
        tests: [unique, not_null]
  - name: comment_role_terms
    description: >
      #1233: self-described roles matched on the comment's introduction. is_public_comment = false marks staff,
      the applicant and consultants (left out of public comments); possible_minor drops the display name.
    columns:
      - name: role_key
        tests: [unique, not_null]
  - name: comment_place_patterns
    description: "#1233 phase 1b: case-sensitive regex shapes of public places (roads, schools, counties, sites)."
    columns:
      - name: pattern_key
        tests: [unique, not_null]

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /app/logs/nginx-access.log;
    error_log /app/logs/nginx-error.log;
    
    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    upstream fastapi_backend {
        server 127.0.0.1:8000;
    }
    
    server {
        listen 7860;
        server_name _;
        
        # Force HTTPS - HSTS header tells browsers to ALWAYS use HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Additional security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Documentation - serve static files built by Docusaurus
        # Use root instead of alias to avoid path issues
        location /docs {
            root /app/static;
            try_files $uri $uri/index.html $uri.html /docs/index.html;
            
            # Cache static assets - shorter for easier updates
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1d;
                add_header Cache-Control "public, max-age=86400";
            }
        }
        
        # API backend at /api/
        location /api/ {
            proxy_pass http://fastapi_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
        
        # API docs: the app serves its Swagger UI at /api/docs itself (api/main.py sets
        # docs_url=None and adds a custom /api/docs route), so pass the path through (#281).
        location = /api/docs {
            proxy_pass http://fastapi_backend/api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # API OpenAPI schema - support both /api/openapi.json and /openapi.json
        location ~ ^/(api/)?(openapi\.json|redoc) {
            proxy_pass http://fastapi_backend/$2;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # SEO: robots.txt (do not reuse sitemap MIME — crawlers expect text/plain)
        location = /robots.txt {
            root /app/static/frontend;
            default_type text/plain;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        # SEO: XML sitemaps (#1430). FastAPI builds them from the real public routes and the live stories, with
        # real lastmod dates (api/seo.py), so they never go stale like the old hand-written files.
        location ~ ^/sitemap.*\.xml$ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA pages (#1430): a path with no file behind it gets the React shell from FastAPI, with that page's own
        # <title>, description, canonical and OpenGraph tags, so crawlers and link previews see them without JS.
        # If the API is down, fall back to the plain static shell so the site still loads.
        location @spa {
            rewrite ^ /api/spa-shell break;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 15s;
            proxy_intercept_errors on;
            error_page 404 500 502 503 504 = @spa_static;
            proxy_pass http://fastapi_backend;
        }

        location @spa_static {
            root /app/static/frontend;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /index.html =404;
        }
        
        # Frontend assets - shorter cache for easier updates
        location /assets/ {
            alias /app/static/frontend/assets/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }
        
        # Favicon — proxy to FastAPI so missing binary .ico can fall back to SVG/PNG
        location = /favicon.ico {
            proxy_pass http://fastapi_backend/favicon.ico;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main frontend app at root
        location / {
            root /app/static/frontend;
            try_files $uri $uri/ @spa;
            
            # NEVER cache index.html - force browser to check for new version
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
            
            # Service worker files are never cached (#913, #918). The app is a PWA: a phone keeps serving the old
            # site from its cache until it sees a new sw.js. This rule must stay INSIDE `location /` and BEFORE
            # the static-file rule below: nginx tries the nested regex rules of the matched prefix first, in
            # order, so a server-level rule never sees /sw.js.
            location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                try_files $uri =404;
            }

            # Cache hashed assets (immutable) but shorter time for easier updates
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1d;
                add_header Cache-Control "public, max-age=86400";
            }
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}

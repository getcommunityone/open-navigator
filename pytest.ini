[pytest]
testpaths = tests packages/agents packages/ingestion/tests packages/scrapers/tests packages/erd/tests packages/datamodels/tests packages/llm/tests packages/core-lib/tests packages/hosting/tests
pythonpath = . packages/scrapers/src packages/ingestion/src packages/agents packages/core-lib/src packages/erd/src packages/datamodels packages/llm/src packages/hosting/src
python_files = test_*.py
markers =
    live: reaches a live website, the network or a local service (a database, a local model); skipped unless RUN_LIVE_TESTS=1
norecursedirs =
    .git .venv __pycache__ *.egg-info
    archive scripts web_app web_docs apps api infra
    packages/scrapers/src packages/ingestion/src packages/agents packages/core-lib/src packages/erd/src packages/llm/src packages/hosting/src
    # Local-only Drive mount (#612); when unmounted, scandir raises OSError 19.
    open-navigator-backups
filterwarnings =
    ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated.*:DeprecationWarning
